<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticket Farm · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: console da ufficio, menu a sinistra e area di lavoro; su telefono il menu diventa una barra orizzontale.
   Ticket Farm: nero, gradiente blu→turchese per le azioni, oro come accento. */
:root{
  --bg:#000000; --surface:#0c1016; --surface-2:#07090d; --raise:#121821; --ink:#ffffff; --text:#d6dee8; --muted:#9aa7b6; --line:#1a222d;
  --accent:#2aa7ff; --accent-soft:rgba(42,167,255,.13);
  --grad:linear-gradient(135deg,#1e6ff0 0%,#1aa0e8 50%,#19c9b8 100%);
  --gold:#d9ab45; --gold-soft:rgba(217,171,69,.13); --gold-grad:linear-gradient(135deg,#f6dc8a,#d9ab45 55%,#b88424);
  --teal:#19c2c9; --teal-soft:rgba(25,194,201,.13); --red:#ff7a66; --red-soft:rgba(255,122,102,.14); --ok:#20c997; --ok-soft:rgba(32,201,151,.13);
  --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;color:#fff;padding:0 6px}
.logo svg{width:30px;height:30px}
.logo em{font-style:normal;background:linear-gradient(90deg,#2a8ff0,#2aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--raise);color:#fff}
.nav button[aria-current="page"]{background:var(--accent-soft);color:#fff}
.nav .n{font-size:11px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--accent)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px, min(4vw,36px));padding-right:max(16px, env(safe-area-inset-right, 0px), min(4vw,36px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;color:#fff;margin:0;letter-spacing:-.5px;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600;color:#fff;margin:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raise)}
tbody tr.sel td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12px}
.strong{color:#fff;font-weight:600}
.dim{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-ITSM{background:var(--accent-soft);color:var(--accent)}
.s-Halo{background:var(--teal-soft);color:var(--teal)}
.s-O365{background:var(--gold-soft);color:var(--gold)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-new{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--gold-soft);color:var(--gold)}
.p-urg{background:var(--red-soft);color:var(--red)}
.p-mut{background:var(--raise);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;color:#fff}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:0 8px 24px rgba(30,136,240,.3)}
.btn:disabled{opacity:.5;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.detail{position:sticky;top:16px}
.hdrs{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.hdrs span{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.hdrs span.hit{color:var(--gold)}
.body{background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:13.5px}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--line)}
.steps li.ok::before{background:var(--ok)}
.steps li.skip::before{background:var(--raise);border:1px solid var(--line)}
.steps li.warn::before{background:var(--gold)}
.steps li.skip{color:var(--muted)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:#fff;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,select.input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%}
.conns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.conn .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 4px var(--ok-soft)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rules li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;counter-increment:r}
.rules li::before{content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;display:grid;place-items:center}
.rules b{color:#fff;font-weight:600;display:block}
.rules small{color:var(--muted);font-size:12.5px}
.switch{width:40px;height:22px;border-radius:11px;background:var(--line);border:0;position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--grad)}
.bar u{text-decoration:none;text-align:right;font-variant-numeric:tabular-nums;color:#fff}
.lav{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:9px;overflow:hidden;font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h) 55% 42%)}
.lav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:#fff;color:#000;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
  .split,.grid2{grid-template-columns:minmax(0,1fr)}
  .detail{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .logo span{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;gap:6px}
  .side .foot{display:none}
  .conns{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="lgo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e6ff0"/><stop offset=".55" stop-color="#1aa0e8"/><stop offset="1" stop-color="#19c9c9"/></linearGradient><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset=".5" stop-color="#d9ab45"/><stop offset="1" stop-color="#b88424"/></linearGradient></defs><path d="M40 6C25.6 6 15 16.8 15 30.4 15 48 40 70 40 70S65 48 65 30.4C65 16.8 54.4 6 40 6Z" fill="none" stroke="url(#lgo)" stroke-width="5.5" stroke-linejoin="round"/><rect x="27" y="21" width="26" height="19" rx="3.5" fill="none" stroke="url(#lgg)" stroke-width="4"/><path d="M28.5 23.5 L40 32 L51.5 23.5" fill="none" stroke="url(#lgg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ticket<em>Farm</em></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span id="foot-mode">Console · dati di esempio (file aperto senza backend)</span><a id="app-link" href="#" target="_blank" rel="noopener" hidden>Apri l'app del tecnico ↗</a></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const SUPPORT = "support@efuture.it";
const SRC = {ITSM:"ITSM", Halo:"Halo", O365:"Office 365"};
const badge = s => `<span class="pill s-${s}">${SRC[s]}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3000); }

const CLIENTS = [
  {id:"lab", name:"Laboratorio Esempio SA", city:"Lugano", sys:"Halo", dom:"laboratorioesempio.ch", contacts:[{n:"Giulia Bernasconi", src:"Halo", mail:"g.bernasconi@laboratorioesempio.ch", tel:"+41 79 410 22 18"}]},
  {id:"cas", name:"Caseificio Valle SA", city:"Mendrisio", sys:"ITSM", dom:"caseificiovalle.ch", contacts:[{n:"Marco Rossi", src:"O365", mail:"m.rossi@caseificiovalle.ch", tel:"+41 78 655 01 90"}]},
  {id:"acq", name:"Acque Lario Sagl", city:"Chiasso", sys:"Halo", dom:"acquelario.ch", contacts:[{n:"Sara Fontana", src:"O365", mail:"s.fontana@acquelario.ch", tel:""}]},
  {id:"alp", name:"Labor Alpina SA", city:"Bellinzona", sys:"ITSM", dom:"laboralpina.ch", contacts:[{n:"Luca Pedrazzini", src:"ITSM", mail:"l.pedrazzini@laboralpina.ch", tel:"+41 79 233 87 12"}]},
  {id:"che", name:"Chemlab Ticino Sagl", city:"Mezzovico", sys:"ITSM", dom:"chemlab-ticino.ch", contacts:[{n:"Anna Croci", src:"ITSM", mail:"a.croci@chemlab-ticino.ch", tel:"+41 76 118 40 27"}]},
  {id:"far", name:"Farmacia Centrale Locarno", city:"Locarno", sys:"Halo", dom:"farmaciacentrale-locarno.ch", contacts:[{n:"Elena Mariotta", src:"Halo", mail:"e.mariotta@farmaciacentrale-locarno.ch", tel:"+41 79 512 66 03"}]},
  {id:"vin", name:"Vini Collina SA", city:"Taverne", sys:"Halo", dom:"vinicollina.ch", contacts:[{n:"Paolo Ghirlanda", src:"O365", mail:"p.ghirlanda@vinicollina.ch", tel:"+41 76 300 14 59"}]}
];
const cl = id => CLIENTS.find(c=>c.id===id);
/* logo dal dominio del cliente (scaricato dal backend), altrimenti le iniziali */
function logo(c){
  const ini = c.name.replace(/\b(SA|Sagl|Srl|SpA|AG|GmbH)\b/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  let h = 0; for(const ch of c.name) h = (h*31 + ch.charCodeAt(0)) % 360;
  const src = c.dom ? (location.protocol==="file:" ? "https://www.google.com/s2/favicons?sz=128&domain=" : "/api/app/logo?d=") + encodeURIComponent(c.dom) : "";
  return `<span class="lav" style="--h:${h}" aria-hidden="true">${esc(ini)}${src?`<img src="${src}" alt="" loading="lazy" onload="if(this.naturalWidth&&this.naturalWidth<=16)this.remove()" onerror="this.remove()">`:""}</span>`;
}
const TECHS = [
  {ini:"MB", name:"Tecnico Zona Sud", mail:"mb@efuture.it", zona:"Sud", app:true, last:"08:20"},
  {ini:"LC", name:"Tecnico Zona Centro", mail:"lc@efuture.it", zona:"Centro", app:true, last:"ieri"},
  {ini:"GN", name:"Tecnico Zona Nord", mail:"gn@efuture.it", zona:"Nord", app:false, last:"—"}
];

function fresh(){
  return {
    view:"cruscotto", sel:null, filt:"tutti", tfilt:"tutti", seq:31,
    rules:[
      {k:"reply", t:"Risposta a una mail del ticket", d:"In-Reply-To o References contiene l'identificativo di una mail mandata da ITSM o Halo", on:true},
      {k:"subj", t:"Numero del ticket nell'oggetto", d:"Oggetto con «Tck #714139» (ITSM) o «HALO-4821» (Halo)", on:true},
      {k:"hdr", t:"Cliente indicato dall'app del tecnico", d:"Intestazione X-TicketFarm-Cliente nelle mail che partono dall'app", on:true},
      {k:"from", t:"Mittente è un contatto noto", d:"Indirizzo presente nei contatti di ITSM, Halo o Office 365", on:true},
      {k:"dom", t:"Dominio del mittente", d:"Es. @caseificiovalle.ch porta a Caseificio Valle SA", on:true}
    ],
    tickets:[
      {id:"Tck #714139", sys:"ITSM", client:"cas", title:"Analizzatore latte: letture instabili", state:"In lavorazione", tech:"MB", urg:true, origin:"ITSM", upd:"08:20"},
      {id:"Tck #714133", sys:"ITSM", client:"che", title:"Titolatore: taratura annuale", state:"Pianificato", tech:"MB", origin:"ITSM", upd:"ieri"},
      {id:"Tck #714128", sys:"ITSM", client:"alp", title:"HPLC: manutenzione ordinaria", state:"Chiuso", tech:"LC", origin:"Mail cliente", upd:"ven"},
      {id:"HALO-4821", sys:"Halo", client:"lab", title:"Spettrofotometro: errore lampada", state:"Pianificato", tech:"MB", origin:"WhatsApp tecnico", upd:"07:40"},
      {id:"HALO-4799", sys:"Halo", client:"far", title:"Bilancia analitica: guasto", state:"In attesa ricambio", tech:"MB", origin:"Telefono", upd:"ven"},
      {id:"HALO-4812", sys:"Halo", client:"vin", title:"Ordine reagenti e agenti", state:"Aperto", tech:"", origin:"Mail cliente", upd:"ieri"}
    ],
    mails:[
      {id:1, at:"08:20", from:"mb@efuture.it", fromName:"Tecnico Zona Sud", subj:"Re: Tck #714139 - Analizzatore latte: letture instabili",
       hdr:[["In-Reply-To","<Ws7WB6YiYyB2lUu50cay1nFeKHjUiw5YWv2h8WHnx4T@itsm.efuture.it>"],["References","<Ws7WB6YiYyB2lUu50cay1nFeKHjUiw5YWv2h8WHnx4T@itsm.efuture.it>"],["X-TicketFarm-Ora-Messaggio","9/11/2026 07:51"],["X-TicketFarm-Origine","WhatsApp del tecnico"]],
       body:"Buongiorno, l'analizzatore stamattina segna valori di grasso troppo alti\nabbiamo già rifatto la calibrazione ma niente\nriuscite a passare oggi?",
       res:{state:"ok", ticket:"Tck #714139", client:"cas", how:["tech","reply","subj"], act:"Aggiunto a Tck #714139 in ITSM come messaggio del cliente, con l'ora del WhatsApp (07:51)."}},
      {id:2, at:"08:12", from:"mb@efuture.it", fromName:"Tecnico Zona Sud", subj:"Messaggio WhatsApp - Acque Lario Sagl",
       hdr:[["X-TicketFarm-Cliente","Acque Lario Sagl"],["X-TicketFarm-Ora-Messaggio","9/11/2026 08:05"],["X-TicketFarm-Origine","WhatsApp del tecnico"]],
       body:"Salve, sono Sara di Acque Lario. Il pH-metro da banco non si accende più. Lo portiamo noi da voi o passate?",
       res:{state:"new", ticket:"HALO-4830", client:"acq", how:["tech","hdr"], act:"Aperto HALO-4830 in Halo per Acque Lario Sagl e assegnato a MB."}},
      {id:3, at:"07:40", from:"g.bernasconi@laboratorioesempio.ch", fromName:"Giulia Bernasconi", subj:"Re: HALO-4821 - Spettrofotometro: errore lampada",
       hdr:[["In-Reply-To","<p8Hh2kQmL0aZ1x@halo.efuture.it>"]],
       body:"Buongiorno, è possibile un passaggio domani mattina? Grazie.",
       res:{state:"ok", ticket:"HALO-4821", client:"lab", how:["reply","subj"], act:"Aggiunto a HALO-4821 in Halo. Notificato il tecnico MB nell'app."}},
      {id:4, at:"07:31", from:"lc@efuture.it", fromName:"Tecnico Zona Centro", subj:"Messaggio WhatsApp - cliente da identificare",
       hdr:[["X-TicketFarm-Cliente","da identificare"],["X-TicketFarm-Ora-Messaggio","8/11/2026 19:12"],["X-TicketFarm-Origine","WhatsApp del tecnico"]],
       body:"Buonasera, il frigorifero dei campioni non tiene la temperatura, è sui 9 gradi. Domani riuscite?",
       res:{state:"warn", ticket:"", client:"", how:["tech"], act:"Il tecnico non ha trovato il cliente. Scegli il cliente e apri il ticket."}},
      {id:5, at:"07:02", from:"info@nuovolab.ch", fromName:"Nuovo Lab Sagl", subj:"Richiesta preventivo manutenzione",
       hdr:[],
       body:"Buongiorno, vorremmo un preventivo per la manutenzione annuale di due centrifughe.",
       res:{state:"warn", ticket:"", client:"", how:[], act:"Mittente sconosciuto e nessun riferimento a un ticket. Scegli il cliente o crealo in ITSM o Halo."}},
      {id:6, at:"ieri 17:48", from:"m.rossi@caseificiovalle.ch", fromName:"Marco Rossi", subj:"Analizzatore latte",
       hdr:[],
       body:"Buonasera, l'analizzatore dà letture instabili da due giorni. Potete passare?",
       res:{state:"new", ticket:"Tck #714139", client:"cas", how:["from"], act:"Prima mail senza riferimenti: aperto Tck #714139 in ITSM per Caseificio Valle SA."}}
    ]
  };
}
let S = fresh();
let LIVE = false, CONN = null;
const post = (u, b) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)}).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(new Error(j.error || r.status))));

const HOW = {
  tech:"Il mittente è un tecnico registrato: è un messaggio del cliente inoltrato dall'app",
  reply:"In-Reply-To corrisponde a una mail del ticket",
  subj:"Il numero del ticket è nell'oggetto",
  hdr:"X-TicketFarm-Cliente indica il cliente",
  from:"Il mittente è un contatto noto",
  dom:"Il dominio del mittente corrisponde a un cliente"
};
const ST = {ok:["p-ok","Riconosciuta"], new:["p-new","Nuovo ticket"], warn:["p-warn","Da verificare"]};
const toCheck = () => S.mails.filter(m=>m.res.state==="warn").length;

const VIEWS = [["cruscotto","Cruscotto"],["posta","Posta in arrivo"],["ticket","Ticket"],["clienti","Clienti"],["tecnici","Tecnici"],["collegamenti","Collegamenti"],["regole","Riconoscimento"]];
function nav(){
  $("#nav").innerHTML = VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" ${S.view===k?'aria-current="page"':""}>${l}${k==="posta"&&toCheck()?`<span class="n">${toCheck()}</span>`:""}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; S.sel=null; render(); window.scrollTo(0,0); });
}
function render(){ nav(); ({cruscotto,posta,ticket,clienti,tecnici,collegamenti,regole})[S.view](); }

/* ---------- Cruscotto ---------- */
function cruscotto(){
  const open = S.tickets.filter(t=>t.state!=="Chiuso");
  const auto = S.mails.filter(m=>m.res.state!=="warn").length;
  const byTech = TECHS.map(t=>[t.ini+" · "+t.zona, open.filter(x=>x.tech===t.ini).length]);
  const max = Math.max(1,...byTech.map(x=>x[1]));
  const fromApp = S.mails.filter(m=>TECHS.some(t=>t.mail===m.from)).length;
  $("#main").innerHTML = `<div class="top"><div><h1>Cruscotto</h1><p class="sub">Oggi, lunedì 9 novembre. Dati letti da ITSM, Halo e Office 365, posta da ${SUPPORT}.</p></div></div>
    <div class="kpis">
      <div class="kpi"><b>${S.mails.length}</b><span>mail arrivate a ${SUPPORT}</span></div>
      <div class="kpi"><b class="gold">${Math.round(auto/S.mails.length*100)}%</b><span>riconosciute da sole</span></div>
      <div class="kpi"><b>${toCheck()}</b><span>da verificare</span></div>
      <div class="kpi"><b>${open.length}</b><span>ticket aperti</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Da verificare</h2><button class="btn" type="button" id="go-posta">Apri la posta</button></div>
        ${toCheck() ? S.mails.filter(m=>m.res.state==="warn").map(m=>`<div><span class="strong">${esc(m.subj)}</span><div class="dim">${esc(m.fromName)} · ${esc(m.at)}</div></div>`).join("") : `<p class="dim">Niente da verificare: tutte le mail sono state riconosciute.</p>`}
      </div>
      <div class="panel"><h2>Ticket aperti per tecnico</h2><div class="bars">${byTech.map(([n,v])=>`<div class="bar"><span>${n}</span><span><i style="width:${v/max*100}%"></i></span><u>${v}</u></div>`).join("")}</div>
        <p class="note">${fromApp} mail di oggi arrivano dall'app dei tecnici (messaggi WhatsApp o mail dei clienti inoltrati).</p></div>
    </div>`;
  $("#go-posta").onclick = ()=>{ S.view="posta"; render(); };
}

/* ---------- Posta in arrivo ---------- */
function posta(){
  const list = S.mails.filter(m => S.filt==="tutti" || m.res.state===S.filt || (S.filt==="app" && TECHS.some(t=>t.mail===m.from)));
  const m = S.mails.find(x=>String(x.id)===String(S.sel));
  $("#main").innerHTML = `<div class="top"><div><h1>Posta in arrivo</h1><p class="sub">Le mail che arrivano a ${SUPPORT}, dai clienti e dall'app dei tecnici, e come sono state riconosciute.</p></div></div>
    <div class="chips">${[["tutti","Tutte"],["warn","Da verificare"],["new","Nuovo ticket"],["ok","Riconosciute"],["app","Dall'app dei tecnici"]].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filt===k}">${l}</button>`).join("")}</div>
    <div class="split">
      <div class="tbl"><table><thead><tr><th>Esito</th><th>Da</th><th>Oggetto</th></tr></thead><tbody>
        ${list.map(x=>`<tr class="click${String(x.id)===String(S.sel)?" sel":""}" data-m="${x.id}"><td><span class="pill ${ST[x.res.state][0]}">${ST[x.res.state][1]}</span><div class="mono dim" style="margin-top:4px">${esc(x.at)}</div></td><td><span class="strong">${esc(x.fromName)}</span><div class="dim" style="overflow-wrap:anywhere">${esc(x.from)}</div></td><td>${esc(x.subj)}${x.res.ticket?`<div class="dim">${esc(x.res.ticket)}</div>`:""}</td></tr>`).join("") || `<tr><td colspan="3" class="dim">Nessuna mail</td></tr>`}
      </tbody></table></div>
      <div class="detail">${m ? mailDetail(m) : `<div class="panel"><h2>Seleziona una mail</h2><p class="dim">Vedrai le intestazioni lette dal backend, i passaggi del riconoscimento e cosa è stato fatto.</p></div>`}</div>
    </div>`;
  document.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{ S.filt=b.dataset.f; posta(); });
  document.querySelectorAll("tr[data-m]").forEach(r=>r.onclick=()=>{ S.sel=r.dataset.m; posta(); });
  if(m && m.res.state==="warn") wireFix(m);
}
function mailDetail(m){
  const isTech = TECHS.some(t=>t.mail===m.from);
  const keys = isTech ? ["tech","reply","subj","hdr"] : ["reply","subj","from","dom"];
  const c = cl(m.res.client);
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2>${esc(m.subj)}</h2><span class="pill ${ST[m.res.state][0]}">${ST[m.res.state][1]}</span></div>
    <dl class="kv"><dt>Da</dt><dd>${esc(m.fromName)} &lt;${esc(m.from)}&gt;</dd><dt>A</dt><dd>${SUPPORT}</dd><dt>Ricevuta</dt><dd>${esc(m.at)}</dd>
      ${c?`<dt>Cliente</dt><dd>${esc(c.name)} ${badge(c.sys)}</dd>`:""}${m.res.ticket?`<dt>Ticket</dt><dd class="mono">${esc(m.res.ticket)}</dd>`:""}</dl>
    ${m.hdr.length?`<div class="hdrs">${m.hdr.map(([k,v])=>`<span class="${/In-Reply-To|X-TicketFarm-Cliente/.test(k)?"hit":""}">${k}: ${esc(v)}</span>`).join("")}</div>`:`<p class="dim">Nessuna intestazione di Ticket Farm né riferimenti a mail precedenti.</p>`}
    <div class="body">${esc(m.body)}</div>
    <div><h2 style="margin-bottom:8px">Come è stata riconosciuta</h2><ol class="steps">${keys.map(k=>`<li class="${m.res.how.includes(k)?"ok":"skip"}">${HOW[k]}${m.res.how.includes(k)?"":" — no"}</li>`).join("")}</ol></div>
    <p style="margin:0" class="${m.res.state==="warn"?"":"strong"}">${esc(m.res.act)}</p>
    ${m.res.state==="warn" ? `<div class="field"><span>Cliente</span><select class="input" id="fx-client"><option value="">Scegli il cliente…</option>${CLIENTS.map(c=>`<option value="${c.id}">${esc(c.name)} · ${SRC[c.sys]}</option>`).join("")}</select></div>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px;text-transform:none"><input type="checkbox" id="fx-learn" checked style="width:18px;height:18px;accent-color:#2aa7ff"> <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);font-size:13.5px">Ricorda ${isTech?"":"il mittente "+esc(m.from)+" "}per questo cliente</span></label>
      <button class="btn primary" type="button" id="fx-go" disabled>Apri il ticket</button>` : ""}
  </div>`;
}
function wireFix(m){
  const sel = $("#fx-client"), go = $("#fx-go");
  sel.onchange = ()=>{ go.disabled = !sel.value; if(sel.value) go.textContent = "Apri il ticket in "+SRC[cl(sel.value).sys]; };
  go.onclick = ()=>{
    if(LIVE){ go.disabled = true; post("/api/admin/mails/"+encodeURIComponent(m.id)+"/resolve", {client:sel.value}).then(r=>{ m.res = r.mail.res; load(); toast(m.res.act); }).catch(e=>{ go.disabled=false; toast("Non riuscito: "+e.message); }); return; }
    const c = cl(sel.value); const id = c.sys==="Halo" ? "HALO-48"+(++S.seq) : "Tck #7142"+(++S.seq);
    const tech = (TECHS.find(t=>t.mail===m.from)||{}).ini || "";
    S.tickets.unshift({id, sys:c.sys, client:c.id, title:m.subj.replace(/^Messaggio WhatsApp - .*/,"Richiesta da WhatsApp del tecnico"), state:"Aperto", tech, origin: tech?"WhatsApp tecnico":"Mail cliente", upd:"adesso"});
    if($("#fx-learn").checked && !tech) c.contacts.push({n:m.fromName, src:c.sys, mail:m.from, tel:""});
    m.res = {state:"new", ticket:id, client:c.id, how:m.res.how, act:"Aperto "+id+" in "+SRC[c.sys]+" per "+c.name+(tech?" e assegnato a "+tech+". Il tecnico lo vede nell'app.":".")};
    posta(); nav(); toast("Ticket "+id+" aperto in "+SRC[c.sys]);
  };
}

/* ---------- Ticket ---------- */
function ticket(){
  const list = S.tickets.filter(t => S.tfilt==="tutti" || t.sys===S.tfilt || (S.tfilt==="aperti" && t.state!=="Chiuso"));
  $("#main").innerHTML = `<div class="top"><div><h1>Ticket</h1><p class="sub">Letti da ITSM e Halo. Il ticket resta nel suo sistema: Ticket Farm li mostra insieme.</p></div></div>
    <div class="chips">${[["tutti","Tutti"],["aperti","Aperti"],["ITSM","ITSM"],["Halo","Halo"]].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${S.tfilt===k}">${l}</button>`).join("")}</div>
    <div class="tbl"><table><thead><tr><th>Ticket</th><th>Cliente</th><th>Richiesta</th><th>Stato</th><th>Tecnico</th><th>Origine</th><th>Agg.</th></tr></thead><tbody>
      ${list.map(t=>{ const c=cl(t.client); return `<tr><td><span class="mono strong">${esc(t.id)}</span><div>${badge(t.sys)}</div></td><td>${esc(c?c.name:t.client)}</td><td>${esc(t.title)}${t.urg?' <span class="pill p-urg">Urgente</span>':""}</td>
        <td><span class="pill ${t.state==="Chiuso"?"p-mut":t.state==="Aperto"?"p-new":t.state.startsWith("In attesa")?"p-warn":"p-ok"}">${esc(t.state)}</span></td>
        <td>${t.tech?`<span class="strong">${t.tech}</span>`:`<span class="dim">da assegnare</span>`}</td><td class="dim">${esc(t.origin)}</td><td class="mono">${esc(t.upd)}</td></tr>`; }).join("")}
    </tbody></table></div>`;
  document.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{ S.tfilt=b.dataset.f; ticket(); });
}

/* ---------- Clienti ---------- */
function clienti(){
  $("#main").innerHTML = `<div class="top"><div><h1>Clienti</h1><p class="sub">Anagrafiche da ITSM e Halo, contatti anche da Office 365. Servono a riconoscere il mittente delle mail.</p></div></div>
    <div class="tbl"><table><thead><tr><th>Cliente</th><th>Ticket in</th><th>Dominio</th><th>Contatti</th></tr></thead><tbody>
      ${CLIENTS.map(c=>`<tr><td><div style="display:flex;gap:10px;align-items:center">${logo(c)}<div><span class="strong">${esc(c.name)}</span><div class="dim">${esc(c.city)}</div></div></div></td><td>${badge(c.sys)}</td><td class="mono">@${esc(c.dom)}</td>
        <td>${c.contacts.map(k=>`<div>${esc(k.n)} ${badge(k.src)}<div class="dim">${esc(k.mail)}${k.tel?" · "+esc(k.tel):""}</div></div>`).join("")}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* ---------- Tecnici ---------- */
function tecnici(){
  $("#main").innerHTML = `<div class="top"><div><h1>Tecnici</h1><p class="sub">Le mail che arrivano da questi indirizzi sono messaggi dei clienti inoltrati dall'app, non richieste del tecnico.</p></div><button class="btn primary" type="button" id="t-add">Aggiungi tecnico</button></div>
    <div class="tbl"><table><thead><tr><th>Tecnico</th><th>Casella che invia</th><th>Zona</th><th>App</th><th>Ultimo invio</th><th>Ticket aperti</th></tr></thead><tbody>
      ${TECHS.map(t=>`<tr><td><span class="strong">${t.ini}</span> · ${esc(t.name)}</td><td class="mono">${t.mail}</td><td>${t.zona}</td><td>${t.app?'<span class="pill p-ok">Attiva</span>':'<span class="pill p-mut">Non installata</span>'}</td><td class="mono">${t.last}</td><td class="mono">${S.tickets.filter(x=>x.tech===t.ini&&x.state!=="Chiuso").length}</td></tr>`).join("")}
    </tbody></table></div>`;
  $("#t-add").onclick = ()=>toast("Nella versione vera: nome, casella mail e zona. Il tecnico riceve il link per installare l'app.");
}

/* ---------- Collegamenti ---------- */
function collegamenti(){
  const C = (LIVE && CONN) ? CONN : [
    {n:"ITSM", how:"Database e API di itsm.efuture.it", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Halo", how:"API REST di Halo", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Office 365", how:"Microsoft Graph", what:"Contatti aziendali e casella "+SUPPORT, sync:"adesso"},
    {n:"Casella "+SUPPORT, how:"Letta ogni minuto", what:"Mail dei clienti e dell'app dei tecnici", sync:"adesso"}
  ];
  $("#main").innerHTML = `<div class="top"><div><h1>Collegamenti</h1><p class="sub">Da dove legge il backend. L'app dei tecnici non si collega a questi sistemi: scrive solo mail a ${SUPPORT} e legge dal backend.</p></div></div>
    <div class="conns">${C.map((c,i)=>`<div class="panel conn"><div class="row"><h2>${esc(c.n)}</h2><span class="dim">${c.ok===false?"non collegato":"<span class=\"dot\"></span>&nbsp; collegato"}</span></div>
      <dl class="kv"><dt>Come</dt><dd>${esc(c.how)}</dd><dt>Cosa legge</dt><dd>${esc(c.what)}</dd><dt>Ultima lettura</dt><dd>${c.sync}</dd></dl>
      <button class="btn" type="button" data-t="${i}" style="align-self:flex-start">Prova collegamento</button></div>`).join("")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(LIVE){ load().then(()=>toast("Dati riletti")); } else toast(C[+b.dataset.t].n+": collegamento riuscito (prova)"); });
}

/* ---------- Regole di riconoscimento ---------- */
function regole(){
  $("#main").innerHTML = `<div class="top"><div><h1>Riconoscimento</h1><p class="sub">Per ogni mail che arriva a ${SUPPORT} il backend prova queste regole in ordine. La prima che trova ticket o cliente decide.</p></div></div>
    <ol class="rules">${S.rules.map((r,i)=>`<li><div><b>${esc(r.t)}</b><small>${esc(r.d)}</small></div><button class="switch" role="switch" aria-checked="${r.on}" aria-label="${esc(r.t)}" data-r="${i}"></button></li>`).join("")}</ol>
    <div class="panel"><h2>Indirizzo e intestazioni</h2>
      <dl class="kv"><dt>Indirizzo di raccolta</dt><dd class="mono">${SUPPORT}</dd><dt>Cliente dall'app</dt><dd class="mono">X-TicketFarm-Cliente</dd><dt>Ora del messaggio</dt><dd class="mono">X-TicketFarm-Ora-Messaggio</dd><dt>Origine</dt><dd class="mono">X-TicketFarm-Origine</dd></dl>
      <p class="note">Se nessuna regola trova il cliente, la mail resta in Posta in arrivo come «Da verificare».</p></div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const r=S.rules[+b.dataset.r]; r.on=!r.on; b.setAttribute("aria-checked",r.on); if(LIVE) post("/api/admin/rules", {k:r.k, on:r.on}).catch(()=>{}); toast((r.on?"Attivata: ":"Disattivata: ")+r.t); });
}

function load(){
  return fetch("/api/admin/state").then(r=>r.ok?r.json():Promise.reject()).then(d=>{
    LIVE = true; CONN = d.connections;
    CLIENTS.splice(0, CLIENTS.length, ...d.clients); TECHS.splice(0, TECHS.length, ...d.techs);
    S.mails = d.mails; S.tickets = d.tickets; S.rules = d.rules;
    $("#foot-mode").textContent = d.mode==="live" ? "Collegato a ITSM, Halo e Office 365" : "Backend in modalità prova: mail salvate in outbox, non spedite";
    if(d.appUrl){ const a=$("#app-link"); a.href=d.appUrl; a.hidden=false; }
    render();
  }).catch(()=>render());
}
load();
})();
</script>
</body>
</html>
