<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticket Farm · Console</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: console da ufficio, menu a sinistra e area di lavoro; su telefono il menu diventa una barra orizzontale.
   Ticket Farm: nero, gradiente blu→turchese per le azioni, oro come accento. */
:root{
  --bg:#000000; --surface:#0c1016; --surface-2:#07090d; --raise:#121821; --ink:#ffffff; --text:#d6dee8; --muted:#9aa7b6; --line:#1a222d;
  --accent:#2aa7ff; --accent-soft:rgba(42,167,255,.13);
  --grad:linear-gradient(135deg,#1e6ff0 0%,#1aa0e8 50%,#19c9b8 100%);
  --gold:#d9ab45; --gold-soft:rgba(217,171,69,.13); --gold-grad:linear-gradient(135deg,#f6dc8a,#d9ab45 55%,#b88424);
  --teal:#19c2c9; --teal-soft:rgba(25,194,201,.13); --red:#ff7a66; --red-soft:rgba(255,122,102,.14); --ok:#20c997; --ok-soft:rgba(32,201,151,.13);
  --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --raise:#e2e9f2; --ink:#0b1622; --text:#26364a; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10);
  --gold:#9a6f12; --gold-soft:rgba(217,171,69,.18); --gold-grad:linear-gradient(135deg,#c08a1e,#8a6210);
  --teal:#0b878d; --teal-soft:rgba(11,135,141,.10); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --ok:#13805f; --ok-soft:rgba(19,128,95,.10);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --raise:#e2e9f2; --ink:#0b1622; --text:#26364a; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10);
  --gold:#9a6f12; --gold-soft:rgba(217,171,69,.18); --gold-grad:linear-gradient(135deg,#c08a1e,#8a6210);
  --teal:#0b878d; --teal-soft:rgba(11,135,141,.10); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --ok:#13805f; --ok-soft:rgba(19,128,95,.10);
  color-scheme:light;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;color:var(--ink);padding:0 6px}
.logo svg{width:30px;height:30px}
.logo em{font-style:normal;background:linear-gradient(90deg,#2a8ff0,#2aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav .grp{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px;opacity:.8}
.nav .grp:first-child{padding-top:2px}
.tgroup{font-size:15px;color:var(--ink);margin:10px 0 0;font-weight:600}
.tuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tut{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;color:var(--text)}
.tut:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:18px;padding-left:4px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tbody{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.tbody b{color:var(--ink);font-weight:600;font-size:15.5px;line-height:1.3}
.article{max-width:860px;display:flex;flex-direction:column;gap:18px}
.article h1{margin-top:4px}
.tvideo{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--line)}
.article h2{font-size:17px;color:var(--ink);margin:0 0 10px}
.proc{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:10px}
.proc li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;line-height:1.55}
.proc li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.proc b,.tip b{color:var(--ink);font-weight:600}
.swim{display:grid;grid-template-columns:repeat(var(--lanes),minmax(0,1fr));column-gap:12px;row-gap:14px;position:relative}
.lane-h{grid-row:1;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;border-radius:10px;color:var(--lc);background:var(--lb);text-align:center}
.lane-bg{border-radius:12px;background:var(--lb);opacity:.35;z-index:0}
.step{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);box-shadow:0 6px 18px rgba(0,0,0,.08);font-size:13.5px;line-height:1.45}
.step b{color:var(--ink);font-size:14.5px;font-weight:600}
.step .num{position:absolute;top:-12px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--lc);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center}
.step .who{display:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--lc)}
.step .arrow{position:absolute;top:-19px;left:14px;font-size:15px;color:var(--muted);line-height:1}
.step.result{border-top-color:transparent;background:var(--grad);color:#fff;border:0;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.step.result b,.step.result span{color:#fff}
.step.result .num{position:static;background:rgba(255,255,255,.25)}
.l-tel{--lc:#b07d12;--lb:rgba(217,171,69,.16)} .l-wa{--lc:#1a9a4f;--lb:rgba(31,168,85,.14)} .l-mail{--lc:#c2581b;--lb:rgba(230,120,50,.14)}
.l-app{--lc:#1570d6;--lb:rgba(42,167,255,.14)} .l-con{--lc:#0b8a91;--lb:rgba(25,194,201,.14)}
@media (max-width:760px){
  .swim{grid-template-columns:minmax(0,1fr)!important}
  .lane-h,.lane-bg{display:none}
  .step{grid-column:1!important;grid-row:auto!important}
  .step .who{display:block}
}
.tip{margin:0;background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.linkback{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px}
#tut-next{align-self:flex-start}
.nav .n{font-size:11px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--accent)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px, min(4vw,36px));padding-right:max(16px, env(safe-area-inset-right, 0px), min(4vw,36px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.5px;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600;color:var(--ink);margin:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raise)}
tbody tr.sel td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12px}
.strong{color:var(--ink);font-weight:600}
.dim{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-ITSM{background:var(--accent-soft);color:var(--accent)}
.s-Halo{background:var(--teal-soft);color:var(--teal)}
.s-O365{background:var(--gold-soft);color:var(--gold)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-new{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--gold-soft);color:var(--gold)}
.p-urg{background:var(--red-soft);color:var(--red)}
.p-mut{background:var(--raise);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(30,136,240,.3)}
.btn:disabled{opacity:.5;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.detail{position:sticky;top:16px}
.hdrs{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.hdrs span{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.hdrs span.hit{color:var(--gold)}
.body{background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:13.5px}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--line)}
.steps li.ok::before{background:var(--ok)}
.steps li.skip::before{background:var(--raise);border:1px solid var(--line)}
.steps li.warn::before{background:var(--gold)}
.steps li.skip{color:var(--muted)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,select.input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%}
.conns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.conn .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 4px var(--ok-soft)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rules li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;counter-increment:r}
.rules li::before{content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;display:grid;place-items:center}
.rules b{color:var(--ink);font-weight:600;display:block}
.rules small{color:var(--muted);font-size:12.5px}
.switch{width:40px;height:22px;border-radius:11px;background:var(--line);border:0;position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--grad)}
.bar u{text-decoration:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.lav{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:9px;overflow:hidden;font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h) 55% 42%)}
.lav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:#2aa7ff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.small{padding:5px 12px;font-size:12.5px}
.btn.danger{border-color:rgba(255,122,102,.4);color:var(--red);background:transparent}
.btn.danger[data-yes]{background:var(--red);color:var(--bg);border-color:var(--red)}
td.act{white-space:nowrap;text-align:right}
.confirm{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){.formgrid{grid-template-columns:minmax(0,1fr)}}
/* interruttore tema (soluzione A): sole e luna ai lati, pallino che scorre */
.sw-a{position:relative;width:60px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--raise);padding:0;cursor:pointer;flex:0 0 auto}
.sw-a .ic{position:absolute;top:50%;transform:translateY(-50%);width:15px;height:15px}
.sw-a .ic.s{left:7px;color:#e9a90f}.sw-a .ic.m{right:7px;color:#8fb4ee}
.sw-a .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#1e6ff0,#1aa0e8 50%,#19c9b8);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:left .25s}
.sw-a[aria-checked="true"] .knob{left:32px}
.sw-a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sw-a .knob{transition:none}}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;align-self:flex-start;white-space:nowrap}
.contact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0}
.wa{display:inline-flex;align-items:center;gap:6px;color:#fff;background:#1fa855;border-radius:999px;padding:5px 11px;text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-top:16px;padding-left:max(16px, min(4vw,36px));padding-right:max(16px, env(safe-area-inset-right, 0px), min(4vw,36px))}
.topbar + main{padding-top:8px}
.mewrap{position:relative}
.me{width:36px;height:36px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.me:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:absolute;right:0;top:44px;z-index:30;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column}
.menu-head{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}
.menu-head b{color:var(--ink);font-weight:600}.menu-head span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--raise);color:var(--ink);outline:none}
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px}
.login-box{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.login-box h1{font-size:22px}
.hint{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.hint button{display:block;margin-top:6px;background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal-box{width:min(440px,100%);max-height:100%;overflow:auto}
.pw{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
.pw legend{font-size:12.5px;color:var(--muted);padding:0 6px}
.pw:disabled{opacity:.55}
.wide-box{width:min(620px,100%)}
.crow{display:grid;grid-template-columns:1.1fr 1.3fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:28px;font-weight:700;letter-spacing:.12em;color:var(--ink);background:var(--surface-2);border-radius:12px;padding:14px;text-align:center;margin:0}
@media (max-width:600px){.crow{grid-template-columns:minmax(0,1fr)}}
.o365state{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;border-left:4px solid var(--ok)}
.o365state.bad{border-left-color:var(--red)}
.tsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tsteps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;align-items:start}
.tsteps li::before{content:"✓";grid-row:span 2;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.tsteps li.ko::before{content:"✕";background:var(--red)}
.tsteps b{color:var(--ink);font-weight:600}.tsteps span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.howto summary{cursor:pointer;list-style:none}.howto summary::-webkit-details-marker{display:none}

const LANES = [["Telefono","☎"],["WhatsApp","💬"],["Mail","✉"],["App","📱"],["Console","🖥"]];

function tutorial(){

  const next = TUTORIALS[t.n % TUTORIALS.length];
  const lanes = LANES.filter(([w])=>t.steps.some(x=>x.who===w));
  const col = w => lanes.findIndex(([x])=>x===w) + 1;
  $("#main").innerHTML = `<div><button class="linkback" type="button" id="tut-back">‹ Tutti i tutorial</button></div>
    <article class="article">
      <header><span class="dim">Caso ${t.n} di ${TUTORIALS.length} · ${t.where} · ${t.time}</span><h1>${t.title}</h1><p class="sub">${t.intro}</p></header>
      <video class="tvideo" controls playsinline preload="metadata" poster="tutorial/${t.n}-${t.id}.jpg" src="tutorial/${t.n}-${t.id}.mp4"></video>
      <section><h2>Procedura</h2>
        <div class="swim" style="--lanes:${lanes.length}">
          ${lanes.map(([w,ic],i)=>`<div class="lane-h l-${laneKey(w)}" style="grid-column:${i+1}"><span aria-hidden="true">${ic}</span> ${w}</div>`).join("")}
          ${lanes.map((_,i)=>`<div class="lane-bg" style="grid-column:${i+1};grid-row:2 / span ${t.steps.length+1}"></div>`).join("")}
          ${t.steps.map((x,i)=>`<div class="step l-${laneKey(x.who)}" style="grid-column:${col(x.who)};grid-row:${i+2}">
              ${i?`<span class="arrow" aria-hidden="true">${t.steps[i-1].who===x.who?"↓":"↘"}</span>`:""}
              <span class="num">${i+1}</span><span class="who">${x.who}</span><b>${x.t}</b><span>${x.d}</span></div>`).join("")}
          <div class="step result" style="grid-column:1 / -1;grid-row:${t.steps.length+2}"><span class="num">✓</span><b>Risultato</b><span>${t.result}</span></div>
        </div>
      </section>
      <p class="tip">💡 ${t.tip}</p>
      <button class="btn" type="button" id="tut-next">Prossimo: ${next.title} ›</button>
    </article>`;
  $("#tut-back").onclick = ()=>{ S.tut=null; tutorial(); };
  $("#tut-next").onclick = ()=>{ S.tut=next.id; tutorial(); window.scrollTo(0,0); };
}

  const list = S.mails.filter(m => S.filt==="tutti" || m.res.state===S.filt || (S.filt==="app" && TECHS.some(t=>t.mail===m.from)));

function mailDetail(m){
  const isTech = TECHS.some(t=>t.mail===m.from);
  const keys = isTech ? ["tech","reply","subj","hdr"] : ["reply","subj","from","dom"];
  const c = cl(m.res.client);
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2>${esc(m.subj)}</h2><span class="pill ${ST[m.res.state][0]}">${ST[m.res.state][1]}</span></div>
    <dl class="kv"><dt>Da</dt><dd>${esc(m.fromName)} &lt;${esc(m.from)}&gt;</dd><dt>A</dt><dd>${SUPPORT}</dd><dt>Ricevuta</dt><dd>${esc(m.at)}</dd>
      ${c?`<dt>Cliente</dt><dd>${esc(c.name)} ${badge(c.sys)}</dd>`:""}${m.res.ticket?`<dt>Ticket</dt><dd class="mono">${esc(m.res.ticket)}</dd>`:""}</dl>
    ${m.hdr.length?`<div class="hdrs">${m.hdr.map(([k,v])=>`<span class="${/In-Reply-To|X-TicketFarm-Cliente/.test(k)?"hit":""}">${k}: ${esc(v)}</span>`).join("")}</div>`:`<p class="dim">Nessuna intestazione di Ticket Farm né riferimenti a mail precedenti.</p>`}
    <div class="body">${esc(m.body)}</div>
    <div><h2 style="margin-bottom:8px">Come è stata riconosciuta</h2><ol class="steps">${keys.map(k=>`<li class="${m.res.how.includes(k)?"ok":"skip"}">${HOW[k]}${m.res.how.includes(k)?"":" — no"}</li>`).join("")}</ol></div>
    <p style="margin:0" class="${m.res.state==="warn"?"":"strong"}">${esc(m.res.act)}</p>
    ${m.res.state==="warn" ? `<div class="field"><span>Cliente</span><select class="input" id="fx-client"><option value="">Scegli il cliente…</option>${CLIENTS.map(c=>`<option value="${c.id}">${esc(c.name)} · ${SRC[c.sys]}</option>`).join("")}</select></div>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px;text-transform:none"><input type="checkbox" id="fx-learn" checked style="width:18px;height:18px;accent-color:#2aa7ff"> <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);font-size:13.5px">Ricorda ${isTech?"":"il mittente "+esc(m.from)+" "}per questo cliente</span></label>
      <button class="btn primary" type="button" id="fx-go" disabled>Apri il ticket</button>` : ""}
  </div>`;
}
function wireFix(m){
  const sel = $("#fx-client"), go = $("#fx-go");
  sel.onchange = ()=>{ go.disabled = !sel.value; if(sel.value) go.textContent = "Apri il ticket in "+SRC[cl(sel.value).sys]; };
  go.onclick = ()=>{
    if(LIVE){ go.disabled = true; post("/api/admin/mails/"+encodeURIComponent(m.id)+"/resolve", {client:sel.value}).then(r=>{ m.res = r.mail.res; load(); toast(m.res.act); }).catch(e=>{ go.disabled=false; toast("Non riuscito: "+e.message); }); return; }
    const c = cl(sel.value); const id = c.sys==="Halo" ? "HALO-48"+(++S.seq) : "Tck #7142"+(++S.seq);
    const tech = (TECHS.find(t=>t.mail===m.from)||{}).ini || "";
    S.tickets.unshift({id, sys:c.sys, client:c.id, title:m.subj.replace(/^Messaggio WhatsApp - .*/,"Richiesta da WhatsApp del tecnico"), state:"Aperto", tech, origin: tech?"WhatsApp tecnico":"Mail cliente", upd:"adesso"});
    if($("#fx-learn").checked && !tech) c.contacts.push({n:m.fromName, src:c.sys, mail:m.from, tel:""});
    m.res = {state:"new", ticket:id, client:c.id, how:m.res.how, act:"Aperto "+id+" in "+SRC[c.sys]+" per "+c.name+(tech?" e assegnato a "+tech+". Il tecnico lo vede nell'app.":".")};
    posta(); nav(); toast("Ticket "+id+" aperto in "+SRC[c.sys]);
  };
}

        <td><span class="pill ${t.state==="Chiuso"?"p-mut":t.state==="Aperto"?"p-new":t.state.startsWith("In attesa")?"p-warn":"p-ok"}">${esc(t.state)}</span></td>
        <td>${t.tech?`<span class="strong">${t.tech}</span>`:`<span class="dim">da assegnare</span>`}</td><td class="dim">${esc(t.origin)}</td><td class="mono">${esc(t.upd)}</td>

    </tbody></table></div>`;

  $("#nt-x").onclick = ()=>{ form.hidden = true; form.reset(); };
  $("#nt-client").onchange = e => { const c = cl(e.target.value); $("#nt-where").textContent = c ? "Sarà aperto in "+SRC[c.sys]+"." : "Il ticket viene aperto nel sistema del cliente (ITSM o Halo)."; };
  form.onsubmit = e => {
    e.preventDefault();
    const c = cl($("#nt-client").value), title = $("#nt-title").value.trim(), tech = $("#nt-tech").value, urg = $("#nt-urg").checked;
    if(!c || !title){ toast("Scegli il cliente e scrivi la richiesta"); return; }
    if(LIVE){ $("#nt-go").disabled = true;
      post("/api/admin/tickets", {client:c.id, title, tech, urg}).then(r=>{ toast("Ticket "+r.ticket.id+" aperto in "+SRC[c.sys]); load(); })
        .catch(err=>{ $("#nt-go").disabled = false; toast("Non riuscito: "+err.message); }); return; }
    const id = c.sys==="Halo" ? "HALO-48"+(++S.seq) : "Tck #7142"+(++S.seq);
    S.tickets.unshift({id, sys:c.sys, client:c.id, title, state:"Aperto", tech, urg, origin:"Console", upd:"adesso"});
    S.tfilt = "tutti"; ticket(); toast("Ticket "+id+" aperto in "+SRC[c.sys]+" (prova)");
  };
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{
    const cell = b.parentNode, id = b.dataset.ask;
    cell.innerHTML = `<span class="confirm">Eliminare ${esc(id)}? <button class="btn small danger" type="button" data-yes>Sì, elimina</button> <button class="btn small" type="button" data-no>No</button></span>`;
    cell.querySelector("[data-no]").onclick = ()=>ticket();
    cell.querySelector("[data-yes]").onclick = ()=>{
      if(LIVE){ fetch("/api/admin/tickets/"+encodeURIComponent(id), {method:"DELETE", headers:H()}).then(r=>r.ok?r.json():r.json().then(j=>Promise.reject(new Error(j.error||r.status))))
        .then(()=>{ toast("Ticket "+id+" eliminato"); load(); }).catch(err=>{ toast("Non riuscito: "+err.message); ticket(); }); return; }
      S.tickets = S.tickets.filter(t=>t.id!==id); ticket(); toast("Ticket "+id+" eliminato (prova)");
    };
  });
}

/* conferma dentro la riga, senza finestre del browser */
function askDelete(btn, what, yes, back){
  const cell = btn.parentNode;
  cell.innerHTML = `<span class="confirm">Eliminare ${esc(what)}? <button class="btn small danger" type="button" data-yes>Sì, elimina</button> <button class="btn small" type="button" data-no>No</button></span>`;
  cell.querySelector("[data-no]").onclick = back;
  cell.querySelector("[data-yes]").onclick = ()=>{ const r = yes(); if(r && r.catch) r.catch(err=>{ toast("Non riuscito: "+err.message); back(); }); };
}
const del = u => fetch(u, {method:"DELETE", headers:H()}).then(r=>r.ok ? r.json() : r.json().then(j=>Promise.reject(new Error(j.error||r.status))));
const put = (u, b) => fetch(u, {method:"PUT", headers:{"Content-Type":"application/json", ...H()}, body:JSON.stringify(b)}).then(r=>r.ok ? r.json() : r.json().then(j=>Promise.reject(new Error(j.error||r.status))));
function openEditor(html, onSubmit){
  const m = $("#editor"); m.hidden = false; $("#ed-form").innerHTML = html;
  $("#ed-form").onsubmit = e => { e.preventDefault(); onSubmit(); };
  $("#ed-form").querySelector("[data-close]").onclick = ()=>{ m.hidden = true; };
  setTimeout(()=>{ const f = $("#ed-form").querySelector("input,select"); if(f) f.focus(); }, 30);
}
const closeEditor = ()=>{ $("#editor").hidden = true; };
function contactRow(k){
  return `<div class="crow"><input class="input" data-k="n" placeholder="Nome e cognome" value="${esc(k.n||"")}"><input class="input" data-k="mail" type="email" placeholder="mail" value="${esc(k.mail||"")}"><input class="input" data-k="tel" inputmode="tel" placeholder="+39 333 …" value="${esc(k.tel||"")}"><button class="btn small danger" type="button" data-rm aria-label="Togli contatto">✕</button></div>`;
}
function clientForm(c){
  const isNew = !c; c = c || {name:"", city:"", sys:"ITSM", dom:"", contacts:[{n:"",mail:"",tel:""}]};
  openEditor(`<h2>${isNew ? "Nuovo cliente" : "Modifica cliente"}</h2>
    <div class="formgrid">
      <label class="field wide"><span>Ragione sociale</span><input class="input" id="cf-name" required maxlength="120" value="${esc(c.name)}"></label>
      <label class="field"><span>Città</span><input class="input" id="cf-city" maxlength="60" value="${esc(c.city||"")}"></label>
      <label class="field"><span>Ticket in</span><select class="input" id="cf-sys"><option value="ITSM" ${c.sys==="ITSM"?"selected":""}>ITSM</option><option value="Halo" ${c.sys==="Halo"?"selected":""}>Halo</option></select></label>
      <label class="field wide"><span>Dominio delle mail</span><input class="input" id="cf-dom" placeholder="es. caseificiovalle.ch" value="${esc(c.dom||"")}"></label>
    </div>
    <div class="field"><span>Contatti</span><div id="cf-contacts">${(c.contacts||[]).map(contactRow).join("")}</div>
      <button class="linkback" type="button" id="cf-addc">+ Aggiungi contatto</button></div>
    <p class="note">Il numero di telefono serve per il pulsante WhatsApp; il dominio per riconoscere le mail del cliente.</p>
    <div class="actions"><button class="btn primary" type="submit">${isNew ? "Crea cliente" : "Salva"}</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
      const contacts = [...document.querySelectorAll("#cf-contacts .crow")].map(r=>({n:r.querySelector('[data-k="n"]').value.trim(), mail:r.querySelector('[data-k="mail"]').value.trim(), tel:r.querySelector('[data-k="tel"]').value.trim(), src:$("#cf-sys").value==="Halo"?"Halo":"ITSM"})).filter(k=>k.n||k.mail||k.tel);
      const body = {name:$("#cf-name").value.trim(), city:$("#cf-city").value.trim(), sys:$("#cf-sys").value, dom:$("#cf-dom").value.trim().replace(/^@/,"").toLowerCase(), contacts};
      if(!body.name){ toast("Scrivi la ragione sociale"); return; }
      if(LIVE){ (isNew ? post("/api/admin/clients", body) : put("/api/admin/clients/"+encodeURIComponent(c.id), body))
        .then(()=>{ closeEditor(); toast(isNew ? "Cliente creato" : "Cliente salvato"); load(); }).catch(err=>toast("Non riuscito: "+err.message)); return; }
      if(isNew) CLIENTS.push(Object.assign({id:"c"+Date.now()}, body)); else Object.assign(c, body);
      closeEditor(); clienti(); toast((isNew ? "Cliente creato" : "Cliente salvato")+" (prova)");

  const wire = ()=>document.querySelectorAll("#cf-contacts [data-rm]").forEach(b=>b.onclick=()=>b.closest(".crow").remove());
  $("#cf-addc").onclick = ()=>{ $("#cf-contacts").insertAdjacentHTML("beforeend", contactRow({})); wire(); };

function showCode(t, code){
  openEditor(`<h2>Codice di accesso</h2>
    <p>Dai questo codice a <b>${esc(techName(t))}</b> (${esc(t.mail)}). Lo usa con la sua mail per entrare nell'app.</p>
    <p class="code">${esc(code)}</p>
    <p class="note">Il codice si vede solo adesso: nel sistema resta solo la sua impronta. Se lo perde, generane uno nuovo da Modifica.</p>
    <div class="actions"><button class="btn primary" type="button" data-close>Fatto</button></div>`, closeEditor);
}
function techForm(t){
  const isNew = !t; t = t || {nome:"", ini:"", mail:"", zona:""};
  openEditor(`<h2>${isNew ? "Nuovo tecnico" : "Modifica tecnico"}</h2>
    <div class="formgrid">
      <label class="field wide"><span>Nome e cognome</span><input class="input" id="tf-nome" required maxlength="80" value="${esc(techName(t))}"></label>
      <label class="field"><span>Iniziali</span><input class="input" id="tf-ini" maxlength="3" value="${esc(t.ini||"")}" placeholder="es. MR"></label>
      <label class="field"><span>Zona</span><input class="input" id="tf-zona" maxlength="40" value="${esc(t.zona||"")}" placeholder="es. Sud"></label>
      <label class="field wide"><span>Mail aziendale (casella da cui partono le mail dell'app)</span><input class="input" id="tf-mail" type="email" required value="${esc(t.mail||"")}" ${isNew?"":"readonly"}></label>
    </div>
    ${isNew ? `<p class="note">Alla creazione viene generato il codice di accesso all'app.</p>` : `<label class="check"><input type="checkbox" id="tf-code"> Genera un nuovo codice di accesso (quello vecchio smette di funzionare)</label>`}
    <div class="actions"><button class="btn primary" type="submit">${isNew ? "Crea tecnico" : "Salva"}</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
      const nome = $("#tf-nome").value.trim(), mail = $("#tf-mail").value.trim().toLowerCase(), zona = $("#tf-zona").value.trim();
      const ini = ($("#tf-ini").value.trim() || nome.split(/\s+/).slice(0,2).map(w=>w[0]).join("")).toUpperCase();
      const newCode = !isNew && $("#tf-code").checked;
      if(!nome || !mail.includes("@")){ toast("Scrivi nome e mail aziendale"); return; }
      if(LIVE){ (isNew ? post("/api/admin/techs", {mail, nome, ini, zona}) : put("/api/admin/techs/"+encodeURIComponent(t.mail), {nome, ini, zona, newCode}))
        .then(r=>{ load(); if(r.code) showCode(r.tech, r.code); else { closeEditor(); toast("Tecnico salvato"); } }).catch(err=>toast("Non riuscito: "+err.message)); return; }
      const code = String(100000 + Math.floor(Math.random()*900000));
      if(isNew){ if(TECHS.some(x=>x.mail===mail)){ toast("Esiste già un tecnico con questa mail"); return; } TECHS.push({mail, name:nome, nome, ini, zona, app:false, last:"—"}); }
      else Object.assign(t, {name:nome, nome, ini, zona});
      tecnici();
      if(isNew || newCode) showCode({nome, mail}, code+" (prova)"); else { closeEditor(); toast("Tecnico salvato (prova)"); }
    });
}

/* ---------- Collegamenti ---------- */
function collegamenti(){
  const C = (LIVE && CONN) ? CONN : [
    {n:"ITSM", how:"Database e API di itsm.efuture.it", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Halo", how:"API REST di Halo", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Office 365", how:"Microsoft Graph", what:"Contatti aziendali e casella "+SUPPORT, sync:"adesso"},
    {n:"Casella "+SUPPORT, how:"Letta ogni minuto", what:"Mail dei clienti e dell'app dei tecnici", sync:"adesso"}
  ];
  $("#main").innerHTML = `<div class="top"><div><h1>Collegamenti</h1><p class="sub">Da dove legge il backend. L'app dei tecnici non si collega a questi sistemi: scrive solo mail a ${SUPPORT} e legge dal backend.</p></div></div>
    <div class="conns">${C.map((c,i)=>`<div class="panel conn"><div class="row"><h2>${esc(c.n)}</h2><span class="dim">${c.ok===false?"non collegato":"<span class=\"dot\"></span>&nbsp; collegato"}</span></div>
      <dl class="kv"><dt>Come</dt><dd>${esc(c.how)}</dd><dt>Cosa legge</dt><dd>${esc(c.what)}</dd><dt>Ultima lettura</dt><dd>${c.sync}</dd></dl>
      <button class="btn" type="button" data-t="${i}" style="align-self:flex-start">Prova collegamento</button></div>`).join("")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(LIVE){ load().then(()=>toast("Dati riletti")); } else toast(C[+b.dataset.t].n+": collegamento riuscito (prova)"); });
}

/* ---------- Regole di riconoscimento ---------- */
function regole(){
  $("#main").innerHTML = `<div class="top"><div><h1>Riconoscimento</h1><p class="sub">Per ogni mail che arriva a ${SUPPORT} il backend prova queste regole in ordine. La prima che trova ticket o cliente decide.</p></div></div>
    <ol class="rules">${S.rules.map((r,i)=>`<li><div><b>${esc(r.t)}</b><small>${esc(r.d)}</small></div><button class="switch" role="switch" aria-checked="${r.on}" aria-label="${esc(r.t)}" data-r="${i}"></button></li>`).join("")}</ol>
    <div class="panel"><h2>Indirizzo e intestazioni</h2>
      <dl class="kv"><dt>Indirizzo di raccolta</dt><dd class="mono">${SUPPORT}</dd><dt>Cliente dall'app</dt><dd class="mono">X-TicketFarm-Cliente</dd><dt>Ora del messaggio</dt><dd class="mono">X-TicketFarm-Ora-Messaggio</dd><dt>Origine</dt><dd class="mono">X-TicketFarm-Origine</dd></dl>
      <p class="note">Se nessuna regola trova il cliente, la mail resta in Posta in arrivo come «Da verificare».</p></div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const r=S.rules[+b.dataset.r]; r.on=!r.on; b.setAttribute("aria-checked",r.on); if(LIVE) post("/api/admin/rules", {k:r.k, on:r.on}).catch(()=>{}); toast((r.on?"Attivata: ":"Disattivata: ")+r.t); });
}

function load(){
  return fetch("/api/admin/state", {headers:H()}).then(r=>{ if(r.status===401) throw {auth:true}; return r.ok ? r.json() : Promise.reject(new Error("errore "+r.status)); }).then(d=>{
    LIVE = true; CONN = d.connections; ME = d.me || ME; paintMe();
    CLIENTS.splice(0, CLIENTS.length, ...d.clients); TECHS.splice(0, TECHS.length, ...d.techs);
    S.mails = d.mails; S.tickets = d.tickets; S.rules = d.rules; SETTINGS = d.settings || SETTINGS; O365 = d.o365 || null;
    $("#foot-mode").textContent = d.mode==="live" ? "Collegato a ITSM, Halo e Office 365" : "Backend in modalità prova: mail salvate in outbox, non spedite";
    if(d.appUrl){ const a=$("#app-link"); a.href=d.appUrl; a.hidden=false; }
    render();
  }).catch(err=>{ if(err && err.auth){ logout(); return; } toast("Backend non raggiungibile: "+(err && err.message || "")); render(); });
}
/* senza backend (file aperto o GitHub Pages): dati di prova, accesso e profilo solo in questo browser */
const OFF_USER = {user:"admin", password:"admin123"};
function offProfile(){ let p = null; try{ p = JSON.parse(localStorage.getItem("tf-admin-profile")||"null"); }catch(e){} return Object.assign({user:"admin", nome:"Amministratore", mail:"support@efuture.it"}, p||{}); }
function startOffline(){
  if(location.hostname.endsWith("github.io")){ $("#foot-mode").textContent = "Console di prova: dati di esempio, non collegata a un backend"; const a=$("#app-link"); a.href="../"; a.hidden=false; }
  ME = offProfile(); paintMe(); render();
}

/* ---------- accesso, menu utente, profilo ---------- */
function initials(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "AD"; }
function paintMe(){ if(!ME) return; $("#me").textContent = initials(ME.nome || ME.user); $("#me-name").textContent = ME.nome || ME.user; $("#me-mail").textContent = (ME.user ? ME.user+" · " : "")+(ME.mail||""); }
function showLogin(hint){
  $("#login").hidden = false; $("#me-menu").hidden = true;
  $("#login-hint").innerHTML = hint ? `<div class="hint">Modalità prova: utente = ${esc(hint.user)}, password = ${esc(hint.password)}<button type="button" id="lg-fill">Compila e accedi</button></div>` : "";
  $("#lg-user").placeholder = hint ? hint.user : ""; $("#lg-pass").placeholder = hint ? hint.password : "";
  if(hint) $("#lg-fill").onclick = ()=>{ $("#lg-user").value = hint.user; $("#lg-pass").value = hint.password; $("#login-form").requestSubmit(); };
  setTimeout(()=>$("#lg-user").focus(), 50);
}
$("#login-form").onsubmit = e => {
  e.preventDefault();
  const user = $("#lg-user").value.trim(), password = $("#lg-pass").value;
  if(!BACKEND){
    if(user === OFF_USER.user && password === OFF_USER.password){ try{ localStorage.setItem("tf-admin-in","1"); }catch(e){} $("#login").hidden = true; $("#lg-pass").value=""; startOffline(); }
    else toast("Utente o password non corretti");
    return;
  }
  $("#lg-go").disabled = true;
  fetch("/api/admin/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user, password})})
    .then(r=>r.json().then(j=>r.ok ? j : Promise.reject(new Error(j.error||r.status))))
    .then(j=>{ TOKEN = j.token; ME = j.me; try{ localStorage.setItem("tf-admin-token", TOKEN); }catch(e){} $("#login").hidden = true; $("#lg-pass").value=""; paintMe(); load(); })
    .catch(err=>toast("Accesso non riuscito: "+err.message)).finally(()=>{ $("#lg-go").disabled = false; });
};
function logout(){
  TOKEN = ""; try{ localStorage.removeItem("tf-admin-token"); localStorage.removeItem("tf-admin-in"); }catch(e){}
  showLogin(BACKEND ? HINT : OFF_USER);
}
let HINT = null;
$("#me").onclick = e => { e.stopPropagation(); const m = $("#me-menu"); m.hidden = !m.hidden; $("#me").setAttribute("aria-expanded", String(!m.hidden)); };
document.addEventListener("click", e => { if(!e.target.closest(".mewrap")){ $("#me-menu").hidden = true; $("#me").setAttribute("aria-expanded","false"); } });
document.addEventListener("keydown", e => { if(e.key==="Escape"){ $("#me-menu").hidden = true; $("#profile").hidden = true; $("#editor").hidden = true; } });
$("#me-out").onclick = ()=>{ $("#me-menu").hidden = true; logout(); toast("Sei uscito"); };
$("#me-edit").onclick = ()=>{
  $("#me-menu").hidden = true; $("#profile").hidden = false;
  $("#pf-nome").value = ME && ME.nome || ""; $("#pf-mail").value = ME && ME.mail || "";
  ["#pf-new","#pf-new2","#pf-cur"].forEach(x=>$(x).value="");
  $("#pf-pw").disabled = !BACKEND; $("#pf-cur").closest(".field").hidden = !BACKEND;
  $("#pf-note").textContent = BACKEND ? "Utente: "+(ME && ME.user || "") : "Versione di prova online: nome e mail restano solo in questo browser, la password non si cambia.";
  $("#pf-nome").focus();
};
$("#pf-x").onclick = ()=>{ $("#profile").hidden = true; };
$("#profile").onclick = e => { if(e.target.id==="profile") $("#profile").hidden = true; };
$("#pf-form").onsubmit = e => {
  e.preventDefault();
  const nome = $("#pf-nome").value.trim(), mail = $("#pf-mail").value.trim(), nuova = $("#pf-new").value, nuova2 = $("#pf-new2").value, attuale = $("#pf-cur").value;
  if(!BACKEND){ ME = Object.assign(offProfile(), {nome, mail}); try{ localStorage.setItem("tf-admin-profile", JSON.stringify({nome, mail})); }catch(e){} paintMe(); $("#profile").hidden = true; toast("Profilo salvato"); return; }
  if(nuova && nuova !== nuova2){ toast("Le due nuove password non sono uguali"); return; }
  if(!attuale){ toast("Scrivi la password attuale per salvare"); $("#pf-cur").focus(); return; }
  post("/api/admin/profile", {nome, mail, attuale, nuova}).then(r=>{ ME = r.me; paintMe(); $("#profile").hidden = true; toast(nuova ? "Profilo e password salvati" : "Profilo salvato"); })
    .catch(err=>toast("Non salvato: "+err.message));
};
function boot(){
  fetch("/api/admin/info").then(r=>r.ok ? r.json() : Promise.reject()).then(info=>{
    BACKEND = true; HINT = info.demo;
    if(TOKEN) load(); else showLogin(HINT);
  }).catch(()=>{
    BACKEND = false;
    let inside = false; try{ inside = localStorage.getItem("tf-admin-in")==="1"; }catch(e){}
    if(inside) startOffline(); else showLogin(OFF_USER);
  });
}
/* tema chiaro / scuro, come l'app (stessa preferenza salvata) */
function curTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function paintTheme(){ const d = curTheme()==="dark", b = $("#theme"); b.setAttribute("aria-checked", String(d)); b.title = d ? "Tema scuro (tocca per il chiaro)" : "Tema chiaro (tocca per lo scuro)"; }
try{ const t = localStorage.getItem("tf-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#theme").onclick = ()=>{ const t = curTheme()==="dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try{ localStorage.setItem("tf-theme", t); }catch(e){} paintTheme(); };
paintTheme();
boot();
})();
</script>
