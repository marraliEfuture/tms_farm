<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticket Farm · Console</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: console da ufficio, menu a sinistra e area di lavoro; su telefono il menu diventa una barra orizzontale.
   Ticket Farm: nero, gradiente blu→turchese per le azioni, oro come accento. */
:root{
  --bg:#000000; --surface:#0c1016; --surface-2:#07090d; --raise:#121821; --ink:#ffffff; --text:#d6dee8; --muted:#9aa7b6; --line:#1a222d;
  --accent:#2aa7ff; --accent-soft:rgba(42,167,255,.13);
  --grad:linear-gradient(135deg,#1e6ff0 0%,#1aa0e8 50%,#19c9b8 100%);
  --gold:#d9ab45; --gold-soft:rgba(217,171,69,.13); --gold-grad:linear-gradient(135deg,#f6dc8a,#d9ab45 55%,#b88424);
  --teal:#19c2c9; --teal-soft:rgba(25,194,201,.13); --red:#ff7a66; --red-soft:rgba(255,122,102,.14); --ok:#20c997; --ok-soft:rgba(32,201,151,.13);
  --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --raise:#e2e9f2; --ink:#0b1622; --text:#26364a; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10);
  --gold:#9a6f12; --gold-soft:rgba(217,171,69,.18); --gold-grad:linear-gradient(135deg,#c08a1e,#8a6210);
  --teal:#0b878d; --teal-soft:rgba(11,135,141,.10); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --ok:#13805f; --ok-soft:rgba(19,128,95,.10);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --raise:#e2e9f2; --ink:#0b1622; --text:#26364a; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10);
  --gold:#9a6f12; --gold-soft:rgba(217,171,69,.18); --gold-grad:linear-gradient(135deg,#c08a1e,#8a6210);
  --teal:#0b878d; --teal-soft:rgba(11,135,141,.10); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --ok:#13805f; --ok-soft:rgba(19,128,95,.10);
  color-scheme:light;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;color:var(--ink);padding:0 6px}
.logo svg{width:30px;height:30px}
.logo em{font-style:normal;background:linear-gradient(90deg,#2a8ff0,#2aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav .grp{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px;opacity:.8}
.nav .grp:first-child{padding-top:2px}
.nav .grpbox{display:flex;flex-direction:column;gap:2px}
.nav button.grp{display:flex;justify-content:space-between;align-items:center;width:100%;border-radius:8px;cursor:pointer;padding:12px 12px 6px}
.nav button.grp:hover{background:none;color:var(--ink)}
.nav .grp-r{display:flex;align-items:center;gap:6px}
.nav .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.nav .grpbox.open .chev{transform:rotate(45deg)}
.nav .grp-items{display:none;flex-direction:column;gap:2px}.nav .grpbox.open .grp-items{display:flex}
.tgroup{font-size:15px;color:var(--ink);margin:10px 0 0;font-weight:600}
.tuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tut{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;color:var(--text)}
.tut:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:18px;padding-left:4px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tbody{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.tbody b{color:var(--ink);font-weight:600;font-size:15.5px;line-height:1.3}
.article{max-width:860px;display:flex;flex-direction:column;gap:18px}
.article h1{margin-top:4px}
.tvideo{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--line)}
.article h2{font-size:17px;color:var(--ink);margin:0 0 10px}
.proc{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:10px}
.proc li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;line-height:1.55}
.proc li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.proc b,.tip b{color:var(--ink);font-weight:600}
.swim{display:grid;grid-template-columns:repeat(var(--lanes),minmax(0,1fr));column-gap:12px;row-gap:14px;position:relative}
.lane-h{grid-row:1;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;border-radius:10px;color:var(--lc);background:var(--lb);text-align:center}
.lane-bg{border-radius:12px;background:var(--lb);opacity:.35;z-index:0}
.step{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);box-shadow:0 6px 18px rgba(0,0,0,.08);font-size:13.5px;line-height:1.45}
.step b{color:var(--ink);font-size:14.5px;font-weight:600}
.step .num{position:absolute;top:-12px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--lc);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center}
.step .who{display:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--lc)}
.step .arrow{position:absolute;top:-19px;left:14px;font-size:15px;color:var(--muted);line-height:1}
.step.result{border-top-color:transparent;background:var(--grad);color:#fff;border:0;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.step.result b,.step.result span{color:#fff}
.step.result .num{position:static;background:rgba(255,255,255,.25)}
.l-tel{--lc:#b07d12;--lb:rgba(217,171,69,.16)} .l-wa{--lc:#1a9a4f;--lb:rgba(31,168,85,.14)} .l-mail{--lc:#c2581b;--lb:rgba(230,120,50,.14)}
.l-app{--lc:#1570d6;--lb:rgba(42,167,255,.14)} .l-con{--lc:#0b8a91;--lb:rgba(25,194,201,.14)}
@media (max-width:760px){
  .swim{grid-template-columns:minmax(0,1fr)!important}
  .lane-h,.lane-bg{display:none}
  .step{grid-column:1!important;grid-row:auto!important}
  .step .who{display:block}
}
.shot{display:block;margin-top:8px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;cursor:zoom-in;max-width:100%}
.shot img{display:block;width:100%;height:auto;max-height:220px;object-fit:contain}
.shotview figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(1100px,100%);max-height:100%}
.shotview img{max-width:100%;max-height:calc(100vh - 140px);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.shotview figcaption{color:#fff;font-weight:600;text-align:center}
.tip{margin:0;background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.linkback{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px}
#tut-next{align-self:flex-start}
.nav .n{font-size:11px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--accent)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px, min(4vw,36px));padding-right:max(16px, env(safe-area-inset-right, 0px), min(4vw,36px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.5px;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600;color:var(--ink);margin:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raise)}
tbody tr.sel td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12px}
.strong{color:var(--ink);font-weight:600}
.dim{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-ITSM{background:var(--accent-soft);color:var(--accent)}
.s-Halo{background:var(--teal-soft);color:var(--teal)}
.s-O365{background:var(--gold-soft);color:var(--gold)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-new{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--gold-soft);color:var(--gold)}
.p-urg{background:var(--red-soft);color:var(--red)}
.p-mut{background:var(--raise);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.msgs{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.msg-l{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px}
.msg-list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 260px);overflow:auto}
.msg-i{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--text);font:inherit}
.msg-i[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.msg-i-h{display:flex;gap:8px;align-items:center}.msg-i-h b{flex:1;color:var(--ink)}.msg-i-h .logo,.msg-h .logo{width:26px;height:26px;font-size:11px}
.msg-i-x{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-r{display:flex;flex-direction:column;gap:12px;min-height:420px}
.msg-h{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.msg-h>div{display:flex;gap:10px;align-items:center}.msg-h b{color:var(--ink)}
.chatbox{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 340px);min-height:200px;overflow:auto;padding:4px}
.bub{max-width:78%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;align-self:flex-start}
.bub p{margin:0;color:var(--ink);white-space:pre-wrap}.bub-w{font-size:12px;font-weight:700;color:var(--muted)}.bub-t{font-size:11px;color:var(--muted);align-self:flex-end}
.bub.fwd{border-left:3px solid #25d366}.bub.tf{align-self:flex-end;background:var(--accent-soft);border-color:transparent}.bub.tf .bub-w{color:var(--accent)}
.bub-fc{border-left:3px solid var(--gold);padding:4px 8px;font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:2px}.bub-fc b{font-size:11px;color:var(--gold)}
.bub-x{display:flex;gap:10px;justify-content:flex-end}.bub-x .linkback{font-size:12px}.warnb{color:var(--red)!important}
.msg-f{display:flex;gap:8px;align-items:flex-end}.msg-f textarea{resize:vertical}
.ts-chat{max-height:260px}
@media (max-width:900px){.msgs{grid-template-columns:minmax(0,1fr)}.msg-l{position:static}.msg-list{max-height:260px}}
.conn.spento{opacity:.7}.conn.inuso{border-color:var(--ok)}
#k-body .mono{white-space:nowrap}
.pic{vertical-align:-2px;flex:0 0 auto}.tech-i{margin-right:3px}
.ptag{--pc:#7a8796;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap}
.rolesw .ri{display:inline-flex;margin-right:8px;vertical-align:-3px}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--ink)}
th.sortable::after{content:"↕";opacity:.3;margin-left:5px;font-size:11px}th.sortable[data-dir="asc"]::after{content:"▲";opacity:.9;color:var(--accent)}th.sortable[data-dir="desc"]::after{content:"▼";opacity:.9;color:var(--accent)}
.sortbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.sortbar .input{width:auto;padding:6px 10px}
.glance.rglance{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px}.rglance .gl{cursor:default}
.warnbox{border-color:var(--gold);background:var(--gold-soft)}.okbox{border-color:var(--ok);background:var(--ok-soft)}
.rsteps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.5}.rsteps li{display:list-item}.input.inl{display:inline-block;width:auto;padding:4px 8px;margin:0 4px}
.nav .n.bad{background:var(--red-soft);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 18px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;color:var(--text);cursor:pointer;font:inherit}
.kpi:disabled{cursor:default}.kpi:not(:disabled):hover{border-color:var(--accent)}
.kpi b{font-size:34px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}.kpi span{font-size:14.5px;font-weight:600;color:var(--ink)}.kpi small{font-size:12.5px;color:var(--muted)}
.kpi.hot{border-color:var(--red);background:var(--red-soft)}.kpi.hot b{color:var(--red)}.kpi.warm{border-color:var(--gold);background:var(--gold-soft)}.kpi.warm b{color:var(--gold)}
.empty-ok{list-style:none;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.srow{display:grid;grid-template-columns:12px 1fr auto 14px;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;color:var(--text);font:inherit;cursor:pointer}.srow:first-of-type{border-top:0}.srow:hover b{color:var(--accent)}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--muted)}.sdot.ok{background:var(--ok)}.sdot.ko{background:var(--red)}.chev-r{color:var(--muted)}
.arow{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.arow .dim{grid-column:2}.arow:first-child{border-top:0}
.qmsg{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;color:var(--text);font:inherit;cursor:pointer}.qmsg:first-of-type{border-top:0}.qmsg b{color:var(--ink)}.qmsg:hover b{color:var(--accent)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tplwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.tpllist{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}.tpllist .tg{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px}.tpllist .tg:first-child{margin-top:0}
.tpli{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;cursor:pointer}
.tpli b{color:var(--ink);font-size:13.5px}.tpli .dim{font-size:12px}.tpli[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}.tpli:hover{background:var(--raise)}
.tpled{display:flex;flex-direction:column;gap:12px}.tpled textarea{font-size:13px;line-height:1.5;resize:vertical}
.tplprev{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}.tplprev b{color:var(--ink)}.tplprev pre{margin:0;white-space:pre-wrap;font:inherit;font-size:13.5px;color:var(--text)}
@media (max-width:900px){.tplwrap{grid-template-columns:minmax(0,1fr)}.tpllist{position:static}}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabsbar button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}.tabsbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.atags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.atag{--ac:#2aa7ff;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:999px;padding:2px 9px}
.atag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac)}

function waBtn(tel){

  let h = 0; for(const ch of c.name) h = (h*31 + ch.charCodeAt(0)) % 360;
  const src = c.dom ? (LIVE ? "/api/app/logo?d=" : "https://www.google.com/s2/favicons?sz=128&domain=") + encodeURIComponent(c.dom) : "";
  return `<span class="lav" style="--h:${h}" aria-hidden="true">${esc(ini)}${src?`<img src="${src}" alt="" loading="lazy" onload="if(this.naturalWidth&&this.naturalWidth<=16)this.remove()" onerror="this.remove()">`:""}</span>`;
}

/* ---------- ordinamento: ogni tabella si ordina toccando l'intestazione di una colonna (di nuovo = ordine inverso) ---------- */
const SORTS = {};
const sortKey = (tbl, i) => S.view+":"+(tbl.id || [...document.querySelectorAll("#main .tbl table")].indexOf(tbl))+":"+i;
function cellVal(td){
  if(!td) return "";
  if(td.dataset.sort != null) return td.dataset.sort;
  return td.innerText.replace(/\s+/g," ").trim();
}
function toNum(v){
  let m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})(?:,?\s+(\d{1,2}):(\d{2}))?/.exec(v);
  if(m){ const y = m[3].length===2 ? 2000+ +m[3] : +m[3]; return new Date(y, m[2]-1, m[1], m[4]||0, m[5]||0).getTime(); }
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v).getTime();
  if(/^-?\d+([.,]\d+)?(\s|$)/.test(v)) return parseFloat(v.replace(",", "."));
  return null;
}
function cmpVal(a, b){ const x = toNum(a), y = toNum(b); if(x!==null && y!==null) return x-y; if(x!==null) return -1; if(y!==null) return 1; return a.localeCompare(b, "it", {numeric:true, sensitivity:"base"}); }
function applySort(tbl){
  const ths = [...tbl.querySelectorAll("thead th")];
  const st = ths.map((th,i)=>[i, SORTS[sortKey(tbl,i)]]).find(x=>x[1]);
  ths.forEach((th,i)=>{ const d = SORTS[sortKey(tbl,i)]; th.dataset.dir = d || ""; th.setAttribute("aria-sort", d==="asc"?"ascending":d==="desc"?"descending":"none"); });
  if(!st) return;
  const [i, dir] = st, body = tbl.tBodies[0]; if(!body) return;
  const rows = [...body.rows].filter(r=>r.cells.length>1);
  if(rows.length < 2) return;
  const sorted = rows.slice().sort((r1, r2)=>cmpVal(cellVal(r1.cells[i]), cellVal(r2.cells[i])) * (dir==="asc"?1:-1));
  /* già in ordine: non toccare la tabella (evita di ridisegnare all'infinito) */
  if(sorted.every((r,k)=>r===rows[k])) return;
  SORTING = true; sorted.forEach(r=>body.appendChild(r)); setTimeout(()=>{ SORTING = false; }, 0);
}
let SORTING = false;
function wireSort(root){
  (root||document).querySelectorAll("#main .tbl table").forEach(tbl=>{
    if(!tbl.tHead) return;
    [...tbl.tHead.rows[0].cells].forEach((th,i)=>{
      if(th.dataset.sortWired || !th.textContent.trim() || th.querySelector(".sr")) return;
      th.dataset.sortWired = "1"; th.classList.add("sortable"); th.tabIndex = 0; th.title = "Ordina per «"+th.textContent.trim()+"»";
      const go = () => { const k = sortKey(tbl,i), cur = SORTS[k];
        Object.keys(SORTS).filter(x=>x.startsWith(k.slice(0, k.lastIndexOf(":")+1))).forEach(x=>delete SORTS[x]);
        SORTS[k] = cur==="asc" ? "desc" : "asc"; applySort(tbl); };
      th.onclick = go; th.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    });
    applySort(tbl);
  });
}
/* le tabelle si ridisegnano quando cambiano i filtri: l'ordine scelto resta */
new MutationObserver(muts=>{ if(SORTING) return; if(muts.some(m=>[...m.addedNodes].some(n=>n.nodeType===1 && n.tagName!=="TR"))) wireSort(); else if(muts.some(m=>m.target.tagName==="TBODY")) document.querySelectorAll("#main .tbl table").forEach(applySort); }).observe(document.getElementById("main"), {childList:true, subtree:true});

function simulateTeamLocal(){
  const open = S.tickets.filter(t=>t.state!=="Chiuso"), name = t => (cl(t.client)||{name:t.client}).name;
  const load = t => open.filter(x=>x.tech===t.ini).length, freest = TECHS.slice().sort((a,b)=>load(a)-load(b))[0], busiest = TECHS.slice().sort((a,b)=>load(b)-load(a))[0];
  const tips = [];
  open.filter(x=>x.urg && !x.plan).forEach(t=>tips.push({titolo:"Pianifica l'urgenza di "+name(t), perche:t.title+": è urgente ma senza data"+(t.tech?", assegnato a "+t.tech+".":" e senza tecnico."), ticket:t.id}));
  if(toCheck() && can("posta","v")) tips.push({titolo:"Verifica "+toCheck()+" mail in Posta in arrivo", perche:"Non hanno ticket né cliente riconosciuto: finché restano lì nessuno le segue.", ticket:"", view:"posta"});
  open.filter(x=>!x.tech).forEach(t=>tips.push({titolo:"Assegna "+t.id+" a "+(freest?freest.ini:"un tecnico"), perche:"Nessun tecnico per «"+t.title+"» di "+name(t)+(freest?"; "+freest.ini+" ha "+load(freest)+" ticket aperti.":"."), ticket:t.id}));
  if(busiest && freest && load(busiest)-load(freest)>=3) tips.push({titolo:"Alleggerisci "+busiest.ini, perche:busiest.ini+" ha "+load(busiest)+" ticket aperti, "+freest.ini+" solo "+load(freest)+": sposta un intervento non urgente.", ticket:""});
  open.filter(x=>/attesa/i.test(x.state)).forEach(t=>tips.push({titolo:(/cliente/i.test(t.state)?"Risenti il cliente ":"Sollecita il ricambio per ")+name(t), perche:t.id+" è fermo in «"+t.state.toLowerCase()+"».", ticket:t.id}));
  const u = open.filter(x=>x.urg).length, n = open.filter(x=>!x.tech).length;
  return {source:"simulazione", model:AI.model, text:"Oggi ci sono "+open.length+" ticket aperti"+(u?", "+u+" urgent"+(u===1?"e":"i"):"")+(n?" e "+n+" senza tecnico":"")+". "+(busiest?"Il più carico è "+busiest.ini+" con "+load(busiest)+" ticket"+(freest&&freest!==busiest?", il più libero "+freest.ini+" con "+load(freest)+".":"."):""), tips:tips.slice(0,5)};
}
function fillTeamAI(fresh){

      : r.source==="simulazione" ? "Assistente AI attivo · "+m+" · risposta di esempio: quella vera arriva con la chiave API in Configurazione → Assistente AI."
      : r.source==="regole" ? "L'assistente non ha risposto ("+(r.error||"errore")+"): suggerimenti scritti dalle regole." : "Scritto in automatico dai ticket.";
    $("#rem-again").hidden = r.source!=="claude";
  };
  $("#rem-again").onclick = ()=>fillTeamAI(true);
  if(LIVE) getJ("/api/admin/ai/team"+(fresh?"?fresh=1":"")).then(r=>{ if(r.source==="spento") return; show(r); }).catch(err=>show({...simulateTeamLocal(), source:"regole", error:err.message}));

    $("#mf-list").innerHTML = l.map(th=>{ const c = cl(th.client) || {name:th.client}, last = (th.msgs||[]).slice(-1)[0] || {};
      const kk = ticketContact({contatto:th.contatto || (S.tickets.find(x=>x.id===th.ticket)||{}).contatto, client:th.client});
      return `<button type="button" class="msg-i" data-th="${esc(th.ticket)}" aria-current="${S.thSel===th.ticket}"><div class="msg-i-h">${logo(c)}<b>${esc(kk?kk.n:c.name)}</b><span class="dim">${esc(last.t||"")}</span></div><span class="dim">${esc(c.name)}</span>
        <span class="mono dim">${esc(th.ticket)} · ${esc(th.tech||"")}</span><span class="msg-i-x">${esc(last.text||"")}</span></button>`; }).join("") || `<p class="dim">Nessuna conversazione.</p>`;
    $("#mf-list").querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.thSel = b.dataset.th; paintList(); });
    paintChat();
  };
  const paintChat = () => {
    const th = myThreads().find(x=>x.ticket===S.thSel), box = $("#mf-chat");
    if(!th){ box.innerHTML = `<p class="dim">Scegli una conversazione.</p>`; return; }

    const kk = ticketContact({contatto:th.contatto || (t||{}).contatto, client:th.client});
    box.innerHTML = `<div class="msg-h"><div>${logo(c)}<div><b>${esc(kk?kk.n:c.name)}</b>${kk&&kk.ruolo?` <span class="dim">· ${esc(kk.ruolo)}</span>`:""}<div class="dim">${esc(c.name)} · <span class="mono">${esc(th.ticket)}</span>${t?" · "+esc(t.title)+" · "+esc(t.state):""} · tecnico ${esc(th.tech||"")}</div></div></div>
        <button class="btn small primary" type="button" id="mf-open">Apri ticket</button></div>
      <div class="chatbox" id="mf-bub">${bubbles(th, true)}</div>
      <form class="msg-f" id="mf-form" data-perm="ticket:m"><textarea class="input" id="mf-text" rows="2" placeholder="Scrivi al tecnico ${esc(th.tech||"")}: lo riceve nell'app" required></textarea><button class="btn primary" type="submit">Invia</button></form>`;
    const bb = $("#mf-bub"); bb.scrollTop = bb.scrollHeight;
    $("#mf-open").onclick = ()=>ticketSheet(th.ticket);
    const ref = i => ({ticket:th.ticket, techMail:th.techMail, id:th.msgs[i].id});
    box.querySelectorAll("[data-medit]").forEach(b=>b.onclick=()=>{ const i = +b.dataset.medit, m = th.msgs[i];
      openEditor(`<h2>Modifica messaggio al tecnico</h2><label class="field"><span>Testo</span><textarea class="input" id="me-text" rows="4" required>${esc(m.text)}</textarea></label>
        <div class="actions"><button class="btn primary" type="submit">Salva</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
        const text = $("#me-text").value.trim(); if(!text) return;
        if(LIVE) return put("/api/admin/threads/msg", {...ref(i), text}).then(r=>{ th.msgs[i] = r.msg; closeEditor(); paintList(); toast("Messaggio modificato"); }).catch(err=>toast("Non riuscito: "+err.message));
        m.text = text; m.mod = "adesso"; closeEditor(); paintList(); toast("Messaggio modificato (prova)"); }); });
    box.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{ const i = +b.dataset.mdel;
      if(!confirmInline(b)) return;
      if(LIVE) return fetch("/api/admin/threads/msg", {method:"DELETE", headers:{"Content-Type":"application/json", ...H()}, body:JSON.stringify(ref(i))}).then(r=>r.ok?r.json():Promise.reject(new Error("non riuscito"))).then(()=>{ th.msgs.splice(i,1); paintList(); toast("Messaggio eliminato"); }).catch(err=>toast(err.message));
      th.msgs.splice(i,1); paintList(); toast("Messaggio eliminato (prova)"); });
    $("#mf-form").onsubmit = e => { e.preventDefault(); const text = $("#mf-text").value.trim(); if(!text) return;
      if(LIVE) return post("/api/admin/threads/reply", {ticket:th.ticket, techMail:th.techMail, text}).then(r=>{ th.msgs.push(r.msg); paintList(); toast("Inviato a "+th.tech); }).catch(err=>toast("Non inviato: "+err.message));
      { const tk = S.tickets.find(x=>x.id===th.ticket); if(tk && RECAP_CFG.attivo && RECAP_CFG.messaggio) recapLocal(tk, "messaggio"); }
      th.msgs.push({k:"tf", t:new Date().toLocaleTimeString("it-CH",{hour:"2-digit",minute:"2-digit"}), by:(ME&&ME.nome)||"Ufficio", id:"o"+Date.now().toString(36), text}); logLocal("Messaggio al tecnico", th.ticket+" · "+th.tech, "ticket"); paintList(); toast("Inviato a "+th.tech+" (prova)"); };
  };
  $("#mf-q").oninput = e => { M.q = e.target.value; paintList(); };
  $("#mf-ord").value = M.ord || "rec"; $("#mf-ord").onchange = e => { M.ord = e.target.value; paintList(); };
  if($("#mf-new")) $("#mf-new").onclick = ()=>openEditor(`<h2>Nuova conversazione con un tecnico</h2>
    <div class="formgrid"><label class="field wide"><span>Ticket</span><select class="input" id="nc-t" required><option value="">Scegli il ticket…</option>${S.tickets.filter(t=>t.state!=="Chiuso").map(t=>`<option value="${esc(t.id)}">${esc(t.id)} · ${esc((cl(t.client)||{name:t.client}).name)} · ${esc(t.title)}</option>`).join("")}</select></label>
      <label class="field wide"><span>Tecnico</span><select class="input" id="nc-tech" required>${TECHS.filter(alive).map(t=>`<option value="${esc(t.mail)}">${t.ini} · ${esc(techName(t))}</option>`).join("")}</select></label>
      <label class="field wide"><span>Messaggio</span><textarea class="input" id="nc-text" rows="3" required placeholder="Lo riceve nell'app"></textarea></label></div>
    <div class="actions"><button class="btn primary" type="submit">Invia</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
      const tk = $("#nc-t").value, tm = $("#nc-tech").value, text = $("#nc-text").value.trim(), t = S.tickets.find(x=>x.id===tk), tech = TECHS.find(x=>x.mail===tm);
      if(!t || !tech || !text){ toast("Scegli ticket, tecnico e scrivi il messaggio"); return; }
      if(LIVE) return post("/api/admin/threads", {ticket:tk, techMail:tm, text}).then(()=>{ closeEditor(); S.thSel = tk; load(); toast("Inviato a "+tech.ini); }).catch(err=>toast("Non inviato: "+err.message));
      let th = S.threads.find(x=>x.ticket===tk && x.techMail===tm);
      if(!th){ th = {ticket:tk, client:t.client, tech:tech.ini, techMail:tm, msgs:[]}; S.threads.unshift(th); }
      th.msgs.push({k:"tf", t:new Date().toLocaleTimeString("it-CH",{hour:"2-digit",minute:"2-digit"}), by:(ME&&ME.nome)||"Ufficio", id:"o"+Date.now().toString(36), text});
      S.thSel = tk; logLocal("Conversazione aperta con il tecnico", tk+" · "+tech.ini, "ticket"); closeEditor(); messaggi(); toast("Inviato a "+tech.ini+" (prova)"); });
  if($("#mf-tech")) $("#mf-tech").onchange = e => { M.tech = e.target.value; paintList(); };
  paintList();
}

/* ---------- Anagrafiche: aziende clienti, fornitori e contatti (le persone) ---------- */
const anagTabs = () => { const t = S.anag || "clienti"; return `<div class="tabsbar" role="tablist">${[["clienti","Clienti",liveClients().length],["fornitori","Fornitori",liveSuppliers().length],["contatti","Contatti",CLIENTS.filter(c=>!c.eliminato).reduce((a,c)=>a+liveContacts(c).length,0)]].map(([k,l,n])=>`<button type="button" role="tab" data-anag="${k}" aria-selected="${t===k}">${l} <span class="dim">${n}</span></button>`).join("")}</div>`; };
const wireTabs = () => document.querySelectorAll("[data-anag]").forEach(b=>b.onclick=()=>{ S.anag = b.dataset.anag; clienti(); });
function clienti(){
  if(S.anag==="contatti") return contatti();
  const TIPO = S.anag==="fornitori" ? "fornitore" : "cliente", FORN = TIPO==="fornitore";
  const F = S.cf = S.cf || cfReset(), mine = ROLE==="op" ? myTech().ini : "";
  if(mine && F.mine===undefined) F.mine = true;
  const openOf = c => FORN ? S.tickets.filter(t=>t.fornitore===c.id && t.state!=="Chiuso") : S.tickets.filter(t=>t.client===c.id && t.state!=="Chiuso");
  $("#main").innerHTML = `<div class="top"><div><h1>Anagrafiche</h1><p class="sub">Aziende clienti e fornitori. Si comunica sempre con un contatto preciso dell'azienda.</p></div>
      <button class="btn primary" type="button" id="c-add" data-perm="clienti:m">+ Nuovo ${TIPO}</button></div>
    ${anagTabs()}
    <div class="panel filters">
      <div class="f-row"><label class="f-q"><span class="sr">Cerca</span><input class="input" id="cl-q" type="search" placeholder="Nome, città, contatto, mail, telefono o dominio" value="${esc(F.q)}"></label>
        <button class="btn small" type="button" id="cl-x">Azzera filtri</button></div>
      <div class="f-grid">
        <label class="field"><span>Città</span><select class="input" id="cl-city"><option value="">Tutte le città</option>${[...new Set(CLIENTS.filter(c=>(c.tipo||"cliente")===TIPO).map(c=>c.city).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
      </div>
      <div class="chips">
        ${mine&&!FORN?`<label class="check"><input type="checkbox" id="cl-mine" ${F.mine?"checked":""}> Solo i clienti dei miei ticket</label>`:""}
        <label class="check"><input type="checkbox" id="cl-open" ${F.open?"checked":""}> ${FORN?"Con ticket in attesa":"Con ticket aperti"}</label>
        <label class="check"><input type="checkbox" id="cl-wa" ${F.wa?"checked":""}> Con numero WhatsApp</label>
        <label class="check"><input type="checkbox" id="cl-old" ${F.old?"checked":""}> Mostra disattivati ed eliminati</label>
      </div>
    </div>
    <p class="f-count" id="cl-n" aria-live="polite"></p>
    <div class="tbl"><table><thead><tr><th>${FORN?"Fornitore":"Cliente"}</th><th>${FORN?"Ticket collegati":"Ticket aperti"}</th><th>Dominio</th><th>Contatti</th><th><span class="sr">Azioni</span></th></tr></thead><tbody id="cl-body"></tbody></table></div>`;
  wireTabs();
  $("#cl-city").value = F.city;
  const norm = x => String(x||"").toLowerCase();
  const paint = () => {
    const list = CLIENTS.filter(c=>(c.tipo||"cliente")===TIPO).filter(c=>{
      if(!F.old && (c.eliminato || c.attivo===false)) return false;
      if(F.sys && c.sys!==F.sys) return false;
      if(F.city && c.city!==F.city) return false;
      if(F.open && !openOf(c).length) return false;
      if(F.wa && !(c.contacts||[]).some(k=>k.tel)) return false;
      if(!FORN && mine && F.mine && !S.tickets.some(t=>t.client===c.id && t.tech===mine)) return false;
      if(F.q){ const q = norm(F.q), qd = q.replace(/[^0-9+]/g,""); if(![c.name, c.city, c.dom, ...(c.contacts||[]).flatMap(k=>[k.n,k.mail])].some(v=>norm(v).includes(q)) && !(qd.length>2 && (c.contacts||[]).some(k=>String(k.tel||"").replace(/[^0-9+]/g,"").includes(qd)))) return false; }
      return true; }).sort((a,b)=>a.name.localeCompare(b.name));
    $("#cl-n").textContent = list.length+" di "+(FORN?liveSuppliers():liveClients()).length+(FORN?" fornitori":" clienti");
    $("#cl-body").innerHTML = list.map(c=>{ const o = openOf(c); return `<tr><td><div style="display:flex;gap:10px;align-items:center">${logo(c)}<div><span class="strong">${clientTag(c)}</span><div class="dim">${esc(c.city||"")}</div></div></div></td>
        <td>${o.length?`<button class="tlink strong" type="button" data-tk="${esc(c.id)}">${o.length} ${FORN?"in attesa":"aperti"}</button>${o.some(t=>t.urg)?' <span class="pill p-urg">Urgente</span>':""}`:`<span class="dim">nessuno</span>`}</td><td class="mono">${c.dom?"@"+esc(c.dom):"—"}</td>
        <td>${liveContacts(c).map(k=>`<div class="contact"><div>${personLine(k)}<div class="dim">${esc(k.mail||"")}${k.tel?" · "+esc(k.tel):""}</div></div>${waBtn(k.tel)}</div>`).join("") || `<span class="dim">Nessun contatto</span>`}<button class="linkback" type="button" data-addk="${esc(c.id)}" data-perm="clienti:m">+ Contatto</button></td>
        <td class="act" data-row="${esc(c.id)}">${c.eliminato ? `<button class="btn small" type="button" data-rest="${esc(c.id)}" data-perm="clienti:m">Ripristina</button>` : `<button class="btn small" type="button" data-edit="${esc(c.id)}" data-perm="clienti:m">Modifica</button> <button class="btn small" type="button" data-onoff="${esc(c.id)}" data-perm="clienti:m">${c.attivo===false?"Riattiva":"Disattiva"}</button> <button class="btn small danger" type="button" data-ask="${esc(c.id)}" data-perm="clienti:e">Elimina</button>`}</td></tr>`; }).join("") || `<tr><td colspan="5" class="dim">Nessun cliente con questi filtri</td></tr>`;
    $("#cl-body").querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{ S.view="ticket"; S.tf = Object.assign(tfReset(), FORN ? {forn:b.dataset.tk, stato:"aperti"} : {client:b.dataset.tk}); render(); });
    $("#cl-body").querySelectorAll("[data-addk]").forEach(b=>b.onclick=()=>contactForm(null, b.dataset.addk));
    $("#cl-body").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>clientForm(cl(b.dataset.edit)));
    $("#cl-body").querySelectorAll("[data-onoff]").forEach(b=>b.onclick=()=>{ const c = cl(b.dataset.onoff), on = c.attivo===false;
      if(LIVE) return put("/api/admin/clients/"+encodeURIComponent(c.id), {...c, attivo:on}).then(()=>{ toast(on?"Cliente riattivato":"Cliente disattivato: i suoi ticket restano"); load(); }).catch(err=>toast("Non riuscito: "+err.message));
      c.attivo = on; logLocal(on?"Cliente riattivato":"Cliente disattivato", c.name, "clienti"); paint(); toast((on?"Cliente riattivato":"Cliente disattivato: i suoi ticket restano")+" (prova)"); });
    $("#cl-body").querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>{ const c = cl(b.dataset.rest);
      if(LIVE) return put("/api/admin/clients/"+encodeURIComponent(c.id), {ripristina:true}).then(()=>{ toast("Cliente ripristinato"); load(); }).catch(err=>toast("Non riuscito: "+err.message));
      delete c.eliminato; c.attivo = true; logLocal("Cliente ripristinato", c.name, "clienti"); paint(); toast("Cliente ripristinato (prova)"); });
    $("#cl-body").querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askDelete(b, "il cliente "+cl(b.dataset.ask).name, ()=>{
      const id = b.dataset.ask;
      if(LIVE) return del("/api/admin/clients/"+encodeURIComponent(id)).then(()=>{ toast("Cliente eliminato: i suoi ticket restano nello storico"); load(); });
      const c = cl(id); c.eliminato = new Date().toISOString(); c.attivo = false; logLocal("Cliente eliminato", c.name, "clienti"); clienti(); toast("Cliente eliminato: i suoi ticket restano nello storico (prova)");
    }, clienti));
  };
  $("#cl-q").oninput = e => { F.q = e.target.value; paint(); };
  $("#cl-city").onchange = e => { F.city = e.target.value; paint(); };
  ["open","wa","mine","old"].forEach(k=>{ const el = $("#cl-"+k); if(el) el.onchange = e => { F[k] = e.target.checked; paint(); }; });
  $("#cl-x").onclick = () => { S.cf = cfReset(); clienti(); };
  $("#c-add").onclick = ()=>clientForm(null, TIPO);
  paint();
}
/* Contatti: tutte le persone di clienti e fornitori */
function contatti(){
  const F = S.kf = S.kf || {q:"", tipo:"", az:""};
  const all = () => CLIENTS.filter(c=>!c.eliminato).flatMap(c=>liveContacts(c).map(k=>({k, c})));
  $("#main").innerHTML = `<div class="top"><div><h1>Anagrafiche</h1><p class="sub">Le persone con cui si parla: ogni contatto appartiene a un'azienda cliente o fornitrice.</p></div>
      <button class="btn primary" type="button" id="k-add" data-perm="clienti:m">+ Nuovo contatto</button></div>
    ${anagTabs()}
    <div class="panel filters"><div class="f-row"><label class="f-q"><span class="sr">Cerca</span><input class="input" id="k-q" type="search" placeholder="Nome, ruolo, azienda, mail o telefono" value="${esc(F.q)}"></label></div>
      <div class="f-grid"><label class="field"><span>Tipo</span><select class="input" id="k-tipo"><option value="">Clienti e fornitori</option><option value="cliente">Solo clienti</option><option value="fornitore">Solo fornitori</option></select></label>
        <label class="field"><span>Azienda</span><select class="input" id="k-az"><option value="">Tutte le aziende</option>${CLIENTS.filter(c=>!c.eliminato).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label></div></div>
    <p class="f-count" id="k-n"></p>
    <div class="tbl"><table><thead><tr><th>Contatto</th><th>Azienda</th><th>Mail</th><th>Telefono</th><th>Ticket aperti</th><th><span class="sr">Azioni</span></th></tr></thead><tbody id="k-body"></tbody></table></div>`;
  wireTabs();
  $("#k-tipo").value = F.tipo; $("#k-az").value = F.az;
  const paint = () => {
    const q = F.q.toLowerCase(), qd = q.replace(/[^0-9+]/g,"");
    const list = all().filter(({k,c})=>(!F.tipo || (c.tipo||"cliente")===F.tipo) && (!F.az || c.id===F.az) && (!q || [k.n,k.ruolo,k.mail,c.name].some(v=>String(v||"").toLowerCase().includes(q)) || (qd.length>2 && String(k.tel||"").replace(/[^0-9+]/g,"").includes(qd)))).sort((a,b)=>a.k.n.localeCompare(b.k.n));
    $("#k-n").textContent = list.length+" contatti";
    $("#k-body").innerHTML = list.map(({k,c})=>{ const open = S.tickets.filter(t=>t.contatto===k.id && t.state!=="Chiuso").length;
      return `<tr><td>${personLine(k)}</td><td>${esc(c.name)} <span class="pill ${isSupplier(c)?"p-warn":"p-ok"}">${isSupplier(c)?"Fornitore":"Cliente"}</span></td><td class="mono">${esc(k.mail||"—")}</td><td>${k.tel?`<div class="contact"><span class="mono">${esc(k.tel)}</span>${waBtn(k.tel)}</div>`:'<span class="dim">—</span>'}</td>
        <td>${open?`<button class="tlink strong" type="button" data-kt="${esc(k.id)}">${open}</button>`:'<span class="dim">0</span>'}</td>
        <td class="act" data-krow="${esc(k.id)}"><button class="btn small" type="button" data-kedit="${esc(k.id)}" data-perm="clienti:m">Modifica</button> <button class="btn small danger" type="button" data-kdel="${esc(k.id)}" data-perm="clienti:e">Elimina</button></td></tr>`; }).join("") || `<tr><td colspan="6" class="dim">Nessun contatto</td></tr>`;
    $("#k-body").querySelectorAll("[data-kedit]").forEach(b=>b.onclick=()=>{ const x = contactById(b.dataset.kedit); contactForm(x.k, x.az.id); });
    $("#k-body").querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{ S.view="ticket"; S.tf = Object.assign(tfReset(), {contatto:b.dataset.kt}); render(); });
    $("#k-body").querySelectorAll("[data-kdel]").forEach(b=>b.onclick=()=>{ const x = contactById(b.dataset.kdel);
      askDelete(b, x.k.n+" ("+x.az.name+")", ()=>saveCompany(x.az, x.az.contacts.map(k=>k.id===x.k.id?{...k, eliminato:new Date().toISOString()}:k), "Contatto eliminato: resta nello storico dei ticket"), contatti); });
  };
  $("#k-q").oninput = e => { F.q = e.target.value; paint(); };

/* salva i contatti di un'azienda (dal vivo: modifica dell'anagrafica) */

  if(LIVE) return put("/api/admin/clients/"+encodeURIComponent(c.id), {...c, contacts}).then(()=>{ toast(msg); load(); }).catch(err=>{ toast("Non riuscito: "+err.message); });
  c.contacts = contacts; logLocal(msg.split(":")[0], c.name, "clienti"); clienti(); toast(msg+" (prova)");
}

/* limite di utenti attivi: utenti della console + tecnici dell'app */
function limitNow(){
  if(LIVE) return LIMITI;
  const n = USERS_LOCAL.filter(alive).length + TECHS.filter(alive).length, max = LIMITI.max||0;
  return {max, attivi:n, pieno: max>0 && n>=max};
}
const limitFull = () => limitNow().pieno;
const limitMsg = () => { const l = limitNow(); return "Limite di utenti raggiunto ("+l.attivi+" su "+l.max+")"; };

/* nel modulo di creazione: se il limite è pieno il modulo si blocca */

/* ---------- cruscotto del Tecnico: promemoria del giorno e prossime attività ---------- */
const OGGI = new Date();
const giornoBreve = d => { const x = new Date(OGGI); x.setDate(x.getDate()+d); return x.toLocaleDateString("it-CH",{weekday:"short", day:"numeric", month:"numeric"}); };
const giorno = d => { const x = new Date(OGGI); x.setDate(x.getDate()+d); return x.toLocaleDateString("it-CH",{weekday:"long", day:"numeric", month:"long"}); };
function myTech(){ return TECHS.find(t=>ME && t.mail===ME.mail) || TECHS.find(t=>t.ini==="MB") || TECHS[0] || {ini:"", zona:""}; }
const mapsUrl = c => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.name+" "+(c.city||""));
function agenda(){
  const me = myTech();
  const mine = S.tickets.filter(t=>t.tech===me.ini && t.state!=="Chiuso");
  const today = mine.filter(t=>t.plan && t.plan.day===0).sort((a,b)=>a.plan.time.localeCompare(b.plan.time));
  const later = mine.filter(t=>t.plan && t.plan.day>0).sort((a,b)=>a.plan.day-b.plan.day || a.plan.time.localeCompare(b.plan.time));
  const urgent = mine.filter(t=>t.urg && !t.plan);
  const waiting = mine.filter(t=>!t.plan && !t.urg && /attesa/i.test(t.state));
  const todo = mine.filter(t=>!t.plan && !t.urg && !/attesa/i.test(t.state));
  return {me, today, later, urgent, waiting, todo, toCheck: toCheck()};
}
/* promemoria scritto con regole fisse (gratis, sempre uguale); in futuro si potrà far scrivere all'assistente AI */
function reminderText(a){
  const nome = (ME && ME.nome && ME.nome!=="Amministratore") ? ME.nome.split(" ")[0] : "";
  const ora = OGGI.getHours(), saluto = ora < 13 ? "Buongiorno" : ora < 18 ? "Buon pomeriggio" : "Buonasera";
  const c = t => (cl(t.client)||{name:t.client}).name;
  const parts = [saluto+(nome?" "+nome:"")+"."];
  if(a.urgent.length) parts.push("Prima di tutto "+(a.urgent.length===1 ? "c'è un'urgenza da pianificare: "+c(a.urgent[0])+", «"+a.urgent[0].title+"»." : "ci sono "+a.urgent.length+" urgenze da pianificare: "+a.urgent.map(c).join(", ")+"."));
  if(a.today.length) parts.push("Oggi "+(a.today.length===1 ? "hai un intervento: " : "hai "+a.today.length+" interventi, il primo: ")+a.today[0].plan.time+" da "+c(a.today[0])+" ("+a.today[0].title.split(":")[0].toLowerCase()+").");
  else parts.push("Oggi non hai interventi pianificati.");
  if(a.later.length) parts.push((a.later[0].plan.day===1?"Domani":"Il "+giorno(a.later[0].plan.day))+" alle "+a.later[0].plan.time+": "+c(a.later[0])+".");
  if(a.waiting.length) parts.push(a.waiting.map(t=>t.id+" ("+c(t)+") è in attesa del ricambio: se è arrivato, avvisa il cliente.").join(" "));
  if(a.toCheck && can("posta","v")) parts.push(a.toCheck===1 ? "In Posta c'è una mail da verificare." : "In Posta ci sono "+a.toCheck+" mail da verificare.");
  return parts.join(" ");
}

const AI_MODELS = {"claude-opus-5-5":{nome:"Claude Opus 5.5", nota:"il più capace (consigliato)", in:4, out:20}, "claude-sonnet-5-5":{nome:"Claude Sonnet 5.5", nota:"veloce, buon equilibrio", in:2, out:10}, "claude-haiku-5-5":{nome:"Claude Haiku 5.5", nota:"il più economico", in:0.1, out:0.5}};

/* risposta di esempio quando l'assistente è acceso senza chiave (versione di prova) */
function aiSimulate(a){
  const name = t => (cl(t.client)||{name:t.client}).name;
  const f = [];
  if(a.urgent[0]) f.push("La priorità di oggi è "+name(a.urgent[0])+": l'"+a.urgent[0].title.split(":")[0].toLowerCase()+" dà "+(a.urgent[0].title.split(":")[1]||"problemi").trim()+" ed è urgente ma non ancora pianificato, quindi chiama il cliente in mattinata e fissa l'intervento.");
  if(a.today[0]) f.push("Alle "+a.today[0].plan.time+" sei da "+name(a.today[0])+" per la "+a.today[0].title.split(":").slice(-1)[0].trim()+": porta il kit di taratura.");
  if(a.later[0]) f.push((a.later[0].plan.day===1?"Domani":"Tra "+a.later[0].plan.day+" giorni")+" alle "+a.later[0].plan.time+" ti aspetta "+name(a.later[0])+(/lampada/i.test(a.later[0].title)?": verifica di avere una lampada di ricambio.":"."));
  if(a.waiting[0]) f.push("Per "+name(a.waiting[0])+" ("+a.waiting[0].id+") controlla se il ricambio è arrivato e, se sì, proponi una data.");
  const why = t => a.urgent.includes(t) ? "Urgente e senza data: va pianificato per primo." : a.today.includes(t) ? "È in agenda oggi alle "+t.plan.time+"." : a.later.includes(t) ? "Già pianificato: basta prepararsi." : a.waiting.includes(t) ? "Dipende dal ricambio: solo un controllo veloce." : "Da pianificare quando hai tempo.";
  return {source:"simulazione", model:AI.model, text:f.join(" ") || "Oggi non hai attività aperte.", order:[...a.urgent, ...a.today, ...a.waiting, ...a.later, ...a.todo].map(t=>({ticket:t.id, perche:why(t)}))};
}
function fillAI(a, fresh){
  if(!AI.enabled || !$("#rem")) return;
  const m = (AI_MODELS[AI.model]||{}).nome || AI.model;
  $("#rem").classList.add("ai"); $("#rem-title").textContent = "Promemoria di oggi · Assistente AI";
  $(".rem-i").textContent = "✦"; $("#rem-foot").textContent = "Sto preparando il promemoria con "+m+"…"; $("#rem-again").hidden = true;
  const show = r => {
    if(!$("#rem")) return;
    if(r.text && AI.promemoria) $("#rem-text").textContent = r.text;
    $("#rem-foot").textContent = r.source==="claude" ? "Scritto da "+((AI_MODELS[r.model]||{}).nome||r.model)+" (Anthropic) con i tuoi ticket."+(r.cached?" Aggiornato oggi.":"")
      : r.source==="simulazione" ? "Assistente AI attivo · "+m+" · risposta di esempio: quella vera arriva con la chiave API in Configurazione → Assistente AI."
      : r.source==="regole" ? "L'assistente non ha risposto ("+(r.error||"errore")+"): promemoria scritto dalle regole." : "Scritto in automatico dai tuoi ticket.";
    $("#rem-again").hidden = r.source!=="claude";
    if(AI.priorita && r.order && r.order.length){
      const ol = $(".acts"); if(!ol) return;
      r.order.forEach(x=>{ const li = ol.querySelector(`[data-tid="${CSS.escape(x.ticket)}"]`); if(!li) return; ol.appendChild(li); const w = li.querySelector(".why"); w.hidden = false; w.textContent = "✦ "+x.perche; });
    }
  };
  $("#rem-again").onclick = ()=>fillAI(a, true);
  if(LIVE) getJ("/api/admin/ai/agenda?tech="+encodeURIComponent(a.me.ini||"")+(fresh?"&fresh=1":"")).then(show).catch(err=>show({source:"regole", error:err.message}));
  else setTimeout(()=>show(aiSimulate(a)), 900);
}

        <label class="check"><input type="checkbox" id="rc-ms" ${C.messaggio?"checked":""} ${edit?"":"disabled"}> Quando il tecnico o l'ufficio aggiungono un messaggio (senza mai mostrare le note interne)</label>
        <label class="check"><input type="checkbox" id="rc-ch" ${C.chiusura?"checked":""} ${edit?"":"disabled"}> Quando il ticket si chiude</label>
        <label class="check"><input type="checkbox" id="rc-se" ${C.settimanale?"checked":""} ${edit?"":"disabled"}> Riepilogo settimanale delle richieste aperte, ogni
          <select class="input inl" id="rc-g" ${edit?"":"disabled"}>${["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"].map((g,i)=>`<option value="${i}" ${+C.giorno===i?"selected":""}>${g}</option>`).join("")}</select> alle
          <select class="input inl" id="rc-o" ${edit?"":"disabled"}>${Array.from({length:24},(_,h)=>`<option value="${h}" ${+C.ora===h?"selected":""}>${String(h).padStart(2,"0")}:00</option>`).join("")}</select></label>
        <label class="check"><input type="checkbox" id="rc-cf" ${C.conferma?"checked":""} ${edit?"":"disabled"}> Chiedi la conferma di lettura</label>
        <div class="actions" data-perm="recap:m"><button class="btn primary" type="submit">Salva</button></div></form>
      <div class="panel"><h2>Come sappiamo che sono arrivate</h2>
        <ol class="rsteps">
          <li><b>Accettata dal server</b>: il server di posta ha preso la mail per quell'indirizzo. Se la rifiuta lo vedi subito, e si riprova da sola fino a 3 volte.</li>
          <li><b>Non consegnata</b>: se torna un avviso di mancata consegna nella casella di raccolta, il recap viene segnato qui con il motivo.</li>
          <li><b>Letta</b>: arriva se il programma di posta del cliente manda la conferma di lettura (non tutti lo fanno).</li>
          <li><b>Manca la mail</b>: la persona non ha un indirizzo; la vedi in cima a questa pagina.</li>
        </ol>
        <div class="actions" data-perm="recap:m"><button class="btn" type="button" id="rc-week">Invia ora il riepilogo settimanale</button></div>
        <div class="f-row" data-perm="recap:m" style="margin-top:8px"><input class="input" id="rc-to" type="email" placeholder="tua mail per una prova"><button class="btn" type="button" id="rc-test">Mail di prova</button></div>
      </div>
    </div>
    <div class="panel filters"><div class="f-row"><label class="f-q"><span class="sr">Cerca</span><input class="input" id="rc-q" type="search" placeholder="Ticket, persona, azienda o mail" value="${esc(F.q)}"></label></div>
      <div class="chips">${[["","Tutti"],["accettata","Accettate"],["letta","Lette"],["preparata","Preparate"],["problemi","Da sistemare"],["manca la mail","Manca la mail"]].map(([k,l])=>`<button class="chip" type="button" data-rst="${k}" aria-pressed="${F.stato===k}">${l}</button>`).join("")}</div></div>
    <div class="tbl"><table id="rc-tbl"><thead><tr><th>Quando</th><th>Tipo</th><th>Ticket</th><th>Destinatario</th><th>Esito</th><th>Dettaglio</th><th><span class="sr">Azioni</span></th></tr></thead><tbody id="rc-body"></tbody></table></div>`;
  const paint = () => {
    const q = F.q.toLowerCase();
    const list = RECAPS.filter(r=>(!F.stato || (F.stato==="problemi" ? ["rifiutata","errore","non consegnata"].includes(r.stato) : r.stato===F.stato)) && (!q || [r.ticket, r.nome, r.to, (cl(r.client)||{}).name].some(v=>String(v||"").toLowerCase().includes(q))));
    $("#rc-body").innerHTML = list.map(r=>`<tr><td class="mono" data-sort="${esc(r.at)}">${fmtDate(r.at)}</td><td>${esc(RKIND[r.kind]||r.kind)}</td><td class="mono">${esc(r.ticket||"—")}</td>
      <td><b>${esc(r.nome||"—")}</b><div class="dim">${esc((cl(r.client)||{}).name||"")}${r.to?" · "+esc(r.to):""}</div></td><td>${rstato(r.stato)}</td><td class="dim">${esc(r.dettaglio||"")}${r.tentativi>1?" · "+r.tentativi+" tentativi":""}</td>
      <td class="act">${["rifiutata","errore","non consegnata"].includes(r.stato)?`<button class="btn small" type="button" data-retry="${esc(r.id)}" data-perm="recap:m">Riprova</button>`:""}${r.stato==="manca la mail"&&r.contatto?`<button class="btn small" type="button" data-fixk="${esc(r.contatto)}" data-perm="clienti:m">Aggiungi la mail</button>`:""}</td></tr>`).join("") || `<tr><td colspan="7" class="dim">Nessun recap</td></tr>`;
    wire();
  };
  const wire = () => {
    document.querySelectorAll("[data-fixk]").forEach(b=>b.onclick=()=>{ const x = contactById(b.dataset.fixk); if(x) contactForm(x.k, x.az.id); });
    document.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{ const r = RECAPS.find(x=>x.id===b.dataset.retry);
      if(LIVE) return post("/api/admin/recap/"+r.id+"/riprova", {}).then(x=>{ if(x.recap) Object.assign(r, x.recap); toast("Esito: "+(RSTATO[r.stato]||[0,r.stato])[1]); paint(); }).catch(err=>toast("Non riuscito: "+err.message));
      r.tentativi = (r.tentativi||1)+1; r.stato = "preparata"; r.dettaglio = "Riprovato (prova): con il backend collegato riparte davvero."; paint(); nav(); toast("Recap ripreparato (prova)"); });
  };
  $("#rc-q").oninput = e => { F.q = e.target.value; paint(); };
  document.querySelectorAll("[data-rst]").forEach(b=>b.onclick=()=>{ F.stato = b.dataset.rst; draw(); });
  $("#rc-on").onclick = e => { const b = e.currentTarget; b.setAttribute("aria-checked", String(b.getAttribute("aria-checked")!=="true")); };
  $("#rc-form").onsubmit = e => { e.preventDefault();
    const body = {attivo:$("#rc-on").getAttribute("aria-checked")==="true", apertura:$("#rc-ap").checked, aggiornamento:$("#rc-ag").checked, intervento:$("#rc-in").checked, messaggio:$("#rc-ms").checked, chiusura:$("#rc-ch").checked, settimanale:$("#rc-se").checked, giorno:+$("#rc-g").value, ora:+$("#rc-o").value, conferma:$("#rc-cf").checked};
    if(LIVE) return post("/api/admin/recap/settings", body).then(r=>{ RECAP_CFG = r.recap; toast("Impostazioni salvate"); }).catch(err=>toast("Non salvate: "+err.message));
    RECAP_CFG = body; logLocal("Impostazioni dei recap", body.attivo?"attivi":"spenti", "recap"); toast("Impostazioni salvate (prova)"); };
  $("#rc-week").onclick = () => {
    if(LIVE) return post("/api/admin/recap/settimanale", {}).then(r=>{ toast("Riepilogo: "+r.inviati.length+" destinatari"); load().then(recapView); }).catch(err=>toast("Non riuscito: "+err.message));
    const groups = new Map(); S.tickets.filter(t=>t.state!=="Chiuso").forEach(t=>{ const k = ticketContact(t); const key = (k&&k.id)||t.client; if(!groups.has(key)) groups.set(key, t); });
    [...groups.values()].forEach(t=>{ const e = recapLocal(t, "settimanale"); e.subj = "Riepilogo settimanale delle sue richieste — "+((cl(t.client)||{}).name||""); });
    toast("Riepilogo settimanale preparato per "+groups.size+" persone (prova)"); draw(); nav(); };
  $("#rc-test").onclick = () => { const to = $("#rc-to").value.trim(); if(!isMailAddr(to)){ toast("Scrivi un indirizzo mail valido"); return; }
    if(LIVE) return post("/api/admin/recap/test", {to}).then(r=>{ RECAPS.unshift(r.recap); toast("Mail di prova: "+(RSTATO[r.recap.stato]||[0,r.recap.stato])[1]); draw(); }).catch(err=>toast("Non riuscito: "+err.message));
    RECAPS.unshift({id:"r"+Date.now().toString(36), kind:"prova", ticket:"", client:"", nome:to, to, subj:"Mail di prova dei recap", at:new Date().toISOString(), stato:"preparata", dettaglio:"Versione di prova: con il backend collegato parte davvero.", tentativi:1}); toast("Mail di prova preparata (prova)"); draw(); };
  paint();
  };
  draw();
}
/* ---------- Aree di lavoro: gruppi di clienti/zone assegnati a tecnici e agenti ---------- */
function areeView(){
  S.areaOld = !!S.areaOld;
  const people = id => [...TECHS.filter(t=>!t.eliminato && (t.aree||[]).includes(id)).map(t=>({n:t.ini+" · "+techName(t), k:"Tecnico", off:t.attivo===false})),
    ...USERS_LOCAL.concat([]).filter(u=>!LIVE && !u.eliminato && u.profilo==="agent" && (u.aree||[]).includes(id)).map(u=>({n:u.nome||u.user, k:"Agente", off:u.attivo===false}))];
  const list = AREE_LIST.filter(a=>S.areaOld || !a.eliminato);
  $("#main").innerHTML = `<div class="top"><div><h1>Aree di lavoro</h1><p class="sub">Settori o gruppi di clienti. Si associano a tecnici e agenti; nei Ticket si filtra per area.</p></div>
      <button class="btn primary" type="button" id="ar-add" data-perm="aree:m">+ Nuova area</button></div>
    <label class="check"><input type="checkbox" id="ar-old" ${S.areaOld?"checked":""}> Mostra anche le eliminate</label>
    <div class="tbl"><table><thead><tr><th>Area</th><th>Descrizione</th><th>Tecnici e agenti</th><th>Ticket aperti</th><th>Stato</th><th><span class="sr">Azioni</span></th></tr></thead><tbody>
      ${list.map(a=>{ const pp = people(a.id), open = S.tickets.filter(t=>t.state!=="Chiuso" && (techByIni(t.tech)||{aree:[]}).aree?.includes(a.id)).length;
        return `<tr><td>${areaTag(a.id)}</td><td class="dim">${esc(a.desc||"")}</td><td>${pp.map(x=>`<div><span style="color:${x.k==="Agente"?PCOLOR.agent:PCOLOR.op}" title="${x.k}">${picon(x.k==="Agente"?"agent":"op")}</span> ${esc(x.n)} <span class="dim">· ${x.k}${x.off?" (disattivato)":""}</span></div>`).join("")||'<span class="dim">nessuno</span>'}</td>
        <td class="mono">${open}</td><td>${a.eliminato?'<span class="pill p-mut">Eliminata</span>':a.attivo===false?'<span class="pill p-warn">Disattivata</span>':'<span class="pill p-ok">Attiva</span>'}</td>
        <td class="act">${a.eliminato?'<span class="lock">resta nello storico</span>':`<button class="btn small" type="button" data-edit="${a.id}" data-perm="aree:m">Modifica</button> <button class="btn small danger" type="button" data-ask="${a.id}" data-perm="aree:e">Elimina</button>`}</td></tr>`; }).join("") || `<tr><td colspan="6" class="dim">Nessuna area: creane una</td></tr>`}
    </tbody></table></div>
    <p class="note">Un'area eliminata sparisce da elenchi e moduli, ma resta nello storico su tecnici e agenti che l'avevano.</p>`;
  $("#ar-old").onchange = e => { S.areaOld = e.target.checked; areeView(); };
  $("#ar-add").onclick = ()=>areaForm(null);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>areaForm(AREE_LIST.find(a=>a.id===b.dataset.edit)));
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askDelete(b, "l'area "+(AREE_LIST.find(a=>a.id===b.dataset.ask)||{}).nome, ()=>{
    const id = b.dataset.ask;
    if(LIVE) return del("/api/admin/aree/"+encodeURIComponent(id)).then(()=>{ toast("Area eliminata"); load(); });
    const a = AREE_LIST.find(x=>x.id===id); a.eliminato = new Date().toISOString(); a.attivo = false; logLocal("Area di lavoro eliminata", a.nome, "aree"); areeView(); toast("Area eliminata (prova)");
  }, areeView));
}
function areaForm(a){
  const isNew = !a; a = a || {nome:"", desc:"", colore:"#2aa7ff", attivo:true};
  openEditor(`<h2>${isNew?"Nuova area di lavoro":"Modifica area"}</h2>
    <div class="formgrid">
      <label class="field wide"><span>Nome</span><input class="input" id="ar-nome" required maxlength="50" value="${esc(a.nome)}" placeholder="es. Centrali e teleriscaldamento"></label>
      <label class="field wide"><span>Descrizione</span><input class="input" id="ar-desc" maxlength="200" value="${esc(a.desc||"")}" placeholder="es. Ciclo acqua-vapore: silice, sodio, ossigeno"></label>
      <label class="field"><span>Colore</span><input class="input" id="ar-col" type="color" value="${esc(a.colore||"#2aa7ff")}"></label>
    </div>
    ${isNew?"":`<label class="check"><input type="checkbox" id="ar-att" ${a.attivo!==false?"checked":""}> Attiva</label>`}
    <p class="note">Tecnici e agenti si associano all'area dalla loro scheda (Tecnici, Utenti).</p>
    <div class="actions"><button class="btn primary" type="submit">${isNew?"Crea area":"Salva"}</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
      const body = {nome:$("#ar-nome").value.trim(), desc:$("#ar-desc").value.trim(), colore:$("#ar-col").value};
      if(!isNew) body.attivo = $("#ar-att").checked;
      if(!body.nome){ toast("Dai un nome all'area"); return; }
      if(LIVE) return (isNew ? post("/api/admin/aree", body) : put("/api/admin/aree/"+encodeURIComponent(a.id), body)).then(()=>{ closeEditor(); toast(isNew?"Area creata":"Area salvata"); load(); }).catch(err=>toast("Non riuscito: "+err.message));
      if(isNew){ if(AREE_LIST.some(x=>!x.eliminato && x.nome.toLowerCase()===body.nome.toLowerCase())){ toast("Esiste già un'area con questo nome"); return; } AREE_LIST.push({id:"a"+Date.now().toString(36), attivo:true, ...body}); }
      else Object.assign(a, body);
      logLocal(isNew?"Area di lavoro creata":"Area di lavoro modificata", body.nome, "aree"); closeEditor(); areeView(); toast((isNew?"Area creata":"Area salvata")+" (prova)");
    });
}

/* ---------- Profili e permessi ---------- */
function profili(){
  const edit = can("profili","m"), keys = Object.keys(PROFILES);
  const cell = (k,a) => { const v = PROFILES[k].perm[a]||""; const lock = k==="admin" || !edit;
    return `<span class="perm-cell">${[["v","Vede"],["m","Modifica"],["e","Elimina"]].map(([r,l])=>`<label><input type="checkbox" data-p="${k}" data-a="${a}" data-r="${r}" ${v.includes(r)?"checked":""} ${lock?"disabled":""}>${l}</label>`).join("")}</span>`; };
  const users = LIVE ? null : USERS_LOCAL;
  $("#main").innerHTML = `<div class="top"><div><h1>Profili e permessi</h1><p class="sub">Ogni utente ha un profilo; il profilo decide quali sezioni vede e cosa può creare, modificare o eliminare.</p></div>
      <button class="btn primary" type="button" id="pr-add" data-perm="profili:m">+ Nuovo profilo</button></div>
    <div class="profcards">${Object.entries(PROFILES).map(([k,p])=>`<div class="panel"><h2>${esc(p.nome)}${p.base===false?' <span class="pill p-new">personalizzato</span>':""}</h2><p class="dim" style="margin:0">${esc(p.desc)}</p>
      <span class="dim">${AREE.filter(([a])=>(p.perm[a]||"").includes("v")).length} sezioni su ${AREE.length}${users?" · "+users.filter(u=>!u.eliminato&&u.profilo===k).length+" utenti":""}</span>
      ${p.base===false?`<div class="actions"><button class="btn small" type="button" data-pren="${k}" data-perm="profili:m">Rinomina</button><button class="btn small danger" type="button" data-pdel="${k}" data-perm="profili:e">Elimina</button></div>`:'<span class="lock">profilo di base</span>'}</div>`).join("")}</div>
    <div class="tbl"><table class="matrix"><thead><tr><th>Sezione</th>${Object.values(PROFILES).map(p=>`<th>${esc(p.nome)}</th>`).join("")}</tr></thead><tbody>
      ${AREE.map(([a,l])=>`<tr><td class="strong">${l}</td>${keys.map(k=>`<td>${cell(k,a)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="actions"><button class="btn primary" type="button" id="pr-save" data-perm="profili:m">Salva permessi</button><span class="note">L'amministratore ha sempre tutti i permessi. «Modifica» o «Elimina» senza «Vede» non hanno effetto. «Ticket e messaggi» vale anche per la sezione Messaggi.</span></div>`;
  $("#pr-save").onclick = ()=>{
    const next = {};
    for(const k of keys.filter(k=>k!=="admin")){ next[k] = {}; for(const [a] of AREE){ next[k][a] = ["v","m","e"].filter(r=>document.querySelector(`[data-p="${k}"][data-a="${a}"][data-r="${r}"]`).checked).join(""); if(next[k][a] && !next[k][a].includes("v")) next[k][a] = "v"+next[k][a]; } }
    if(LIVE){ post("/api/admin/profiles", next).then(r=>{ PROFILES = r.profiles; toast("Permessi salvati"); render(); }).catch(err=>toast("Non salvati: "+err.message)); return; }
    for(const k of Object.keys(next)) PROFILES[k].perm = next[k];
    logLocal("Permessi dei profili aggiornati", "", "profili"); toast("Permessi salvati (prova): prova a cambiare vista in alto"); render();
  };
  $("#pr-add").onclick = ()=>openEditor(`<h2>Nuovo profilo</h2>
    <div class="formgrid"><label class="field wide"><span>Nome</span><input class="input" id="np-nome" required maxlength="40" placeholder="es. Magazzino"></label>
      <label class="field wide"><span>Descrizione</span><input class="input" id="np-desc" maxlength="160"></label>
      <label class="field wide"><span>Parti dai permessi di</span><select class="input" id="np-base">${Object.entries(PROFILES).filter(([k])=>k!=="admin").map(([k,p])=>`<option value="${k}">${esc(p.nome)}</option>`).join("")}</select></label></div>
    <div class="actions"><button class="btn primary" type="submit">Crea profilo</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
      const body = {nome:$("#np-nome").value.trim(), desc:$("#np-desc").value.trim(), base:$("#np-base").value};
      if(!body.nome){ toast("Dai un nome al profilo"); return; }
      if(Object.values(PROFILES).some(p=>p.nome.toLowerCase()===body.nome.toLowerCase())){ toast("Esiste già un profilo con questo nome"); return; }
      if(LIVE) return post("/api/admin/profiles/new", body).then(r=>{ PROFILES = r.profiles; closeEditor(); toast("Profilo creato"); profili(); }).catch(err=>toast("Non riuscito: "+err.message));
      const k = "p_"+Date.now().toString(36); PROFILES[k] = {nome:body.nome, desc:body.desc, base:false, perm:{...PROFILES[body.base].perm}};
      logLocal("Profilo creato", body.nome, "profili"); closeEditor(); profili(); toast("Profilo creato (prova)"); });
  document.querySelectorAll("[data-pren]").forEach(b=>b.onclick=()=>{ const k = b.dataset.pren, p = PROFILES[k];
    openEditor(`<h2>Rinomina profilo</h2><div class="formgrid"><label class="field wide"><span>Nome</span><input class="input" id="rp-nome" required maxlength="40" value="${esc(p.nome)}"></label><label class="field wide"><span>Descrizione</span><input class="input" id="rp-desc" maxlength="160" value="${esc(p.desc||"")}"></label></div>
      <div class="actions"><button class="btn primary" type="submit">Salva</button><button class="btn" type="button" data-close>Annulla</button></div>`, ()=>{
        const body = {nome:$("#rp-nome").value.trim(), desc:$("#rp-desc").value.trim()}; if(!body.nome){ toast("Dai un nome al profilo"); return; }
        if(LIVE) return put("/api/admin/profiles/"+encodeURIComponent(k), body).then(r=>{ PROFILES = r.profiles; closeEditor(); profili(); toast("Profilo salvato"); }).catch(err=>toast("Non riuscito: "+err.message));
        Object.assign(p, body); logLocal("Profilo modificato", body.nome, "profili"); closeEditor(); profili(); toast("Profilo salvato (prova)"); }); });
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>askDelete(b, "il profilo "+PROFILES[b.dataset.pdel].nome, ()=>{
    const k = b.dataset.pdel;
    if(LIVE) return del("/api/admin/profiles/"+encodeURIComponent(k)).then(r=>{ PROFILES = r.profiles; toast("Profilo eliminato"); profili(); });
    if(USERS_LOCAL.some(u=>!u.eliminato && u.profilo===k)){ toast("Il profilo è assegnato ad almeno un utente: cambia prima il loro profilo"); profili(); return; }
    delete PROFILES[k]; logLocal("Profilo eliminato", k, "profili"); profili(); toast("Profilo eliminato (prova)");
  }, profili));
}

/* ---------- Backup e ripristino ---------- */
function backup(){
  $("#main").innerHTML = `<div class="top"><div><h1>Backup e ripristino</h1><p class="sub">Una copia di impostazioni, utenti, tecnici e conversazioni dell'app, da conservare fuori dal server.</p></div></div>
    <div class="grid2">
      <div class="panel"><h2>Scarica un backup</h2><p class="dim" style="margin:0">File JSON con: impostazioni (senza il segreto di Office 365), utenti della console (solo impronte delle password), tecnici, conversazioni e registro mail.</p>
        <div class="actions"><button class="btn primary" type="button" id="bk-get">Scarica backup adesso</button></div>
        <p class="note">Consiglio: un backup a settimana e prima di ogni aggiornamento. Sul server conviene anche una copia automatica della cartella <span class="mono">backend/data</span>.</p></div>
      <div class="panel" data-perm="backup:m"><h2>Ripristina</h2><p class="dim" style="margin:0">Riporta i dati a quelli del file scelto. I dati attuali vengono sostituiti; il segreto di Office 365 resta quello salvato.</p>
        <label class="drop" for="bk-file">Scegli il file di backup (.json)<input type="file" id="bk-file" accept="application/json,.json" hidden></label>
        <div id="bk-ask"></div></div>
    </div>`;
  $("#bk-get").onclick = ()=>{
    const save = (data)=>{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download = "ticketfarm-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); };
    if(LIVE){ getJ("/api/admin/backup").then(d=>{ save(d); toast("Backup scaricato"); }).catch(err=>toast("Backup non riuscito: "+err.message)); return; }
    save({app:"Ticket Farm", version:1, created:new Date().toISOString(), prova:true, files:{users:USERS_LOCAL, clienti:CLIENTS, tecnici:TECHS, ticket:S.tickets, regole:S.rules, settings:SETTINGS}});
    logLocal("Backup scaricato", "", "backup"); toast("Backup scaricato (prova)");
  };
  $("#bk-file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t=>{ let d; try{ d = JSON.parse(t); }catch(err){ toast("Il file non è un backup valido"); return; }
      if(d.app!=="Ticket Farm"){ toast("Il file non è un backup di Ticket Farm"); return; }
      $("#bk-ask").innerHTML = `<p class="rolebar">Ripristinare il backup del ${esc(fmtDate(d.created))}? I dati attuali verranno sostituiti.</p>
        <div class="actions"><button class="btn danger" type="button" id="bk-yes">Sì, ripristina</button><button class="btn" type="button" id="bk-no">Annulla</button></div>`;
      $("#bk-no").onclick = ()=>{ $("#bk-ask").innerHTML = ""; e.target.value = ""; };
      $("#bk-yes").onclick = ()=>{
        if(LIVE){ post("/api/admin/restore", d).then(()=>{ toast("Backup ripristinato"); load(); }).catch(err=>toast("Ripristino non riuscito: "+err.message)); return; }
        if(d.files && d.files.users) USERS_LOCAL = d.files.users;
        if(d.files && d.files.ticket) S.tickets = d.files.ticket;
        logLocal("Backup ripristinato", "del "+fmtDate(d.created), "backup"); toast("Backup ripristinato (prova)"); backup();
      };
    });
  };
}

/* ---------- Registro attività ---------- */
function audit(){
  const draw = list => {
    const q = (S.aq||"").toLowerCase(), area = S.aa||"";
    const rows = list.filter(x=>(!area || x.area===area) && (!q || (x.user+" "+x.azione+" "+x.dettaglio).toLowerCase().includes(q)));
    const aree = [...new Set(list.map(x=>x.area).filter(Boolean))];
    $("#main").innerHTML = `<div class="top"><div><h1>Registro attività</h1><p class="sub">Chi ha fatto cosa e quando: accessi, modifiche, messaggi inoltrati dall'app, backup.</p></div></div>
      <div class="audit-f"><input class="input" id="au-q" type="search" placeholder="Cerca utente, azione, dettaglio" value="${esc(S.aq||"")}">
        <select class="input" id="au-a"><option value="">Tutte le aree</option>${aree.map(a=>`<option ${a===area?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      <div class="tbl"><table><thead><tr><th>Quando</th><th>Chi</th><th>Azione</th><th>Dettaglio</th><th>Area</th></tr></thead><tbody>
        ${rows.map(x=>`<tr><td class="mono">${fmtDate(x.at)}</td><td class="strong">${esc(x.user)}</td><td>${/non riuscito/i.test(x.azione)?'<span class="pill p-urg">'+esc(x.azione)+'</span>':esc(x.azione)}</td><td class="dim">${esc(x.dettaglio)}</td><td><span class="pill p-mut">${esc(x.area)}</span></td></tr>`).join("") || `<tr><td colspan="5" class="dim">Nessuna voce</td></tr>`}
      </tbody></table></div>
      <p class="note">${rows.length} voci${LIVE?"":" · versione di prova: voci di esempio più le azioni fatte in questa pagina"}.</p>`;
    const qi = $("#au-q"); qi.oninput = ()=>{ S.aq = qi.value; const pos = qi.selectionStart; draw(list); const n = $("#au-q"); n.focus(); n.setSelectionRange(pos,pos); };
    $("#au-a").onchange = e => { S.aa = e.target.value; draw(list); };
  };
  if(LIVE) getJ("/api/admin/audit").then(r=>draw(r.entries)).catch(err=>toast("Registro non disponibile: "+err.message)); else draw(AUDIT_LOCAL);
}

}

/* ---------- Collegamenti ---------- */
function collegamenti(){
  const sys = SISTEMA, edit = can("collegamenti","m");
  const C = (LIVE && CONN) ? CONN : [
    {n:"ITSM", how:"Database e API di itsm.efuture.it", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Halo", how:"API REST di Halo", what:"Ticket, clienti, contatti, identificativi delle mail inviate", sync:"1 min fa"},
    {n:"Office 365", how:"Microsoft Graph", what:"Posta della casella di raccolta e contatti aziendali", sync:"adesso"}
  ];
  const tk = C.filter(c=>c.n==="ITSM"||c.n==="Halo"), other = C.filter(c=>c.n!=="ITSM"&&c.n!=="Halo");
  const card = (c,i,alt) => `<div class="panel conn ${alt?(c.n===sys?"inuso":"spento"):""}"><div class="row"><h2>${esc(c.n)}</h2>${alt?(c.n===sys?'<span class="pill p-ok">In uso</span>':'<span class="pill p-mut">Non in uso</span>'):`<span class="dim">${c.ok===false?"non collegato":"<span class=\"dot\"></span>&nbsp; collegato"}</span>`}</div>
      <dl class="kv"><dt>Come</dt><dd>${esc(c.how)}</dd><dt>Cosa legge</dt><dd>${esc(c.what)}</dd><dt>Ultima lettura</dt><dd>${alt && c.n!==sys ? "—" : esc(c.sync||"")}</dd></dl>
      <div class="actions">${alt && c.n!==sys ? `<button class="btn" type="button" data-use="${esc(c.n)}" ${edit?"":"disabled"}>Usa ${esc(c.n)}</button>` : `<button class="btn" type="button" data-t="${esc(c.n)}">Prova collegamento</button>`}</div></div>`;
  $("#main").innerHTML = `<div class="top"><div><h1>Collegamenti</h1><p class="sub">Da dove legge il backend. I sistemi dei ticket sono alternativi: se ne usa uno solo alla volta. L'app dei tecnici non si collega a questi sistemi.</p></div></div>
    <h2 class="tgroup">Sistema dei ticket</h2>
    <div class="conns">${tk.map((c,i)=>card(c,i,true)).join("")}</div>
    <p class="note">Cambiando sistema, ticket e clienti vengono letti da quello nuovo. Utenti, tecnici, aree e conversazioni restano.</p>
    <h2 class="tgroup">Posta e contatti</h2>
    <div class="conns">${other.map((c,i)=>card(c,i,false)).join("")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(LIVE){ load().then(()=>toast("Dati riletti")); } else toast(b.dataset.t+": collegamento riuscito (prova)"); });
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{ const v = b.dataset.use; if(!confirmInline(b)) return;
    if(LIVE) return post("/api/admin/sistema", {sistema:v}).then(r=>{ SISTEMA = r.sistema; toast("Sistema dei ticket in uso: "+v); load().then(collegamenti); }).catch(err=>toast("Non riuscito: "+err.message));
    SISTEMA = v; try{ localStorage.setItem("tf-admin-sistema", v); }catch(e){} logLocal("Sistema dei ticket in uso", v, "collegamenti"); toast("Sistema dei ticket in uso: "+v+" (prova)"); collegamenti(); });
}

  const nome = $("#pf-nome").value.trim(), mail = $("#pf-mail").value.trim(), nuova = $("#pf-new").value, nuova2 = $("#pf-new2").value, attuale = $("#pf-cur").value;
  const home = $("#pf-home").value, vista = REAL_ROLE==="admin" ? $("#pf-vista").value : REAL_ROLE;
  if(!BACKEND){ ME = Object.assign(offProfile(), {nome, mail, home, vista}); try{ localStorage.setItem("tf-admin-profile", JSON.stringify({nome, mail, home, vista})); }catch(e){} paintMe(); $("#profile").hidden = true; toast("Profilo salvato: al prossimo accesso apri "+homeLabel(home)); return; }
  if(nuova && nuova !== nuova2){ toast("Le due nuove password non sono uguali"); return; }
  const changed = nome !== (ME.nome||"") || mail !== (ME.mail||"") || !!nuova;
  if(changed && !attuale){ toast("Per cambiare nome, mail o password scrivi la password attuale"); $("#pf-cur").focus(); return; }
  const body = {home, vista}; if(changed) Object.assign(body, {nome, mail, attuale, nuova});
  post("/api/admin/profile", body).then(r=>{ ME = r.me; paintMe(); $("#profile").hidden = true; toast(nuova ? "Profilo e password salvati" : "Profilo salvato: al prossimo accesso apri "+homeLabel(home)); })
    .catch(err=>toast("Non salvato: "+err.message));
};
/* il link di reset può arrivare anche con la pagina già aperta */
window.addEventListener("hashchange", ()=>{ const m = /^#reset=([\w-]+)/.exec(location.hash); if(m && BACKEND) askReset(m[1]); });
function boot(){
  const rm = /^#reset=([\w-]+)/.exec(location.hash);
  fetch("/api/admin/info").then(r=>r.ok ? r.json() : Promise.reject()).then(info=>{
    BACKEND = true; HINT = info.demo;
    $("#lg-pk").hidden = !(window.PublicKeyCredential && window.SimpleWebAuthnBrowser);
    if(rm){ askReset(rm[1]); return; }
    if(TOKEN) load(); else showLogin(HINT);
  }).catch(()=>{
    BACKEND = false;
    let inside = false; try{ inside = localStorage.getItem("tf-admin-in")==="1"; }catch(e){}
    if(inside) startOffline(); else showLogin(OFF_USER);
  });
}
/* tema chiaro / scuro, come l'app (stessa preferenza salvata) */
function curTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function paintTheme(){ const d = curTheme()==="dark", b = $("#theme"); b.setAttribute("aria-checked", String(d)); b.title = d ? "Tema scuro (tocca per il chiaro)" : "Tema chiaro (tocca per lo scuro)"; }
try{ const t = localStorage.getItem("tf-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#theme").onclick = ()=>{ const t = curTheme()==="dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try{ localStorage.setItem("tf-theme", t); }catch(e){} paintTheme(); };
paintTheme();
boot();
})();
</script>
