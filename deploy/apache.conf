# Esempio Apache: /etc/apache2/sites-available/ticketfarm.conf
# Moduli: sudo a2enmod proxy proxy_http ssl headers  ·  poi: a2ensite ticketfarm, systemctl reload apache2
# Il certificato si ottiene con certbot:  sudo certbot --apache -d ticketfarm.efuture.it
<VirtualHost *:443>
    ServerName ticketfarm.efuture.it
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ticketfarm.efuture.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ticketfarm.efuture.it/privkey.pem

    LimitRequestBody 26214400
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
