# Esempio nginx: /etc/nginx/sites-available/ticketfarm  (poi: ln -s in sites-enabled, nginx -t, systemctl reload nginx)
# Il certificato si ottiene con certbot:  sudo certbot --nginx -d ticketfarm.efuture.it
server {
    listen 80;
    server_name ticketfarm.efuture.it;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ticketfarm.efuture.it;
    ssl_certificate     /etc/letsencrypt/live/ticketfarm.efuture.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketfarm.efuture.it/privkey.pem;

    client_max_body_size 25m;   # foto allegate dall'app

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
