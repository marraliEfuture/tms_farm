<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ticket Farm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ticket Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: intro column beside a phone-sized working prototype; on phones the prototype fills the screen */
/* Ticket Farm: nero, gradiente blu→turchese per le azioni, oro come accento (come brochure e sito) */
:root{
  --bg:#000000; --surface:#0c1016; --surface-2:#07090d; --ink:#ffffff; --muted:#9aa7b6; --line:#1a222d;
  --accent:#2aa7ff; --accent-soft:rgba(42,167,255,.13); --on-accent:#ffffff;
  --grad:linear-gradient(135deg,#1e6ff0 0%,#1aa0e8 50%,#19c9b8 100%);
  --gold:#d9ab45; --gold-grad:linear-gradient(135deg,#f6dc8a,#d9ab45 55%,#b88424);
  --amber:#d9ab45; --amber-soft:rgba(217,171,69,.13); --red:#ff7a66; --red-soft:rgba(255,122,102,.14); --blue:#19c2c9; --blue-soft:rgba(25,194,201,.13);
  --wa:#0b1a22; --wa-edge:#1e4656;
  --shadow:0 20px 60px rgba(30,136,240,.18), 0 0 0 1px rgba(42,167,255,.08);
  --f-display:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --ink:#0b1622; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10); --on-accent:#ffffff;
  --amber:#9a6f12; --amber-soft:rgba(217,171,69,.18); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --blue:#0b878d; --blue-soft:rgba(11,135,141,.10);
  --wa:#e9f5f7; --wa-edge:#9cccd5;
  --shadow:0 20px 50px rgba(21,60,110,.16), 0 0 0 1px rgba(21,112,214,.06);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --ink:#0b1622; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10); --on-accent:#ffffff;
  --amber:#9a6f12; --amber-soft:rgba(217,171,69,.18); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --blue:#0b878d; --blue-soft:rgba(11,135,141,.10);
  --wa:#e9f5f7; --wa-edge:#9cccd5;
  --shadow:0 20px 50px rgba(21,60,110,.16), 0 0 0 1px rgba(21,112,214,.06);
  color-scheme:light;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;gap:56px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.intro{flex:1 1 300px;max-width:420px;min-width:0;padding-top:24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.intro h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.intro h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.flow{display:flex;align-items:center;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.flow span{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px}
.flow span.me{background:var(--grad);border-color:transparent;color:#fff}
.flow i{font-style:normal;color:var(--muted)}
.try{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.try li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.try b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--amber-soft);color:var(--gold);font-size:13px}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{border:1px solid var(--wa-edge);background:var(--wa);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.reset{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* phone */
.phone{position:relative;flex:0 0 auto;width:390px;max-width:100%;height:780px;max-height:calc(100dvh - 56px);min-height:600px;
  background:var(--surface-2);border-radius:42px;border:10px solid var(--frame,#1f2833);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.appbar{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand b{font-weight:600}.brand em{font-style:normal;font-weight:600;background:linear-gradient(90deg,#2a8ff0,#2aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:12px}
.screen{flex:1;overflow-y:auto;padding:0 16px 96px;display:flex;flex-direction:column;gap:14px;min-height:0}
.screen[hidden]{display:none!important}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 8px 14px;z-index:10}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab.new span.plus{width:34px;height:26px;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center}
.count{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

h2.sec{font-family:var(--f-display);font-size:24px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.client{font-weight:700;font-size:16px;line-height:1.2}
.mono{font-family:var(--f-mono);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(30,136,240,.3)}
.btn.block{width:100%;padding:14px}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-Halo{background:var(--blue-soft);color:var(--blue)}
.s-ITSM{background:var(--accent-soft);color:var(--accent)}
.s-O365{background:var(--amber-soft);color:var(--amber)}
.p-urg{background:var(--red-soft);color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
textarea.input{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.wa-tag{display:flex;gap:8px;align-items:center;background:var(--wa);border:1px solid var(--wa-edge);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600}
.seg{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt small{color:var(--muted);font-size:12px;display:block;font-weight:500}
.opt .why{font-size:11.5px;color:var(--accent);font-weight:700}
.sel{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0}
.chk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;position:relative}
.item .nm{font-weight:700}
.item .pv{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.item.unread{border-color:var(--accent)}
.item.unread .nm::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.paste{min-height:150px;border:2px dashed var(--wa-edge);background:var(--wa);text-align:center;font-weight:600;padding-top:58px}
.paste::placeholder{color:var(--accent)}
.how{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.wam{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13.5px;background:var(--wa);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.wam .mono{padding-top:1px;color:var(--muted)}
.hint.ok{color:var(--accent);font-weight:600}
.hint.warn{color:var(--amber);font-weight:600}
.msg.fwd q+q{margin-top:4px}
.mailprev{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.mailprev summary{padding:10px 12px;font-weight:700;cursor:pointer}
.mp{padding:0 12px 12px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.mp b{display:inline-block;min-width:58px;color:var(--muted);font-weight:600}
.mp .hd{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:8px;padding:8px;margin-top:4px}
.mp .hd .mono{font-size:11px}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:14px}

/* chat */
.chat{position:absolute;inset:0;background:var(--surface-2);z-index:15;display:flex;flex-direction:column}
.chat[hidden]{display:none!important}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:22px;line-height:1;padding:4px 6px}
.chead .client{font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{padding:10px 12px;border-radius:14px;font-size:13.5px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;white-space:normal}
.msg.in{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.out{background:var(--accent-soft);align-self:flex-end}
.msg.fwd{background:var(--wa);border:1px solid var(--wa-edge);align-self:flex-end}
.msg.fwd q{display:block;border-left:3px solid var(--wa-edge);padding-left:8px;quotes:none}
.copybox{margin-top:8px;border:1px dashed var(--wa-edge);background:var(--wa);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.copybox p{margin:0;white-space:pre-wrap;user-select:text}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;height:44px;flex:1}
.typing{font-size:12px;color:var(--muted);align-self:flex-start;font-style:italic}

.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.35);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-height:85%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.kv{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:30;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (max-width:520px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .intro{padding:20px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
  .intro h1{font-size:34px}
  .wrap{gap:20px}
  .phone{width:100%;border:0;border-radius:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:none;box-shadow:none}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- app installata: tutto schermo ---------- */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{padding:0!important}
.wrap{display:block;max-width:none;margin:0}
.phone{width:100%;max-width:560px;margin:0 auto;height:100dvh;max-height:none;min-height:0;border:0!important;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
.status{display:none}
.tabs{padding-bottom:max(14px, env(safe-area-inset-bottom,0px))}
.composer{padding-bottom:max(16px, env(safe-area-inset-bottom,0px))}
.avatar{border:0;cursor:pointer}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600}
.login{padding:28px 22px;gap:16px;justify-content:center}
.login h2{font-size:24px;margin:0;color:var(--ink)}
@media (min-width:561px){ body{background:var(--surface-2)} .phone{border-left:1px solid var(--line)!important;border-right:1px solid var(--line)!important} }
</style>
</head>

  <div class="phone" id="phone">

    </header>

    <main class="screen" id="s-messaggi"></main>

    <section class="chat login" id="login" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="sheet-root"></div>
  </div>
</div>

function waName(text){ const m = /^\[[^\]]+\]\s*([^:\n]+):/m.exec(text); return m ? m[1].trim() : ""; }
function suggestions(f){
  const out = [], seen = new Set();
  const add = (c, why) => { if(!seen.has(c.id)){ seen.add(c.id); out.push({c, why}); } };
  const n = digits(f.number);
  if(n.length >= 7) CLIENTS.forEach(c => c.contacts.forEach(k => { if(digits(k.tel) === n) add(c, "Numero di "+k.n); }));
  const who = waName(f.text).toLowerCase();
  if(who) CLIENTS.forEach(c => c.contacts.forEach(k => { if(k.n.toLowerCase() === who || who.includes(k.n.toLowerCase())) add(c, k.n+" è un contatto in "+SRC[k.src]); }));
  const em = /[\w.+-]+@([\w-]+(?:\.[\w-]+)+)/.exec(f.mailFrom||"");
  if(em) CLIENTS.forEach(c => { if(DOM[c.id] === em[1].toLowerCase()) add(c, "La mail arriva da @"+em[1]); });
  const low = f.text.toLowerCase();
  CLIENTS.forEach(c => { const key = c.name.split(" ").slice(0,2).join(" ").toLowerCase(); if(low.includes(key)) add(c, "Nel testo c'è «"+c.name.split(" ").slice(0,2).join(" ")+"»"); });
  return out;
}

/* Legge il testo copiato da WhatsApp: "[08:12, 9/11/2026] Marco Rossi: testo" (anche "9/11/26, 08:12 - Marco Rossi: testo") */
function parseWA(text){
  const A = /^\[(\d{1,2}[:.]\d{2})(?::\d{2})?,\s*(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})\]\s*([^:\n]+):\s?(.*)$/;
  const B = /^(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+(\d{1,2}[:.]\d{2})\s+-\s+([^:\n]+):\s?(.*)$/;
  const out = [];
  /* iPhone: "[09/11/26, 08:12:33] Marco Rossi: testo" (prima la data, ora con i secondi) */
  const C = /^\[(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),\s*(\d{1,2}[:.]\d{2})(?::\d{2})?\]\s*([^:\n]+):\s?(.*)$/;
  String(text).split(/\r?\n/).forEach(line=>{
    line = line.replace(/^[‎‏﻿]+/, "");
    let m = A.exec(line), r = null;
    if(m) r = {time:m[1].replace(".",":"), date:m[2], from:m[3].trim(), text:m[4]};
    else if((m = C.exec(line))) r = {time:m[2].replace(".",":"), date:m[1], from:m[3].trim(), text:m[4]};
    else if((m = B.exec(line))) r = {time:m[2].replace(".",":"), date:m[1], from:m[3].trim(), text:m[4]};
    if(r) out.push(r);
    else if(out.length) out[out.length-1].text += "\n"+line;
    else if(line.trim()) out.push({time:"", date:"", from:"", text:line});
  });
  return out.map(x=>({...x, text:x.text.trim()})).filter(x=>x.text);
}
function today(){ const d=new Date(); return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(); }
/* Mail copiata o inoltrata: legge Da / Inviato / Oggetto (anche From / Sent / Date / Subject) */
function parseMail(text){
  const get = re => { const m = re.exec(text); return m ? m[1].trim() : ""; };
  const from = get(/^(?:Da|From)\s*:\s*(.+)$/mi);
  if(!from || from.indexOf("@") < 0) return null;
  const date = get(/^(?:Inviato|Data|Sent|Date)\s*:\s*(.+)$/mi), subj = get(/^(?:Oggetto|Subject)\s*:\s*(.+)$/mi);
  const parts = text.split(/\r?\n\s*\r?\n/); const body = parts.slice(1).join("\n\n").trim() || text;
  return {from, name:from.replace(/<.*>/,"").replace(/"/g,"").trim(), date, subj, body};
}
function ingest(text, via){
  const f = S.f; f.text = text; f.via = via;
  const ml = parseMail(text);
  f.kind = ml ? "mail" : "wa"; f.mailFrom = ml ? ml.from : ""; f.subj = ml ? ml.subj : "";
  f.msgs = ml ? [{time:"", date:"", from:ml.name, text:ml.body}] : parseWA(text);
  const first = f.msgs.find(m=>m.time);
  if(ml && ml.date){ f.time = ml.date; f.timeAuto = true; }
  else if(first){ f.time = first.date+" "+first.time; f.timeAuto = true; } else { f.time = today()+" "+nowStr(); f.timeAuto = false; }
  const s = suggestions(f);
  if(s.length === 1){ f.client = s[0].c.id; f.reason = s[0].why; const c = cl(f.client); f.dest = c.open.length ? c.open[0].id : "new"; }
  else { f.client = null; f.reason = ""; }
  renderInoltra();
}

  box.innerHTML = (q?"":tix()+`<span class="hint">Clienti recenti</span>`) + (list.length ? list.map(c=>`<button class="opt" type="button" data-c="${c.id}"><span>${esc(c.name)}<small>${esc(c.city)} · ${c.contacts.map(k=>esc(k.n)).join(", ")}</small></span>${badge(c.sys)}</button>`).join("") : `<div class="empty">Nessun cliente con «${esc(q)}»</div>`);
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>choose(b.dataset.c));
  box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ const th=S.threads.find(t=>t.ticket===b.dataset.t); choose(th.client); S.f.dest=th.ticket; drawDest(); });
}
/* Come le mail di oggi verso support@: la 1ª apre il ticket, dalle successive ITSM lo riconosce da oggetto "Re: Tck #…" e da In-Reply-To/References */
function msgId(ticket, sys){
  let h = 0, out = ""; const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  for(let i=0;i<43;i++){ h = (h*31 + ticket.charCodeAt(i % ticket.length) + i*7) % 2147483647; out += A[h % 62]; }
  return "<"+out+"@"+(sys==="Halo"?"halo":"itsm")+".efuture.it>";
}
function mailPreview(){
  const f = S.f, c = f.client ? cl(f.client) : null, rows = [], hidden = [];
  const old = c && f.dest !== "new";
  if(old){
    const o = c.open.find(x=>x.id===f.dest);
    rows.push(["Oggetto", "Re: "+f.dest+" - "+(o?o.t:"")]);
    hidden.push(["In-Reply-To", msgId(f.dest, c.sys)], ["References", msgId(f.dest, c.sys)]);
  } else {
    rows.push(["Oggetto", (f.kind==="mail"&&f.subj?f.subj:(f.kind==="mail"?"Mail del cliente":"Messaggio WhatsApp"))+(c?" - "+c.name:" - cliente da identificare")]);
    hidden.push(["X-TicketFarm-Cliente", c ? c.name : "da identificare"]);
  }
  hidden.push(["X-TicketFarm-Ora-Messaggio", f.time]);
  hidden.push(["X-TicketFarm-Origine", f.kind==="mail" ? "mail del cliente ("+f.mailFrom+")" : "WhatsApp del tecnico"]);
  return `<details class="mailprev" open><summary>La mail che parte</summary>
    <div class="mp"><div><b>Da</b> ${ME}</div><div><b>A</b> ${SUPPORT}</div>${rows.map(([k,v])=>`<div><b>${k}</b> ${esc(v)}</div>`).join("")}
    <div class="hd">${hidden.map(([k,v])=>`<span class="mono">${k}: ${esc(v)}</span>`).join("")}</div>
    <span class="hint">${old
      ? "Come una risposta del cliente: il ticket viene riconosciuto dall'oggetto e da In-Reply-To, che punta all'ultima mail del ticket letta dal backend."
      : "Prima mail, senza riferimenti: viene aperto un ticket nuovo. Il mittente è il tecnico, quindi il cliente va indicato in X-TicketFarm-Cliente."}</span></div></details>`;
}
function drawDest(){
  const f = S.f, box = $("#dest"); if(!box) return;
  if(!f.client){ box.innerHTML = f.unknown ? mailPreview() : ""; return; }
  const c = cl(f.client);
  const known = c.contacts.some(k => digits(k.tel) && digits(k.tel) === digits(f.number));
  const opts = c.open.map(o=>`<button class="opt" type="button" data-d="${o.id}" aria-pressed="${f.dest===o.id}"><span>Aggiungi a ${o.id}<small>${esc(o.t)}</small></span>${o.urg?'<span class="pill p-urg">Urgente</span>':""}</button>`).join("")
    + `<button class="opt" type="button" data-d="new" aria-pressed="${f.dest==="new"}"><span>Nuova richiesta<small>Ticket Farm apre il ticket in ${SRC[c.sys]}</small></span></button>`;
  box.innerHTML = `<div class="field"><span>Dove va</span><div class="seg">${opts}</div></div>
    ${digits(f.number).length>=7 && !known ? `<label class="chk" style="margin-top:10px"><input type="checkbox" id="f-rem" ${f.remember?"checked":""}> Salva ${esc(f.number)} sul cliente in ${SRC[c.sys]}</label>`:""}`;
  box.insertAdjacentHTML("beforeend", mailPreview());
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ f.dest=b.dataset.d; drawDest(); });
  const r = $("#f-rem"); if(r) r.onchange = e => f.remember = e.target.checked;
}
function send(){
  const f = S.f;
  if(!f.msgs.length){ toast("Incolla il messaggio del cliente o allega una foto"); return; }
  if(!f.client && !f.unknown){ toast("Indica il cliente: scegline uno o tocca «Non lo trovo»"); return; }
  const c = f.client ? cl(f.client) : null;
  const from = (f.msgs.find(m=>m.from)||{}).from || "";
  const body = f.msgs.map(m=>m.text).join("\n");
  const fwd = {k:"fwd", kind:f.kind, from, t:f.time, text:body, lines:f.msgs.some(m=>m.time)?f.msgs:null, photos:f.photos};
  const note = f.note.trim();
  const saveNum = c && digits(f.number).length>=7 && f.remember && !c.contacts.some(k=>digits(k.tel)===digits(f.number));
  if(API) return sendLive(f, c, from, body, fwd, note, saveNum);
  if(saveNum){ c.contacts[0].tel = f.number; }
  let th, answer;
  if(c && f.dest !== "new"){
    th = S.threads.find(t=>t.ticket===f.dest);
    if(!th){ th = {ticket:f.dest, client:c.id, unread:false, msgs:[]}; S.threads.unshift(th); }
    th.msgs.push(fwd);
    answer = {k:"tf", t:"", text:"Messaggio aggiunto a "+f.dest+" in "+SRC[c.sys]+" e segnalato all'ufficio."+(saveNum?" Numero salvato sul contatto.":"")};
  } else if(c){
    ++S.seq; const id = c.sys==="Halo" ? "HALO-"+S.seq : "Tck #7142"+String(S.seq).slice(-2);
    th = {ticket:id, client:c.id, unread:false, msgs:[fwd]}; S.threads.unshift(th);
    c.open.unshift({id, t:body.slice(0,46)+(body.length>46?"…":"")});
    answer = {k:"tf", t:"", text:"Ticket "+id+" aperto in "+SRC[c.sys]+" per "+c.name+"."+(saveNum?" Numero salvato sul contatto.":""),
      forClient:"Buongiorno, abbiamo registrato la sua richiesta con il numero "+id+". La ricontattiamo al più presto. Grazie."};
  } else {
    const id = "TF-"+(++S.seq);
    th = {ticket:id, client:null, unread:false, msgs:[fwd]}; S.threads.unshift(th);
    answer = {k:"tf", t:"", text:"Ricevuto come "+id+". Non ho trovato il cliente: l'ufficio lo identifica e ti scrive qui."};
  }
  if(note) th.msgs.push({k:"me", t:nowStr(), text:note});
  answer.text += " Ora della richiesta: "+f.time+".";
  S.f = blankForm();
  show("messaggi");
  openChat(S.threads.indexOf(th));
  answer.t = nowStr();
  reply(th, answer);
  toast("Prova: la mail a "+SUPPORT+" non è partita davvero");
}

/* ---------- CLIENTI ---------- */
function renderClienti(){
  const el = $("#s-clienti"), q = S.csearch.toLowerCase();
  const list = CLIENTS.filter(c => !q || (c.name+" "+c.city+" "+c.contacts.map(k=>k.n+" "+k.tel).join(" ")).toLowerCase().includes(q));
  el.innerHTML = `<div><h2 class="sec">Clienti</h2><p class="sub">Letti da Ticket Farm: anagrafiche da ITSM e Halo, contatti da Office 365</p></div>
    <input class="input" id="c-q" type="search" placeholder="Cerca cliente, persona o numero" value="${esc(S.csearch)}">
    <div class="list">${list.length ? list.map(c=>`<button class="item" data-c="${c.id}">
      <div class="row"><span class="nm">${esc(c.name)}</span>${badge(c.sys)}</div>
      <span class="pv">${esc(c.city)} · ${c.open.length} ticket aperti</span></button>`).join("") : `<div class="empty">Nessun cliente trovato</div>`}</div>`;
  const qi = $("#c-q"); qi.oninput = ()=>{ S.csearch = qi.value; const p = qi.selectionStart; renderClienti(); const n=$("#c-q"); n.focus(); n.setSelectionRange(p,p); };
  el.querySelectorAll(".item").forEach(b=>b.onclick=()=>clientSheet(b.dataset.c));
}
function clientSheet(id){
  const c = cl(id), root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-bg" id="sb"><div class="sheet" role="dialog" aria-label="${esc(c.name)}">
    <div class="grab"></div>
    <div class="row"><div class="client">${esc(c.name)}</div>${badge(c.sys)}</div>
    <span class="sub">${esc(c.city)} · ticket in ${SRC[c.sys]}</span>
    <div class="field"><span>Contatti</span><div class="kv">${c.contacts.map(k=>`<div class="row"><span>${esc(k.n)}<br><span class="mono">${esc(k.tel||"numero non presente")}</span></span>${badge(k.src)}</div>`).join("")}</div></div>
    <div class="field"><span>Ticket aperti</span><div class="kv">${c.open.length ? c.open.map(o=>`<div><span class="mono">${o.id}</span> · ${esc(o.t)}</div>`).join("") : `<span class="sub">Nessuno</span>`}</div></div>
    <button class="btn primary block" id="cs-fwd" type="button">Inoltra un messaggio di questo cliente</button>
    <button class="btn block" id="cs-x" type="button">Chiudi</button>
  </div></div>`;
  const close = ()=>{ root.innerHTML = ""; };
  $("#sb").onclick = e => { if(e.target.id==="sb") close(); };
  $("#cs-x").onclick = close;
  $("#cs-fwd").onclick = ()=>{ close(); S.f = blankForm(); S.f.client=id; S.f.dest = c.open.length ? c.open[0].id : "new"; show("inoltra"); };
}

/* ---------- navigazione ---------- */
function show(tab){
  S.tab = tab; $("#chat").hidden = true; S.openThread = null; $("#sheet-root").innerHTML = "";
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  ["messaggi","inoltra","clienti"].forEach(t=>$("#s-"+t).hidden = t!==tab);
  if(tab==="messaggi") renderMessaggi();
  if(tab==="inoltra") renderInoltra();
  if(tab==="clienti") renderClienti();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.tab));

/* ---------- collegamento al backend ---------- */
function api(path, body){
  return fetch(API + path, {method: body ? "POST" : "GET", headers: {"Content-Type":"application/json", "Authorization":"Bearer "+TOKEN}, body: body ? JSON.stringify(body) : undefined})
    .then(async r => { const j = await r.json().catch(()=>({}));
      if(r.status === 401 && path !== "/api/app/login"){ logout(); throw new Error("accesso scaduto"); }
      if(!r.ok) throw new Error(j.error || ("errore "+r.status)); return j; });
}
function applyData(d){
  if(!d) return;
  CLIENTS = d.clients; S.threads = d.threads; SUPPORT = d.support; ME = d.me.mail;
  $("#who-zona").textContent = "Zona "+d.me.zona; $("#who-ini").textContent = d.me.ini;
  updateCount();
}
function reopen(ticket){ const i = S.threads.findIndex(t=>t.ticket===ticket); if(i>=0) openChat(i); }
function refresh(){
  api("/api/app/data").then(d=>{
    const open = S.openThread!=null && S.threads[S.openThread] ? S.threads[S.openThread].ticket : null;
    applyData(d);
    if(open){ S.openThread = S.threads.findIndex(t=>t.ticket===open); if(S.openThread>=0) drawMsgs(); }
    else if(S.tab==="messaggi") renderMessaggi();
  }).catch(()=>{});
}
function sendLive(f, c, from, body, fwd, note, saveNum){
  const b = $("#f-send"); b.disabled = true; b.textContent = "Invio…";
  api("/api/app/send", {kind:f.kind||"wa", from:(f.msgs.find(m=>m.from)||{}).from||"", body, lines:fwd.lines, time:f.time, client:c?c.id:null, dest:f.dest, number:f.number, remember:!!saveNum,
      note, mailFrom:f.mailFrom||"", subj:f.subj||"", files:f.files})
    .then(r=>{ S.f = blankForm(); applyData(r.data); show("messaggi"); reopen(r.ticket); toast("Mail inviata a "+SUPPORT); })
    .catch(e=>{ b.disabled = false; b.textContent = "Invia a Ticket Farm"; toast("Invio non riuscito: "+e.message+". Il messaggio resta qui, riprova."); });
}
/* foto ridotte a 1600 px in JPEG, così la mail resta leggera */
function shrink(file){
  return new Promise((ok)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, 1600/Math.max(img.width, img.height)); const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok({name:(file.name||"foto").replace(/\.\w+$/,"")+".jpg", type:"image/jpeg", data:cv.toDataURL("image/jpeg", .82).split(",")[1]}); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); ok(null); };
    img.src = url;
  });
}
function addPhotos(list, done){
  const f = S.f;
  Promise.all([...list].map(shrink)).then(arr=>{ f.files = (f.files||[]).concat(arr.filter(Boolean)); f.photos = f.files.length; done(); });
}
function renderLogin(){
  const el = $("#login"); el.hidden = false;
  el.innerHTML = `<h2>Accedi a Ticket Farm</h2><p class="sub">Usa la tua mail aziendale e il codice che ti ha dato l'ufficio.</p>
    <label class="field"><span>Mail</span><input class="input" id="l-mail" type="email" autocomplete="username" placeholder="nome@efuture.it"></label>
    <label class="field"><span>Codice</span><input class="input" id="l-code" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <button class="btn primary block" id="l-go" type="button">Accedi</button>`;
  $("#l-go").onclick = ()=>{
    const mail = $("#l-mail").value.trim(), code = $("#l-code").value.trim();
    if(!mail || !code){ toast("Scrivi mail e codice"); return; }
    api("/api/app/login", {mail, code}).then(r=>{ TOKEN = r.token; try{ localStorage.setItem("tf-token", TOKEN); }catch(e){} el.hidden = true; start(); })
      .catch(e=>toast("Accesso non riuscito: "+e.message));
  };
}
function logout(){ TOKEN = ""; try{ localStorage.removeItem("tf-token"); }catch(e){} renderLogin(); }
function profile(){
  const root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-bg" id="sb"><div class="sheet" role="dialog" aria-label="Profilo"><div class="grab"></div>
    <div class="client">${esc(ME)}</div><span class="sub">Le mail partono da questo indirizzo verso ${esc(SUPPORT)}.</span>
    ${API ? `<button class="btn block" id="p-out" type="button">Esci</button>` : `<span class="sub">Modalità prova: non serve accedere.</span>`}
    <button class="btn block" id="p-x" type="button">Chiudi</button></div></div>`;
  $("#sb").onclick = e => { if(e.target.id==="sb") root.innerHTML = ""; };
  $("#p-x").onclick = ()=>{ root.innerHTML = ""; };
  if(API) $("#p-out").onclick = ()=>{ root.innerHTML = ""; logout(); };
}
function handleShare(){
  const q = new URLSearchParams(location.search);
  const shared = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
  if(!shared) return;
  history.replaceState(null, "", location.pathname);
  S.f = blankForm(); show("inoltra"); ingest(shared, "share");
}
function start(){
  if(!API){ show("messaggi"); handleShare(); return; }
  if(!TOKEN){ renderLogin(); return; }
  api("/api/app/data").then(d=>{ applyData(d); show("messaggi"); handleShare(); setInterval(refresh, 60000); })
    .catch(e=>{ if(TOKEN){ show("messaggi"); toast("Backend non raggiungibile: "+e.message); } });
}
function curTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("tf-theme", t); }catch(e){} paintTheme(); }
function paintTheme(){ $("#theme").textContent = curTheme()==="dark" ? "☀ Chiaro" : "☾ Scuro"; }
try{ const t = localStorage.getItem("tf-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#theme").onclick = ()=>setTheme(curTheme()==="dark" ? "light" : "dark");
paintTheme();
$("#who-ini").onclick = profile;
if(API){ CLIENTS = []; S.threads = []; }
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
start();
})();
</script>
