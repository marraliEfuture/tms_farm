<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ticket Farm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ticket Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: intro column beside a phone-sized working prototype; on phones the prototype fills the screen */
/* Ticket Farm: nero, gradiente blu→turchese per le azioni, oro come accento (come brochure e sito) */
:root{
  --bg:#000000; --surface:#0c1016; --surface-2:#07090d; --ink:#ffffff; --muted:#9aa7b6; --line:#1a222d;
  --accent:#2aa7ff; --accent-soft:rgba(42,167,255,.13); --on-accent:#ffffff;
  --grad:linear-gradient(135deg,#1e6ff0 0%,#1aa0e8 50%,#19c9b8 100%);
  --gold:#d9ab45; --gold-grad:linear-gradient(135deg,#f6dc8a,#d9ab45 55%,#b88424);
  --amber:#d9ab45; --amber-soft:rgba(217,171,69,.13); --red:#ff7a66; --red-soft:rgba(255,122,102,.14); --blue:#19c2c9; --blue-soft:rgba(25,194,201,.13);
  --wa:#0b1a22; --wa-edge:#1e4656;
  --shadow:0 20px 60px rgba(30,136,240,.18), 0 0 0 1px rgba(42,167,255,.08);
  --f-display:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --ink:#0b1622; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10); --on-accent:#ffffff;
  --amber:#9a6f12; --amber-soft:rgba(217,171,69,.18); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --blue:#0b878d; --blue-soft:rgba(11,135,141,.10);
  --wa:#e9f5f7; --wa-edge:#9cccd5;
  --shadow:0 20px 50px rgba(21,60,110,.16), 0 0 0 1px rgba(21,112,214,.06);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f6; --ink:#0b1622; --muted:#5a6a7b; --line:#d6dfe9;
  --accent:#1570d6; --accent-soft:rgba(21,112,214,.10); --on-accent:#ffffff;
  --amber:#9a6f12; --amber-soft:rgba(217,171,69,.18); --red:#c63f2b; --red-soft:rgba(198,63,43,.10); --blue:#0b878d; --blue-soft:rgba(11,135,141,.10);
  --wa:#e9f5f7; --wa-edge:#9cccd5;
  --shadow:0 20px 50px rgba(21,60,110,.16), 0 0 0 1px rgba(21,112,214,.06);
  color-scheme:light;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;gap:56px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.intro{flex:1 1 300px;max-width:420px;min-width:0;padding-top:24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.intro h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.intro h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.flow{display:flex;align-items:center;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.flow span{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px}
.flow span.me{background:var(--grad);border-color:transparent;color:#fff}
.flow i{font-style:normal;color:var(--muted)}
.try{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.try li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.try b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--amber-soft);color:var(--gold);font-size:13px}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{border:1px solid var(--wa-edge);background:var(--wa);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.reset{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* phone */
.phone{position:relative;flex:0 0 auto;width:390px;max-width:100%;height:780px;max-height:calc(100dvh - 56px);min-height:600px;
  background:var(--surface-2);border-radius:42px;border:10px solid var(--frame,#1f2833);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.appbar{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 10px}
.brand{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-family:inherit;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand b{font-weight:600}.brand em{font-style:normal;font-weight:600;background:linear-gradient(90deg,#2a8ff0,#2aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
/* interruttore tema (soluzione A): sole e luna ai lati, pallino che scorre */
.sw-a{position:relative;width:60px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer;flex:0 0 auto}
.sw-a .ic{position:absolute;top:50%;transform:translateY(-50%);width:15px;height:15px}
.sw-a .ic.s{left:7px;color:#e9a90f}.sw-a .ic.m{right:7px;color:#8fb4ee}
.sw-a .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#1e6ff0,#1aa0e8 50%,#19c9b8);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:left .25s}
.sw-a[aria-checked="true"] .knob{left:32px}
.sw-a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sw-a .knob{transition:none}}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:12px}
.screen{flex:1;overflow-y:auto;padding:0 16px 96px;display:flex;flex-direction:column;gap:14px;min-height:0}
.screen[hidden]{display:none!important}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 8px 14px;z-index:10}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab.new span.plus{width:34px;height:26px;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center}
.count{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

h2.sec{font-family:var(--f-display);font-size:24px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.client{font-weight:700;font-size:16px;line-height:1.2}
.mono{font-family:var(--f-mono);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(30,136,240,.3)}
.btn.block{width:100%;padding:14px}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-Halo{background:var(--blue-soft);color:var(--blue)}
.s-ITSM{background:var(--accent-soft);color:var(--accent)}
.s-O365{background:var(--amber-soft);color:var(--amber)}
.p-urg{background:var(--red-soft);color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
textarea.input{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.wa-tag{display:flex;gap:8px;align-items:center;background:var(--wa);border:1px solid var(--wa-edge);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600}
.seg{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt small{color:var(--muted);font-size:12px;display:block;font-weight:500}
.opt .why{font-size:11.5px;color:var(--accent);font-weight:700}
.sel{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0}
.chk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;position:relative}
.item .nm{font-weight:700}
.item .pv{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.item.unread{border-color:var(--accent)}
.item.unread .nm::after{content:"da leggere";display:inline-block;margin-left:8px;vertical-align:middle;background:#1aa0e8;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.02em;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap}
.paste{min-height:150px;border:2px dashed var(--wa-edge);background:var(--wa);text-align:center;font-weight:600;padding-top:58px}
.paste::placeholder{color:var(--accent)}
.how{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.wam{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13.5px;background:var(--wa);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.wam .mono{padding-top:1px;color:var(--muted)}
.hint.ok{color:var(--accent);font-weight:600}
.hint.warn{color:var(--amber);font-weight:600}
.msg.fwd q+q{margin-top:4px}
.mailprev{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.mailprev summary{padding:10px 12px;font-weight:700;cursor:pointer}
.mp{padding:0 12px 12px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.mp b{display:inline-block;min-width:58px;color:var(--muted);font-weight:600}
.mp .hd{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:8px;padding:8px;margin-top:4px}
.mp .hd .mono{font-size:11px}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:14px}

/* chat */
.chat{position:absolute;inset:0;background:var(--surface-2);z-index:15;display:flex;flex-direction:column}
.chat[hidden]{display:none!important}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:22px;line-height:1;padding:4px 6px}
.chead .client{font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{padding:10px 12px;border-radius:14px;font-size:13.5px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;white-space:normal}
.msg.in{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.out{background:var(--accent-soft);align-self:flex-end}
.msg.fwd{background:var(--wa);border:1px solid var(--wa-edge);align-self:flex-end}
.msg.fwd q{display:block;border-left:3px solid var(--wa-edge);padding-left:8px;quotes:none}
.copybox{margin-top:8px;border:1px dashed var(--wa-edge);background:var(--wa);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.copybox p{margin:0;white-space:pre-wrap;user-select:text}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;height:44px;flex:1}
.typing{font-size:12px;color:var(--muted);align-self:flex-start;font-style:italic}

.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.35);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-height:85%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.kv{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:30;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (max-width:520px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .intro{padding:20px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
  .intro h1{font-size:34px}
  .wrap{gap:20px}
  .phone{width:100%;border:0;border-radius:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:none;box-shadow:none}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- introduzione con il logo animato ---------- */
.splash{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity .5s ease}
@media (max-aspect-ratio:1/1){.splash video{width:175%!important;max-width:none}}
.splash.out{opacity:0;pointer-events:none}
.splash video{width:min(100%,960px);max-height:100%;object-fit:contain;background:#000}
.splash-skip{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:max(24px, env(safe-area-inset-bottom,0px));border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 16px;font:600 13px var(--f-body);cursor:pointer}
.splash-skip:focus-visible{outline:2px solid #2aa7ff;outline-offset:2px}
/* ---------- app installata: tutto schermo ---------- */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{padding:0!important}
.wrap{display:block;max-width:none;margin:0}
.phone{width:100%;max-width:560px;margin:0 auto;height:100dvh;max-height:none;min-height:0;border:0!important;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
.status{display:none}
.tabs{padding-bottom:max(14px, env(safe-area-inset-bottom,0px))}
.composer{padding-bottom:max(16px, env(safe-area-inset-bottom,0px))}
.avatar{border:0;cursor:pointer}
.install{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:13px;font-weight:600}
.install span{flex:1}
.lav{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;border-radius:9px;overflow:hidden;font-weight:700;color:#fff;background:hsl(var(--h) 55% 42%);letter-spacing:0}
.lav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.who-row{display:flex;align-items:center;gap:10px;min-width:0}
.opt{gap:10px}
.wa{display:inline-flex;align-items:center;gap:6px;color:#fff;background:#1fa855;border-radius:999px;padding:6px;text-decoration:none;font-size:12.5px;font-weight:600;flex:0 0 auto;line-height:1}
.wa span{padding-right:4px}
.wa:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cb-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb-act > *{width:100%;justify-content:center;padding:9px 10px;font-size:13px;border-radius:999px}
.item{cursor:pointer}
.login-brand{align-self:flex-start;margin-bottom:8px}
.mapbox{height:320px;flex:0 0 320px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);position:relative;z-index:0}
.pop-act{display:flex;gap:8px;margin-top:8px;align-items:center}
.pop-act a,.pop-act button{font:600 12.5px var(--f-body);border-radius:999px;padding:6px 10px;text-decoration:none;cursor:pointer}
.pop-act a{background:#1aa0e8;color:#fff!important}
.pop-act button{background:#fff;border:1px solid #1aa0e8;color:#1570d6}
.mapbox .empty{padding-top:130px}
.seg2{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.seg2 button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--grad);color:#fff}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid #1aa0e8;border-radius:14px;padding:12px}
.stop.urg{border-left-color:var(--red)}
.stop .sn{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center}
.stop.urg .sn{background:var(--red)}
.sbody{display:flex;flex-direction:column;gap:2px;min-width:0}
a.btn{text-decoration:none}
.mk{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#1aa0e8;color:#fff;font:700 13px var(--f-body);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mk.urg{background:#d64a35}.mk.me{width:34px;height:34px;background:#0b1622;font-size:11px}.mk.off{width:16px;height:16px;background:#8a99aa;border-width:2px}
.rcard{background:linear-gradient(180deg,rgba(124,92,255,.08),transparent 70%),var(--surface);border:1px solid var(--line);border-left:4px solid #7c5cff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rcard b{color:var(--ink)}.r-ic{color:#7c5cff;font-size:16px}
.r-head{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
.r-chev{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent)}
.rcard.closed .r-body{display:none}
.r-body{display:flex;flex-direction:column;gap:6px}
.acts2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.act2{background:var(--surface);border:1px solid var(--line);border-left:4px solid #1aa0e8;border-radius:14px;padding:12px}
.act2.urg{border-left-color:var(--red)}.act2.wait{border-left-color:var(--amber)}
.act2 .when{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;color:#1570d6;background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin-bottom:2px}
.act2.urg .when{color:var(--red);background:var(--red-soft)}.act2.wait .when{color:var(--amber);background:var(--amber-soft)}
.act2-x{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.r-text{margin:0;color:var(--ink);font-size:15px;line-height:1.55}
.r-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.r-nums div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.r-nums b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}.r-nums span{font-size:12px;color:var(--muted)}
.r-nums .hot{border-color:var(--red);background:var(--red-soft)}.r-nums .hot b{color:var(--red)}
.r-h{margin:4px 0 0;font-size:16px;color:var(--ink)}
.why{font-size:12.5px;color:#7c5cff;font-weight:600}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600}
.login{padding:28px 22px;gap:16px;justify-content:center}
.login h2{font-size:24px;margin:0;color:var(--ink)}

<div class="splash" id="splash" role="img" aria-label="Ticket Farm">
  <video id="splash-v" src="media/logo-ticketfarm.mp4" poster="media/poster.jpg" autoplay muted playsinline preload="auto"></video>
  <button class="splash-skip" id="splash-skip" type="button">Salta</button>
</div>
<script>
/* introduzione: parte all'apertura e quando si tocca "Ticket Farm"; dopo, "after" decide dove andare */
(function(){
  var el = document.getElementById("splash"), v = document.getElementById("splash-v"), done = true, after = null, timer = 0;
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function end(){
    if(done) return; done = true; clearTimeout(timer); el.classList.add("out");
    setTimeout(function(){ el.hidden = true; var f = after; after = null; if(f) f(); }, 500);
  }
  function play(cb){
    after = cb || null; done = false; el.hidden = false; el.classList.remove("out");
    try{ v.currentTime = 0; }catch(e){}
    if(still){ v.pause(); timer = setTimeout(end, 1500); return; }
    var p = v.play(); if(p && p.catch) p.catch(function(){ setTimeout(end, 1500); });
    timer = setTimeout(end, 9000);
  }
  document.getElementById("splash-skip").onclick = end;
  el.addEventListener("click", function(e){ if(e.target === el) end(); });
  v.addEventListener("ended", end);
  v.addEventListener("error", function(){ setTimeout(end, 1200); });
  window.tfSplash = play;
  play();
})();
</script>

/* WhatsApp: link wa.me dal numero del contatto. Numeri senza prefisso internazionale: si assume l'Italia (+39). */
function waNum(tel){
  const t = String(tel||"").trim(); if(!t) return "";
  let d = t.replace(/[^\d+]/g,"");
  if(d.startsWith("+")) d = d.slice(1); else if(d.startsWith("00")) d = d.slice(2); else d = "39"+d;
  d = d.replace(/\D/g,""); return d.length >= 8 ? d : "";
}
function waUrl(tel, text){ const n = waNum(tel); return n ? "https://wa.me/"+n+(text ? "?text="+encodeURIComponent(text) : "") : ""; }
const WA_ICON = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3Z"/></svg>`;

/* ---------- riconoscimento del cliente ---------- */
function waName(text){ const m = /^\[[^\]]+\]\s*([^:\n]+):/m.exec(text); return m ? m[1].trim() : ""; }
function suggestions(f){
  const out = [], seen = new Set();
  const add = (c, why) => { if(!seen.has(c.id)){ seen.add(c.id); out.push({c, why}); } };
  const n = digits(f.number);
  if(n.length >= 7) CLIENTS.forEach(c => c.contacts.forEach(k => { if(digits(k.tel) === n) add(c, "Numero di "+k.n); }));
  const who = waName(f.text).toLowerCase();
  if(who) CLIENTS.forEach(c => c.contacts.forEach(k => { if(k.n.toLowerCase() === who || who.includes(k.n.toLowerCase())) add(c, k.n+" è un contatto in "+SRC[k.src]); }));
  const em = /[\w.+-]+@([\w-]+(?:\.[\w-]+)+)/.exec(f.mailFrom||"");
  if(em) CLIENTS.forEach(c => { if(DOM[c.id] === em[1].toLowerCase()) add(c, "La mail arriva da @"+em[1]); });

}

/* Legge il testo copiato da WhatsApp: "[08:12, 9/11/2026] Marco Rossi: testo" (anche "9/11/26, 08:12 - Marco Rossi: testo") */
function parseWA(text){
  const A = /^\[(\d{1,2}[:.]\d{2})(?::\d{2})?,\s*(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})\]\s*([^:\n]+):\s?(.*)$/;
  const B = /^(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+(\d{1,2}[:.]\d{2})\s+-\s+([^:\n]+):\s?(.*)$/;
  const out = [];
  /* iPhone: "[09/11/26, 08:12:33] Marco Rossi: testo" (prima la data, ora con i secondi) */
  const C = /^\[(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),\s*(\d{1,2}[:.]\d{2})(?::\d{2})?\]\s*([^:\n]+):\s?(.*)$/;
  String(text).split(/\r?\n/).forEach(line=>{
    line = line.replace(/^[‎‏﻿]+/, "");
    let m = A.exec(line), r = null;
    if(m) r = {time:m[1].replace(".",":"), date:m[2], from:m[3].trim(), text:m[4]};
    else if((m = C.exec(line))) r = {time:m[2].replace(".",":"), date:m[1], from:m[3].trim(), text:m[4]};
    else if((m = B.exec(line))) r = {time:m[2].replace(".",":"), date:m[1], from:m[3].trim(), text:m[4]};
    if(r) out.push(r);
    else if(out.length) out[out.length-1].text += "\n"+line;
    else if(line.trim()) out.push({time:"", date:"", from:"", text:line});
  });
  return out.map(x=>({...x, text:x.text.trim()})).filter(x=>x.text);
}
function today(){ const d=new Date(); return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(); }
/* Mail copiata o inoltrata: legge Da / Inviato / Oggetto (anche From / Sent / Date / Subject) */
function parseMail(text){
  const get = re => { const m = re.exec(text); return m ? m[1].trim() : ""; };
  const from = get(/^(?:Da|From)\s*:\s*(.+)$/mi);
  if(!from || from.indexOf("@") < 0) return null;
  const date = get(/^(?:Inviato|Data|Sent|Date)\s*:\s*(.+)$/mi), subj = get(/^(?:Oggetto|Subject)\s*:\s*(.+)$/mi);
  const parts = text.split(/\r?\n\s*\r?\n/); const body = parts.slice(1).join("\n\n").trim() || text;
  return {from, name:from.replace(/<.*>/,"").replace(/"/g,"").trim(), date, subj, body};
}
function ingest(text, via){
  const f = S.f; f.text = text; f.via = via;
  const ml = parseMail(text);
  f.kind = ml ? "mail" : "wa"; f.mailFrom = ml ? ml.from : ""; f.subj = ml ? ml.subj : "";
  f.msgs = ml ? [{time:"", date:"", from:ml.name, text:ml.body}] : parseWA(text);
  const first = f.msgs.find(m=>m.time);
  if(ml && ml.date){ f.time = ml.date; f.timeAuto = true; }
  else if(first){ f.time = first.date+" "+first.time; f.timeAuto = true; } else { f.time = today()+" "+nowStr(); f.timeAuto = false; }
  const s = suggestions(f);
  if(s.length === 1){ f.client = s[0].c.id; f.reason = s[0].why; const c = cl(f.client); f.dest = c.open.length ? c.open[0].id : "new"; }
  else { f.client = null; f.reason = ""; }
  renderInoltra();
}

/* Come le mail di oggi verso support@: la 1ª apre il ticket, dalle successive ITSM lo riconosce da oggetto "Re: Tck #…" e da In-Reply-To/References */
function msgId(ticket, sys){
  let h = 0, out = ""; const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  for(let i=0;i<43;i++){ h = (h*31 + ticket.charCodeAt(i % ticket.length) + i*7) % 2147483647; out += A[h % 62]; }
  return "<"+out+"@"+(sys==="Halo"?"halo":"itsm")+".efuture.it>";
}
function mailPreview(){
  const f = S.f, c = f.client ? cl(f.client) : null, rows = [], hidden = [];
  const old = c && f.dest !== "new";
  if(old){
    const o = c.open.find(x=>x.id===f.dest);
    rows.push(["Oggetto", "Re: "+f.dest+" - "+(o?o.t:"")]);
    hidden.push(["In-Reply-To", msgId(f.dest, c.sys)], ["References", msgId(f.dest, c.sys)]);
  } else {
    rows.push(["Oggetto", (f.kind==="mail"&&f.subj?f.subj:(f.kind==="mail"?"Mail del cliente":"Messaggio WhatsApp"))+(c?" - "+c.name:" - cliente da identificare")]);
    hidden.push(["X-TicketFarm-Cliente", c ? c.name : "da identificare"]);
  }
  hidden.push(["X-TicketFarm-Ora-Messaggio", f.time]);
  hidden.push(["X-TicketFarm-Origine", f.kind==="mail" ? "mail del cliente ("+f.mailFrom+")" : "WhatsApp del tecnico"]);
  return `<details class="mailprev" open><summary>La mail che parte</summary>
    <div class="mp"><div><b>Da</b> ${ME}</div><div><b>A</b> ${SUPPORT}</div>${rows.map(([k,v])=>`<div><b>${k}</b> ${esc(v)}</div>`).join("")}
    <div class="hd">${hidden.map(([k,v])=>`<span class="mono">${k}: ${esc(v)}</span>`).join("")}</div>
    <span class="hint">${old
      ? "Come una risposta del cliente: il ticket viene riconosciuto dall'oggetto e da In-Reply-To, che punta all'ultima mail del ticket letta dal backend."
      : "Prima mail, senza riferimenti: viene aperto un ticket nuovo. Il mittente è il tecnico, quindi il cliente va indicato in X-TicketFarm-Cliente."}</span></div></details>`;
}
function drawDest(){
  const f = S.f, box = $("#dest"); if(!box) return;
  if(!f.client){ box.innerHTML = f.unknown ? mailPreview() : ""; return; }
  const c = cl(f.client);

    ${digits(f.number).length>=7 && !known ? `<label class="chk" style="margin-top:10px"><input type="checkbox" id="f-rem" ${f.remember?"checked":""}> Salva ${esc(f.number)} sul cliente in ${SRC[c.sys]}</label>`:""}`;
  box.insertAdjacentHTML("beforeend", mailPreview());
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ f.dest=b.dataset.d; drawDest(); });

function send(){
  const f = S.f;
  if(!f.msgs.length){ toast("Incolla il messaggio del cliente o allega una foto"); return; }
  if(!f.client && !f.unknown){ toast("Indica il cliente: scegline uno o tocca «Non lo trovo»"); return; }
  const c = f.client ? cl(f.client) : null;
  const from = (f.msgs.find(m=>m.from)||{}).from || "";
  const body = f.msgs.map(m=>m.text).join("\n");
  const fwd = {k:"fwd", kind:f.kind, from, t:f.time, text:body, lines:f.msgs.some(m=>m.time)?f.msgs:null, photos:f.photos};
  const note = f.note.trim();
  const saveNum = c && digits(f.number).length>=7 && f.remember && !c.contacts.some(k=>digits(k.tel)===digits(f.number));
  if(API) return sendLive(f, c, from, body, fwd, note, saveNum);
  if(saveNum){ c.contacts[0].tel = f.number; }
  let th, answer;
  if(c && f.dest !== "new"){
    th = S.threads.find(t=>t.ticket===f.dest);
    if(!th){ th = {ticket:f.dest, client:c.id, unread:false, msgs:[]}; S.threads.unshift(th); }
    th.msgs.push(fwd);
    answer = {k:"tf", t:"", text:"Messaggio aggiunto a "+f.dest+" in "+SRC[c.sys]+" e segnalato all'ufficio."+(saveNum?" Numero salvato sul contatto.":"")};
  } else if(c){
    ++S.seq; const id = c.sys==="Halo" ? "HALO-"+S.seq : "Tck #7142"+String(S.seq).slice(-2);
    th = {ticket:id, client:c.id, unread:false, msgs:[fwd]}; S.threads.unshift(th);
    c.open.unshift({id, t:body.slice(0,46)+(body.length>46?"…":"")});
    answer = {k:"tf", t:"", text:"Ticket "+id+" aperto in "+SRC[c.sys]+" per "+c.name+"."+(saveNum?" Numero salvato sul contatto.":""),
      forClient:"Buongiorno, abbiamo registrato la sua richiesta con il numero "+id+". La ricontattiamo al più presto. Grazie."};
  } else {
    const id = "TF-"+(++S.seq);
    th = {ticket:id, client:null, unread:false, msgs:[fwd]}; S.threads.unshift(th);
    answer = {k:"tf", t:"", text:"Ricevuto come "+id+". Non ho trovato il cliente: l'ufficio lo identifica e ti scrive qui."};
  }
  if(note) th.msgs.push({k:"me", t:nowStr(), text:note});
  answer.text += " Ora della richiesta: "+f.time+".";
  S.f = blankForm();
  show("messaggi");
  openChat(S.threads.indexOf(th));
  answer.t = nowStr();
  reply(th, answer);
  toast("Prova: la mail a "+SUPPORT+" non è partita davvero");
}

/* ---------- MAPPA: clienti e tappe consigliate ---------- */
/* Mappa OpenStreetMap con Leaflet 1.9.4 (copia in vendor/leaflet, caricata solo quando serve). Tappe = clienti con ticket aperti,
   ordinate per vicinanza (giro più corto partendo da dove sei) o per priorità (prima gli urgenti). */
const BASE_POS = {lat:46.0101, lng:8.9600, label:"Magazzino Lugano"};
S.map = {order:"vicinanza", all:false, pos:null};
let LMAP = null, LLAYER = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  return loadLeaflet.p = new Promise((ok, ko)=>{
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "vendor/leaflet/leaflet.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "vendor/leaflet/leaflet.js"; js.onload = ok; js.onerror = ()=>{ loadLeaflet.p = null; ko(new Error("mappa non disponibile senza rete")); }; document.head.appendChild(js);
  });
}
function km(a, b){ const R = 6371, t = x=>x*Math.PI/180, dLa = t(b.lat-a.lat), dLo = t(b.lng-a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const roadKm = d => d*1.3;   /* in linea d'aria ×1,3: stima della strada */
function plan(){
  const start = S.map.pos || BASE_POS;
  const stops = CLIENTS.filter(c=>c.lat && c.open && c.open.length).map(c=>({c, urg:c.open.some(o=>o.urg), ticket:c.open[0]}));
  const route = [];
  let here = start, left = stops.slice();
  if(S.map.order === "priorita"){
    /* prima tutti gli urgenti (dal più vicino), poi gli altri, sempre scegliendo il più vicino */
    for(const grp of [left.filter(x=>x.urg), left.filter(x=>!x.urg)]){
      let g = grp.slice();
      while(g.length){ g.sort((a,b)=>km(here,a.c)-km(here,b.c)); const n = g.shift(); n.d = km(here,n.c); route.push(n); here = n.c; }
    }
  } else {
    while(left.length){ left.sort((a,b)=>km(here,a.c)-km(here,b.c)); const n = left.shift(); n.d = km(here,n.c); route.push(n); here = n.c; }
  }
  return {start, route};
}
function renderMappa(){
  const el = $("#s-mappa"), {start, route} = plan();
  const tot = route.reduce((a,x)=>a+roadKm(x.d), 0);
  el.innerHTML = `<div><h2 class="sec">Mappa</h2><p class="sub">Clienti con ticket aperti e giro consigliato, partendo da ${S.map.pos ? "dove sei" : esc(BASE_POS.label)}</p></div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <div class="seg2" role="group" aria-label="Ordina le tappe">
        <button type="button" data-o="vicinanza" aria-pressed="${S.map.order==="vicinanza"}">Vicinanza</button>
        <button type="button" data-o="priorita" aria-pressed="${S.map.order==="priorita"}">Priorità</button>
      </div>
      <button class="btn small" type="button" id="m-pos">📍 ${S.map.pos ? "Aggiorna posizione" : "Usa la mia posizione"}</button>
    </div>
    <div class="mapbox" id="mapbox"><div class="empty">Carico la mappa…</div></div>
    <label class="chk"><input type="checkbox" id="m-all" ${S.map.all?"checked":""}> Mostra anche i clienti senza ticket aperti</label>
    <div class="row"><b>${route.length} tappe consigliate</b><span class="sub">circa ${Math.round(tot)} km</span></div>
    <ol class="stops">${route.map((x,i)=>`<li class="stop${x.urg?" urg":""}">
      <span class="sn">${i+1}</span>
      <div class="sbody"><div class="row" style="justify-content:flex-start;gap:8px">${logo(x.c)}<b>${esc(x.c.name)}</b>${x.urg?'<span class="pill p-urg">Urgente</span>':""}</div>
        <span class="sub">${esc(x.ticket.id)} · ${esc(x.ticket.t)}</span>
        <span class="sub">${esc(x.c.city||"")} · ${i?"dalla tappa prima":"da qui"} circa ${roadKm(x.d).toFixed(0)} km</span>
        <div class="row" style="justify-content:flex-start;gap:8px;margin-top:6px">
          <a class="btn small primary" href="https://www.google.com/maps/dir/?api=1&destination=${x.c.lat},${x.c.lng}" target="_blank" rel="noopener">Naviga</a>
          ${waBtn(firstTel(x.c), "", "WhatsApp")}
          <button class="btn small" type="button" data-fly="${x.c.id}">Sulla mappa</button></div></div></li>`).join("") || `<div class="empty">Nessun cliente con ticket aperti da visitare</div>`}</ol>
    <p class="hint">Distanze stimate in linea d'aria più il 30%. «Naviga» apre Google Maps (o l'app di navigazione del telefono) con la destinazione.</p>`;
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ S.map.order = b.dataset.o; renderMappa(); });
  $("#m-all").onchange = e => { S.map.all = e.target.checked; renderMappa(); };
  $("#m-pos").onclick = ()=>{
    if(!navigator.geolocation){ toast("Questo dispositivo non dà la posizione"); return; }
    navigator.geolocation.getCurrentPosition(p=>{ S.map.pos = {lat:p.coords.latitude, lng:p.coords.longitude}; renderMappa(); toast("Giro ricalcolato da dove sei"); },
      ()=>toast("Posizione non disponibile: parto da "+BASE_POS.label), {enableHighAccuracy:false, timeout:8000});
  };
  loadLeaflet().then(()=>drawMap(start, route)).catch(e=>{ $("#mapbox").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
  el.querySelectorAll("[data-fly]").forEach(b=>b.onclick=()=>{ const c = cl(b.dataset.fly); if(LMAP){ LMAP.flyTo([c.lat,c.lng], 13); $("#mapbox").scrollIntoView({behavior:"smooth", block:"center"}); } });
}
function drawMap(start, route){
  const box = $("#mapbox"); if(!box) return;
  if(LMAP){ LMAP.remove(); LMAP = null; }
  box.innerHTML = "";
  LMAP = L.map(box, {zoomControl:true, attributionControl:true});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:18, attribution:"© OpenStreetMap"}).addTo(LMAP);
  const pts = [[start.lat, start.lng]];
  L.marker([start.lat, start.lng], {icon:L.divIcon({className:"", html:'<span class="mk me">Tu</span>', iconSize:[34,34], iconAnchor:[17,17]})}).addTo(LMAP).bindPopup(S.map.pos ? "La tua posizione" : BASE_POS.label);
  route.forEach((x,i)=>{
    pts.push([x.c.lat, x.c.lng]);
    L.marker([x.c.lat, x.c.lng], {icon:L.divIcon({className:"", html:`<span class="mk${x.urg?" urg":""}">${i+1}</span>`, iconSize:[30,30], iconAnchor:[15,15]})}).addTo(LMAP)
      .bindPopup(`<b>${esc(x.c.name)}</b><br>${esc(x.ticket.id)} · ${esc(x.ticket.t)}<div class="pop-act"><a href="https://www.google.com/maps/dir/?api=1&destination=${x.c.lat},${x.c.lng}" target="_blank" rel="noopener">Naviga</a><button type="button" data-sheet="${x.c.id}">Scheda cliente</button></div>`);
  });
  if(S.map.all) CLIENTS.filter(c=>c.lat && !route.some(x=>x.c.id===c.id)).forEach(c=>{
    L.marker([c.lat, c.lng], {icon:L.divIcon({className:"", html:'<span class="mk off"></span>', iconSize:[16,16], iconAnchor:[8,8]})}).addTo(LMAP).bindPopup(`<b>${esc(c.name)}</b><br>Nessun ticket aperto<div class="pop-act"><a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank" rel="noopener">Naviga</a><button type="button" data-sheet="${c.id}">Scheda cliente</button></div>`);
    pts.push([c.lat, c.lng]);
  });
  if(route.length) L.polyline([[start.lat,start.lng], ...route.map(x=>[x.c.lat,x.c.lng])], {color:"#1aa0e8", weight:4, opacity:.8, dashArray:"8 8"}).addTo(LMAP);
  LMAP.fitBounds(pts, {padding:[30,30]});
  /* «Scheda cliente» nel fumetto apre la stessa scheda dell'elenco Clienti */
  box.addEventListener("click", e => { const b = e.target.closest("[data-sheet]"); if(b){ LMAP.closePopup(); clientSheet(b.dataset.sheet); } });
  setTimeout(()=>LMAP && LMAP.invalidateSize(), 150);
}


/* ---------- RIEPILOGO: promemoria del giorno (assistente AI) e prossime attività ---------- */
const HOME_TABS = [["riepilogo","Riepilogo"],["messaggi","Messaggi"],["mappa","Mappa"],["inoltra","Inoltra"],["clienti","Clienti"]];
const homeTab = () => { let h = ""; try{ h = localStorage.getItem("tf-home") || ""; }catch(e){} return HOME_TABS.some(([k])=>k===h) ? h : "riepilogo"; };
const AIM = {"claude-opus-5-5":"Claude Opus 5.5","claude-sonnet-5-5":"Claude Sonnet 5.5","claude-haiku-5-5":"Claude Haiku 5.5"};
const dayName = d => { const x = new Date(); x.setDate(x.getDate()+d); return x.toLocaleDateString("it-CH",{weekday:"long", day:"numeric", month:"long"}); };
function myWork(){
  const all = CLIENTS.flatMap(c=>(c.open||[]).map(o=>({...o, c})));
  const urgent = all.filter(t=>t.urg && !t.plan), today = all.filter(t=>t.plan && t.plan.day===0).sort((a,b)=>a.plan.time.localeCompare(b.plan.time));
  const later = all.filter(t=>t.plan && t.plan.day>0).sort((a,b)=>a.plan.day-b.plan.day || a.plan.time.localeCompare(b.plan.time));
  const waiting = all.filter(t=>!t.plan && !t.urg && /attesa/i.test(t.state||"")), todo = all.filter(t=>!urgent.includes(t) && !today.includes(t) && !later.includes(t) && !waiting.includes(t));
  return {urgent, today, later, waiting, todo};
}
function simulateAgenda(w){
  const f = [];
  if(w.urgent[0]) f.push("La priorità di oggi è "+w.urgent[0].c.name+": l'"+w.urgent[0].t.split(":")[0].toLowerCase()+" dà "+(w.urgent[0].t.split(":")[1]||"problemi").trim()+" ed è urgente ma non ancora pianificato, quindi chiama il cliente in mattinata e fissa l'intervento.");
  if(w.today[0]) f.push("Alle "+w.today[0].plan.time+" sei da "+w.today[0].c.name+" per la "+w.today[0].t.split(":").slice(-1)[0].trim()+": porta il kit di taratura.");
  if(w.later[0]) f.push((w.later[0].plan.day===1?"Domani":"Tra "+w.later[0].plan.day+" giorni")+" alle "+w.later[0].plan.time+" ti aspetta "+w.later[0].c.name+(/lampada/i.test(w.later[0].t)?": verifica di avere una lampada di ricambio.":"."));
  if(w.waiting[0]) f.push("Per "+w.waiting[0].c.name+" ("+w.waiting[0].id+") controlla se il ricambio è arrivato e, se sì, proponi una data.");
  const why = t => w.urgent.includes(t) ? "Urgente e senza data: va pianificato per primo." : w.today.includes(t) ? "È in agenda oggi alle "+t.plan.time+"." : w.later.includes(t) ? "Già pianificato: basta prepararsi." : w.waiting.includes(t) ? "Dipende dal ricambio: solo un controllo veloce." : "Da pianificare quando hai tempo.";
  return {source:"simulazione", model:"claude-opus-5-5", text:f.join(" ") || "Oggi non hai attività aperte.", order:[...w.urgent, ...w.today, ...w.waiting, ...w.later, ...w.todo].map(t=>({ticket:t.id, perche:why(t)}))};
}
const remClosed = () => { try{ return localStorage.getItem("tf-rem-closed")==="1"; }catch(e){ return false; } };
function renderRiepilogo(){
  const el = $("#s-riepilogo"), w = myWork();
  const when = t => w.urgent.includes(t) ? "Da pianificare" : t.plan ? (t.plan.day===0 ? "Oggi " : t.plan.day===1 ? "Domani " : dayName(t.plan.day)+" ")+t.plan.time : w.waiting.includes(t) ? "In attesa" : "Da fare";
  const list = [...w.urgent, ...w.today, ...w.later, ...w.waiting, ...w.todo];
  el.innerHTML = `<div><h2 class="sec">Riepilogo</h2><p class="sub">${esc(dayName(0).replace(/^./,x=>x.toUpperCase()))}</p></div>
    <section class="rcard${remClosed()?" closed":""}" id="r-rem" hidden><button class="r-head" type="button" id="r-tog" aria-expanded="${!remClosed()}"><span class="r-ic" aria-hidden="true">✦</span><b>Promemoria di oggi</b><span class="r-chev">${remClosed()?"Mostra":"Riduci"}</span></button>
      <div class="r-body"><p id="r-text" class="r-text">Sto preparando il promemoria…</p><span class="hint" id="r-foot"></span></div></section>
    <div class="r-nums">
      <div class="${w.urgent.length?"hot":""}"><b>${w.urgent.length}</b><span>urgenze</span></div>
      <div><b>${w.today.length}</b><span>oggi</span></div>
      <div><b>${w.later.length}</b><span>prossimi giorni</span></div>
    </div>
    <h3 class="r-h">Prossime attività</h3>
    <ol class="acts2" id="r-acts">${list.map(t=>`<li class="act2 ${w.urgent.includes(t)?"urg":w.waiting.includes(t)?"wait":""}" data-tid="${esc(t.id)}">
      <div class="sbody"><span class="when">${esc(when(t))}</span><div class="row" style="justify-content:flex-start;gap:8px">${logo(t.c)}<b>${esc(t.c.name)}</b>${t.urg?'<span class="pill p-urg">Urgente</span>':""}</div>
        <span class="sub">${esc(t.id)} · ${esc(t.t)}</span><span class="why" hidden></span>
        <div class="act2-x"><button class="btn small primary" type="button" data-open="${esc(t.id)}" data-c="${t.c.id}">Apri</button>${t.c.lat?`<a class="btn small" href="https://www.google.com/maps/dir/?api=1&destination=${t.c.lat},${t.c.lng}" target="_blank" rel="noopener">Naviga</a>`:""}${waBtn(firstTel(t.c), "", "WhatsApp")}<button class="btn small" type="button" data-sheet="${t.c.id}">Scheda</button></div></div></li>`).join("") || `<div class="empty">Nessuna attività aperta: ottimo lavoro.</div>`}</ol>`;
  el.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>clientSheet(b.dataset.sheet));
  /* «Apri»: la conversazione del ticket (se non c'è ancora, ne apre una nuova) */
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    let i = S.threads.findIndex(th=>th.ticket===b.dataset.open);
    if(i<0){ S.threads.unshift({ticket:b.dataset.open, client:b.dataset.c, unread:false, msgs:[]}); i = 0; }
    openChat(i);
  });
  $("#r-tog").onclick = ()=>{ const c = !remClosed(); try{ localStorage.setItem("tf-rem-closed", c?"1":""); }catch(e){} $("#r-rem").classList.toggle("closed", c); $("#r-tog").setAttribute("aria-expanded", String(!c)); $("#r-tog .r-chev").textContent = c?"Mostra":"Riduci"; };
  const show = (r, model) => {
    if(!$("#r-text")) return;
    $("#r-rem").hidden = false;
    $("#r-text").textContent = r.text || "Oggi non hai attività aperte.";
    $("#r-foot").textContent = r.source==="claude" ? "Scritto da "+(AIM[r.model]||r.model)+" con i tuoi ticket." : r.source==="simulazione" ? "Assistente AI · "+(AIM[model]||"Claude")+" · risposta di esempio" : r.source==="regole" ? "Promemoria scritto dalle regole (l'assistente non ha risposto)." : "Promemoria scritto dai tuoi ticket.";
    const ol = $("#r-acts"); (r.order||[]).forEach(x=>{ const li = ol.querySelector(`[data-tid="${CSS.escape(x.ticket)}"]`); if(!li) return; ol.appendChild(li); const s2 = li.querySelector(".why"); s2.hidden = false; s2.textContent = "✦ "+x.perche; });
  };
  /* il promemoria compare solo se l'assistente AI è stato acceso a mano in Configurazione */
  if(API) api("/api/app/ai").then(cfg=>{
      if(!cfg.enabled) return;
      return api("/api/app/ai/agenda").then(r=>{ if(r.source!=="spento") show(r, cfg.model); });
    }).catch(()=>{});
  else { let ai = null; try{ ai = JSON.parse(localStorage.getItem("tf-admin-ai")||"null"); }catch(e){}
    if(ai && ai.enabled) setTimeout(()=>show(simulateAgenda(w), ai.model||"claude-opus-5-5"), 800); }
}

function show(tab){

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.tab));

/* ---------- collegamento al backend ---------- */
function api(path, body){
  return fetch(API + path, {method: body ? "POST" : "GET", headers: {"Content-Type":"application/json", "Authorization":"Bearer "+TOKEN}, body: body ? JSON.stringify(body) : undefined})
    .then(async r => { const j = await r.json().catch(()=>({}));
      if(r.status === 401 && path !== "/api/app/login"){ logout(); throw new Error("accesso scaduto"); }
      if(!r.ok) throw new Error(j.error || ("errore "+r.status)); return j; });
}
function applyData(d){
  if(!d) return;
  CLIENTS = d.clients; S.threads = d.threads; SUPPORT = d.support; ME = d.me.mail;
  $("#who-zona").textContent = "Zona "+d.me.zona; $("#who-ini").textContent = d.me.ini;
  updateCount();
}
function reopen(ticket){ const i = S.threads.findIndex(t=>t.ticket===ticket); if(i>=0) openChat(i); }
function refresh(){
  api("/api/app/data").then(d=>{
    const open = S.openThread!=null && S.threads[S.openThread] ? S.threads[S.openThread].ticket : null;
    applyData(d);
    if(open){ S.openThread = S.threads.findIndex(t=>t.ticket===open); if(S.openThread>=0) drawMsgs(); }
    else if(S.tab==="messaggi") renderMessaggi();
  }).catch(()=>{});
}
function sendLive(f, c, from, body, fwd, note, saveNum){
  const b = $("#f-send"); b.disabled = true; b.textContent = "Invio…";
  api("/api/app/send", {kind:f.kind||"wa", from:(f.msgs.find(m=>m.from)||{}).from||"", body, lines:fwd.lines, time:f.time, client:c?c.id:null, dest:f.dest, number:f.number, remember:!!saveNum,
      note, mailFrom:f.mailFrom||"", subj:f.subj||"", files:f.files})
    .then(r=>{ S.f = blankForm(); applyData(r.data); show("messaggi"); reopen(r.ticket); toast("Mail inviata a "+SUPPORT); })
    .catch(e=>{ b.disabled = false; b.textContent = "Invia a Ticket Farm"; toast("Invio non riuscito: "+e.message+". Il messaggio resta qui, riprova."); });
}
/* foto ridotte a 1600 px in JPEG, così la mail resta leggera */
function shrink(file){
  return new Promise((ok)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, 1600/Math.max(img.width, img.height)); const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok({name:(file.name||"foto").replace(/\.\w+$/,"")+".jpg", type:"image/jpeg", data:cv.toDataURL("image/jpeg", .82).split(",")[1]}); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); ok(null); };
    img.src = url;
  });
}
function addPhotos(list, done){
  const f = S.f;
  Promise.all([...list].map(shrink)).then(arr=>{ f.files = (f.files||[]).concat(arr.filter(Boolean)); f.photos = f.files.length; done(); });
}

    <div id="l-hint"></div>
    <label class="field"><span>Mail</span><input class="input" id="l-mail" type="email" autocomplete="username" placeholder="nome@efuture.it"></label>
    <label class="field"><span>Codice</span><input class="input" id="l-code" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <button class="btn primary block" id="l-go" type="button">Accedi</button>`;
  /* in modalità prova il backend suggerisce le credenziali di esempio */
  api("/api/app/info").then(i=>{
    if(!i.demo) return;
    $("#l-mail").placeholder = i.demo.mail; $("#l-code").placeholder = i.demo.code;
    $("#l-mail").title = "Prova: mail = "+i.demo.mail+", codice = "+i.demo.code; $("#l-code").title = $("#l-mail").title;
    $("#l-hint").innerHTML = `<div class="banner">Modalità prova: mail = <b>${esc(i.demo.mail)}</b>, codice = <b>${esc(i.demo.code)}</b>
      <button class="linkbtn" id="l-fill" type="button" style="display:block;margin-top:6px">Compila e accedi</button></div>`;
    $("#l-fill").onclick = ()=>{ $("#l-mail").value = i.demo.mail; $("#l-code").value = i.demo.code; $("#l-go").click(); };
  }).catch(()=>{});
  $("#l-brand").onclick = replayIntro;
  $("#l-go").onclick = ()=>{
    const mail = $("#l-mail").value.trim(), code = $("#l-code").value.trim();
    if(!mail || !code){ toast("Scrivi mail e codice"); return; }
    api("/api/app/login", {mail, code}).then(r=>{ TOKEN = r.token; try{ localStorage.setItem("tf-token", TOKEN); }catch(e){} el.hidden = true; start(); })
      .catch(e=>toast("Accesso non riuscito: "+e.message));
  };
}
function logout(){ TOKEN = ""; try{ localStorage.removeItem("tf-token"); }catch(e){} renderLogin(); }
function profile(){
  const root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-bg" id="sb"><div class="sheet" role="dialog" aria-label="Profilo"><div class="grab"></div>
    <div class="client">${esc(ME)}</div><span class="sub">Le mail partono da questo indirizzo verso ${esc(SUPPORT)}.</span>
    <label class="field"><span>Schermata iniziale</span><select class="input" id="p-home">${HOME_TABS.map(([k,l])=>`<option value="${k}" ${k===homeTab()?"selected":""}>${l}</option>`).join("")}</select></label>
    ${API ? `<button class="btn block" id="p-out" type="button">Esci</button>` : `<span class="sub">Modalità prova: non serve accedere.</span>`}
    <button class="btn block" id="p-x" type="button">Chiudi</button></div></div>`;
  $("#sb").onclick = e => { if(e.target.id==="sb") root.innerHTML = ""; };
  $("#p-x").onclick = ()=>{ root.innerHTML = ""; };
  $("#p-home").onchange = e => { try{ localStorage.setItem("tf-home", e.target.value); }catch(err){} toast("All'apertura vedrai: "+HOME_TABS.find(([k])=>k===e.target.value)[1]); };
  if(API) $("#p-out").onclick = ()=>{ root.innerHTML = ""; logout(); };
}
function handleShare(){
  const q = new URLSearchParams(location.search);
  const shared = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
  if(!shared) return;
  history.replaceState(null, "", location.pathname);
  S.f = blankForm(); show("inoltra"); ingest(shared, "share");
}
function start(){
  if(!API){ show(homeTab()); handleShare(); return; }
  if(!TOKEN){ renderLogin(); return; }
  api("/api/app/data").then(d=>{ applyData(d); show(homeTab()); handleShare(); setInterval(refresh, 60000); })
    .catch(e=>{ if(TOKEN){ show(homeTab()); toast("Backend non raggiungibile: "+e.message); } });
}
function curTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("tf-theme", t); }catch(e){} paintTheme(); }
function paintTheme(){ const d = curTheme()==="dark", b = $("#theme"); b.setAttribute("aria-checked", String(d)); b.title = d ? "Tema scuro (tocca per il chiaro)" : "Tema chiaro (tocca per lo scuro)"; }
try{ const t = localStorage.getItem("tf-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#theme").onclick = ()=>setTheme(curTheme()==="dark" ? "light" : "dark");
paintTheme();
$("#who-ini").onclick = profile;
/* "Ticket Farm" in alto: rivede l'introduzione, poi login se non si è entrati, altrimenti la home (Messaggi) */
function replayIntro(){
  if(!window.tfSplash) return;
  window.tfSplash(()=>{
    $("#sheet-root").innerHTML = "";
    if(API && !TOKEN){ renderLogin(); return; }
    $("#login").hidden = true; S.f = blankForm(); show(homeTab());
  });
}
$("#brand").onclick = replayIntro;
/* proposta di installazione: Chrome/Edge su PC e Android usano il loro dialogo, su iPhone si spiega come fare */
(function(){
  const box = $("#install"), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let skip = false; try{ skip = localStorage.getItem("tf-install-x") === "1"; }catch(e){}
  if(standalone || skip) return;
  let evt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); evt = e; box.hidden = false; });
  window.addEventListener("appinstalled", () => { box.hidden = true; toast("Ticket Farm installata"); });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    $("#install-txt").textContent = "Per installarla: tocca Condividi e poi «Aggiungi alla schermata Home»";
    $("#install-go").hidden = true; box.hidden = false;
  }
  $("#install-go").onclick = () => { if(!evt) return; evt.prompt(); evt.userChoice.then(() => { box.hidden = true; evt = null; }); };
  $("#install-x").onclick = () => { box.hidden = true; try{ localStorage.setItem("tf-install-x", "1"); }catch(e){} };
})();
if(API){ CLIENTS = []; S.threads = []; }
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
start();
})();
</script>
</body>
</html>
