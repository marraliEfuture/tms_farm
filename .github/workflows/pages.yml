# Pubblica la cartella app/ su GitHub Pages a ogni modifica su main.
# Indirizzi: https://marrali4future.github.io/tms_farm/ (app) e .../tms_farm/admin/ (console), in modalità prova
# Una volta sola: Settings → Pages → Source: "GitHub Actions".
name: Pubblica app su GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", "backend/admin/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara il sito (app + console in prova)
        run: |
          mkdir -p _site/admin
          cp -r app/. _site/
          cp -r backend/admin/. _site/admin/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
