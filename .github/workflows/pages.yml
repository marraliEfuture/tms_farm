# FACOLTATIVO: pubblica la cartella app/ su GitHub Pages (solo modalità prova, o con backendUrl in config.js).
# Di solito non serve: l'app è già servita dal backend in /app/.
# GitHub Pages su un repository privato richiede un piano a pagamento. Si avvia a mano da Actions.
name: Pubblica app su GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
